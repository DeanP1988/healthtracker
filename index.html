                            className="flex-1 accent-amber-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('stressLevel', Number(lifestyleStress), 'Stress')}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-600 text-white"
                          >
                            {isStressLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* HRV */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-200">3. Overnight HRV</span>
                          <span className="font-mono text-pink-400 font-bold text-sm">{lifestyleHrv} ms</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="20"
                            max="100"
                            step="1"
                            value={lifestyleHrv}
                            onChange={(e) => setLifestyleHrv(Number(e.target.value))}
                            className="flex-1 accent-pink-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('hrvMs', Number(lifestyleHrv), 'HRV')}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-pink-600 text-white"
                          >
                            {isHrvLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Resting HR */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-200">4. Resting Heart Rate</span>
                          <span className="font-mono text-rose-400 font-bold text-sm">{lifestyleRestingHr} bpm</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="45"
                            max="95"
                            step="1"
                            value={lifestyleRestingHr}
                            onChange={(e) => setLifestyleRestingHr(Number(e.target.value))}
                            className="flex-1 accent-rose-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('restingHr', Number(lifestyleRestingHr), 'Resting HR')}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600 text-white"
                          >
                            {isRestingHrLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Water */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-200">5. Daily Water Intake</span>
                          <span className="font-mono text-cyan-400 font-bold text-sm">{(lifestyleWater / 1000).toFixed(1)} Litres</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="500"
                            max="5000"
                            step="100"
                            value={lifestyleWater}
                            onChange={(e) => setLifestyleWater(Number(e.target.value))}
                            className="flex-1 accent-cyan-400 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('waterTotalMl', Number(lifestyleWater), 'Water')}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-600 text-white"
                          >
                            {isWaterLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Active Burn */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-200">6. Active Energy Burn</span>
                          <span className="font-mono text-rose-400 font-bold text-sm">-{lifestyleCaloriesBurned} kcal</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="100"
                            max="1600"
                            step="50"
                            value={lifestyleCaloriesBurned}
                            onChange={(e) => setLifestyleCaloriesBurned(Number(e.target.value))}
                            className="flex-1 accent-rose-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('caloriesBurnedTotalKcal', Number(lifestyleCaloriesBurned), 'Active burn')}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600 text-white"
                          >
                            {isBurnLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Steps */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-slate-200">7. Daily Total Steps</span>
                          <span className="font-mono text-emerald-400 font-bold text-sm">{lifestyleSteps.toLocaleString()}</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="1000"
                            max="22000"
                            step="500"
                            value={lifestyleSteps}
                            onChange={(e) => setLifestyleSteps(Number(e.target.value))}
                            className="flex-1 accent-emerald-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('steps', Number(lifestyleSteps), 'Steps')}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white"
                          >
                            {isStepsLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                    </div>

                    <button
                      type="button"
                      onClick={handleSaveAllHabits}
                      className="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-xs shadow-md shadow-indigo-600/30 transition flex items-center justify-center space-x-2"
                    >
                      <Icon name="Check" className="w-4 h-4" />
                      <span>Submit All 7 Habits for {formatShortDate(lifestyleDate)}</span>
                    </button>
                  </div>
                )}

                {/* MEDS & SUPS FORM */}
                {addMode === 'medication' && (
                  <form onSubmit={handleAddMedication} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="ShieldCheck" className="w-4 h-4 mr-2 text-teal-400" />
                      Log Medication or Supplement
                    </h2>

                    <div className="space-y-1.5">
                      <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">
                        Quick-Select Common Supplements
                      </span>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { name: 'Magnesium', dose: '350mg', reason: 'Sleep & recovery' },
                          { name: 'Pre-Workout', dose: '1 scoop', reason: 'Energy / Caffeine' },
                          { name: 'Multivitamin', dose: '1 tab', reason: 'Daily nutrients' },
                          { name: 'Electrolytes', dose: '1 sachet', reason: 'Hydration' },
                          { name: 'Paracetamol', dose: '1000mg', reason: 'Pain relief' }
                        ].map((item, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => {
                              setMedName(item.name);
                              setMedDose(item.dose);
                              setMedReason(item.reason);
                            }}
                            className="text-xs px-2.5 py-1.5 rounded-xl bg-slate-950 text-slate-300 border border-slate-800 hover:text-white"
                          >
                            {item.name}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Name
                      </label>
                      <input
                        type="text"
                        value={medName}
                        onChange={(e) => setMedName(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-teal-500"
                        required
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-teal-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Save Medication / Supplement</span>
                    </button>
                  </form>
                )}

              </div>
            )}

            {/* ================= TAB 2: TIMELINE FEED ================= */}
            {activeTab === 'timeline' && (
              <div className="space-y-4">
                
                {/* Filter Pills */}
                <div className="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                  {[
                    { id: 'all', label: 'All' },
                    { id: 'meal', label: 'Meals' },
                    { id: 'symptom', label: 'Flares' },
                    { id: 'exercise', label: 'Workouts' },
                    { id: 'stool', label: 'Bowel' },
                    { id: 'medication', label: 'Meds & Sups' },
                    { id: 'lifestyle', label: 'Habits' }
                  ].map(f => {
                    const count = f.id === 'all' ? logs.length : logs.filter(l => l.type === f.id).length;
                    const isActive = timelineFilter === f.id;
                    return (
                      <button
                        key={f.id}
                        onClick={() => setTimelineFilter(f.id)}
                        className={`px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition flex items-center space-x-1.5 ${
                          isActive 
                            ? 'bg-indigo-600 text-white shadow-sm' 
                            : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200'
                        }`}
                      >
                        <span>{f.label}</span>
                        <span className="text-[10px] px-1 rounded-md bg-black/20 font-mono">{count}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Timeline Cards */}
                <div className="space-y-2.5">
                  {filteredTimelineLogs.length === 0 ? (
                    <div className="text-center py-12 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">
                      <Icon name="Filter" className="w-8 h-8 text-slate-600 mx-auto mb-2" />
                      <p className="text-sm font-semibold text-slate-300">No events found</p>
                      <p className="text-xs text-slate-500 mt-1">Add your first meal, flare, or workout using the Capture tab!</p>
                    </div>
                  ) : (
                    filteredTimelineLogs.map(item => {
                      let badgeColor = 'bg-slate-800 text-slate-300';
                      let iconName = 'Utensils';

                      if (item.type === 'meal') {
                        badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
                        iconName = 'Utensils';
                      } else if (item.type === 'symptom') {
                        badgeColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
                        iconName = 'AlertCircle';
                      } else if (item.type === 'exercise') {
                        badgeColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                        iconName = 'Flame';
                      } else if (item.type === 'stool') {
                        badgeColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
                        iconName = 'FileText';
                      } else if (item.type === 'medication') {
                        badgeColor = 'bg-teal-500/20 text-teal-300 border border-teal-500/30';
                        iconName = 'ShieldCheck';
                      } else if (item.type === 'lifestyle') {
                        badgeColor = 'bg-violet-500/20 text-violet-300 border border-violet-500/30';
                        iconName = 'Moon';
                      }

                      return (
                        <div
                          key={item.id}
                          className="bg-slate-900/70 p-3.5 rounded-2xl border border-slate-800/80 flex flex-col space-y-2.5 transition hover:border-slate-700/80"
                        >
                          <div className="flex items-start justify-between space-x-3">
                            <div className="flex items-start space-x-3 flex-1 min-w-0">
                              <div className={`p-2 rounded-xl shrink-0 ${badgeColor}`}>
                                <Icon name={iconName} className="w-4 h-4" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center space-x-2">
                                  <span className="text-xs font-bold text-white truncate">
                                    {item.title || item.name || 'Daily Habits'}
                                  </span>
                                  {item.caloriesKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40">
                                      +{item.caloriesKcal} kcal
                                    </span>
                                  )}
                                  {item.caloriesBurnedKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      -{item.caloriesBurnedKcal} kcal
                                    </span>
                                  )}
                                  {item.severity && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      Sev {item.severity}/5
                                    </span>
                                  )}
                                </div>

                                <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1 text-[11px] text-slate-400">
                                  {item.type === 'meal' && (
                                    <>
                                      <span>{item.proteinG || 0}g protein</span>
                                      <span>•</span>
                                      <span>{item.sugarG || 0}g sugar</span>
                                      <span>•</span>
                                      <span>{item.sodiumMg || 0}mg sodium</span>
                                    </>
                                  )}
                                  {item.type === 'exercise' && (
                                    <>
                                      <span>{item.durationMins} mins</span>
                                      <span>•</span>
                                      <span>RPE {item.intensity}/10</span>
                                      <span>•</span>
                                      <span>{item.steps?.toLocaleString()} steps</span>
                                    </>
                                  )}
                                  {item.type === 'lifestyle' && (
                                    <>
                                      <span>{item.sleepHours}h sleep</span>
                                      <span>•</span>
                                      <span>{item.hrvMs}ms HRV</span>
                                      <span>•</span>
                                      <span>{((item.waterTotalMl || 0)/1000).toFixed(1)}L water</span>
                                    </>
                                  )}
                                </div>
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="text-[10px] text-slate-400 block font-mono">{item.timestamp}</span>
                              <span className="text-[9px] text-slate-500 block">{formatShortDate(item.date)}</span>
                            </div>
                          </div>

                          {/* Edit & Delete row */}
                          <div className="flex items-center justify-end space-x-1.5 pt-1.5 border-t border-slate-800/60">
                            <button
                              type="button"
                              onClick={() => handleStartEdit(item)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-indigo-300 text-[10px] font-medium transition flex items-center space-x-1"
                            >
                              <Icon name="Edit2" className="w-3 h-3 text-indigo-400" />
                              <span>Edit</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => setDeletingItemId(item.id)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-800/60 text-slate-400 hover:text-rose-300 text-[10px] font-medium transition flex items-center space-x-1"
                            >
                              <Icon name="Trash2" className="w-3 h-3 text-rose-400" />
                              <span>Delete</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

              </div>
            )}

            {/* ================= TAB 3: TRENDS / ANALYTICS ================= */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-bold text-white flex items-center">
                    <Icon name="BarChart2" className="w-4 h-4 mr-1.5 text-indigo-400" />
                    Biometrics & Trends
                  </h2>
                  <div className="flex bg-slate-900 p-0.5 rounded-xl border border-slate-800 text-[10px]">
                    {[
                      { days: 7, label: '7D' },
                      { days: 14, label: '14D' },
                      { days: 30, label: '1M' },
                      { days: 90, label: '3M' }
                    ].map(item => (
                      <button
                        key={item.days}
                        onClick={() => setAnalyticsDaysRange(item.days)}
                        className={`px-2 py-1 rounded-lg font-semibold transition-all ${
                          analyticsDaysRange === item.days 
                            ? 'bg-indigo-600 text-white shadow-sm' 
                            : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 4 Cards Summary */}
                <div className="grid grid-cols-4 gap-2 bg-slate-900/70 p-3 rounded-2xl border border-slate-800/80 text-center">
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Net Cal</span>
                    <span className={`text-xs font-mono font-bold mt-0.5 block ${summaryMetrics.avgNetCalories >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                      {summaryMetrics.avgNetCalories > 0 ? `+${summaryMetrics.avgNetCalories}` : summaryMetrics.avgNetCalories}
                    </span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Avg Water</span>
                    <span className="text-xs font-mono font-bold text-cyan-400 mt-0.5 block">{summaryMetrics.avgWaterL} L</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Avg Protein</span>
                    <span className="text-xs font-mono font-bold text-indigo-400 mt-0.5 block">{summaryMetrics.avgProteinG}g</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Flare Free</span>
                    <span className="text-xs font-mono font-bold text-teal-400 mt-0.5 block">{summaryMetrics.symptomFreeDaysPct}%</span>
                  </div>
                </div>

                {/* Metric Selector (6 Categories with Full Colors) */}
                <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[10px]">
                  {[
                    { id: 'calories', label: 'Calories', icon: 'Flame', color: 'text-amber-400' },
                    { id: 'exercise', label: 'Activity', icon: 'Activity', color: 'text-emerald-400' },
                    { id: 'water', label: 'Water', icon: 'Droplets', color: 'text-cyan-400' },
                    { id: 'sodium_sugar', label: 'Salt/Sugar', icon: 'Utensils', color: 'text-purple-400' },
                    { id: 'hrv_stress', label: 'HRV', icon: 'Heart', color: 'text-pink-400' },
                    { id: 'symptoms', label: 'Flares', icon: 'AlertCircle', color: 'text-rose-400' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setActiveMetricTab(tab.id);
                        setSelectedChartPoint(null);
                      }}
                      className={`flex flex-col items-center py-1.5 rounded-xl transition ${
                        activeMetricTab === tab.id 
                          ? 'bg-slate-800 text-white font-bold border border-slate-700 shadow-sm' 
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      <Icon name={tab.icon} className={`w-3.5 h-3.5 mb-0.5 ${tab.color}`} />
                      <span className="truncate text-[9px]">{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* Energy Chart */}
                {activeMetricTab === 'calories' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <span className="font-bold text-white flex items-center">
                        <Icon name="Flame" className="w-3.5 h-3.5 text-amber-400 mr-1.5" />
                        Energy Balance (kcal)
                      </span>
                      <span className="text-[10px] font-mono text-slate-400">Intake (+) vs Burn (-)</span>
                    </div>

                    <div className="flex items-center justify-between gap-1.5 h-44 pt-2">
                      {aggregatedTimeSeries.map((d, idx) => {
                        const consumed = d.caloriesConsumedKcal || 0;
                        const burned = d.caloriesBurnedTotalKcal || 0;
                        const consumedHeightPct = Math.min(100, Math.round((consumed / 2200) * 100));
                        const burnedHeightPct = Math.min(100, Math.round((burned / 2200) * 100));

                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center h-full group min-w-0">
                            <div className="w-full flex-1 flex items-end justify-center px-1">
                              <div 
                                className="w-full max-w-[12px] bg-amber-400 rounded-t-md"
                                style={{ height: `${Math.max(consumed > 0 ? 8 : 0, consumedHeightPct)}%` }}
                              ></div>
                            </div>
                            <div className="w-full h-0.5 bg-slate-700/80 my-0.5"></div>
                            <div className="w-full flex-1 flex items-start justify-center px-1">
                              <div 
                                className="w-full max-w-[12px] bg-rose-500 rounded-b-md"
                                style={{ height: `${Math.max(burned > 0 ? 8 : 0, burnedHeightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 truncate mt-1">{d.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Activity & Steps Chart */}
                {activeMetricTab === 'exercise' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Activity" className="w-3.5 h-3.5 text-emerald-400 mr-1.5" />
                          Daily Step Count & Activity
                        </h3>
                        <p className="text-[10px] text-slate-400">Target: {targetSteps.toLocaleString()} steps/day</p>
                      </div>
                      <span className="text-[10px] font-mono bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-lg border border-emerald-500/30">
                        Motility
                      </span>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-40 pt-4">
                      {aggregatedTimeSeries.map((d, idx) => {
                        const steps = d.steps || 0;
                        const heightPct = Math.min(100, Math.round((steps / (targetSteps * 1.35)) * 100));
                        const reachedGoal = steps >= targetSteps;

                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group min-w-0">
                            <span className={`text-[7.5px] font-mono font-bold mb-0.5 truncate w-full text-center ${reachedGoal ? 'text-emerald-300' : 'text-slate-400'}`}>
                              {steps > 0 ? (steps > 999 ? `${(steps / 1000).toFixed(1)}k` : steps) : '0'}
                            </span>
                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                              <div 
                                className={`w-full rounded-lg transition-all duration-500 ${
                                  reachedGoal 
                                    ? 'bg-gradient-to-t from-emerald-600 to-teal-400 shadow-sm shadow-emerald-500/30' 
                                    : 'bg-gradient-to-t from-slate-700 to-emerald-500/80'
                                }`}
                                style={{ height: `${Math.max(8, heightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Hydration Chart */}
                {activeMetricTab === 'water' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400 mr-1.5" />
                          Hydration Intake (Litres)
                        </h3>
                        <p className="text-[10px] text-slate-400">Target: {(targetWaterMl / 1000).toFixed(1)} L/day</p>
                      </div>
                      <span className="text-[10px] font-mono bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-lg border border-cyan-500/30">
                        Fluid
                      </span>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-36 pt-4">
                      {aggregatedTimeSeries.map((d, idx) => {
                        const litres = (d.waterMl / 1000);
                        const heightPct = Math.min(100, Math.round((litres / ((targetWaterMl / 1000) * 1.3)) * 100));
                        const reachedTarget = d.waterMl >= targetWaterMl;

                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group min-w-0">
                            <span className={`text-[7.5px] font-mono mb-1 truncate w-full text-center ${reachedTarget ? 'text-cyan-300 font-bold' : 'text-slate-400'}`}>
                              {litres > 0 ? litres.toFixed(1) : '0'}
                            </span>
                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                              <div 
                                className={`w-full rounded-lg transition-all duration-500 ${
                                  reachedTarget
                                    ? 'bg-gradient-to-t from-cyan-600 to-teal-400 shadow-sm shadow-cyan-500/30'
                                    : 'bg-gradient-to-t from-slate-700 to-cyan-500/70'
                                }`}
                                style={{ height: `${Math.max(8, heightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Salt & Sugar Chart */}
                {activeMetricTab === 'sodium_sugar' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Utensils" className="w-3.5 h-3.5 text-purple-400 mr-1.5" />
                          Sodium vs Sugar Balance
                        </h3>
                        <p className="text-[10px] text-slate-400">Guides: &lt;2,300mg Sodium • &lt;25g Free Sugar</p>
                      </div>

                      <div className="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[9px]">
                        {['both', 'sodium', 'sugar'].map(mode => (
                          <button
                            key={mode}
                            onClick={() => setSaltSugarViewMode(mode)}
                            className={`px-2 py-0.5 rounded capitalize ${
                              saltSugarViewMode === mode 
                                ? 'bg-purple-600 text-white font-bold' 
                                : 'text-slate-400 hover:text-white'
                            }`}
                          >
                            {mode}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-44 pt-4">
                      {aggregatedTimeSeries.map((d, idx) => {
                        const sodium = d.sodiumMg || 0;
                        const sugar = d.sugarG || 0;
                        const sodiumPct = Math.min(100, Math.round((sodium / 2600) * 100));
                        const sugarPct = Math.min(100, Math.round((sugar / 50) * 100));

                        const isHighSodium = sodium >= 2000;
                        const isHighSugar = sugar >= 25;

                        const showSodium = saltSugarViewMode === 'both' || saltSugarViewMode === 'sodium';
                        const showSugar = saltSugarViewMode === 'both' || saltSugarViewMode === 'sugar';

                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group min-w-0">
                            <div className="flex flex-col items-center text-[7px] font-mono leading-tight mb-1 truncate w-full">
                              {showSodium && (
                                <span className={isHighSodium ? 'text-purple-300 font-bold' : 'text-slate-400'}>
                                  {sodium > 999 ? `${(sodium / 1000).toFixed(1)}k` : sodium}
                                </span>
                              )}
                              {showSugar && (
                                <span className={isHighSugar ? 'text-pink-300 font-bold' : 'text-slate-400'}>
                                  {sugar}g
                                </span>
                              )}
                            </div>

                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end justify-center gap-0.5 p-1 overflow-hidden">
                              {showSodium && (
                                <div 
                                  className={`w-full max-w-[12px] rounded-t-sm transition-all duration-500 ${
                                    isHighSodium
                                      ? 'bg-gradient-to-t from-purple-700 to-indigo-400 shadow-sm shadow-purple-500/40'
                                      : 'bg-gradient-to-t from-slate-700 to-purple-500'
                                  }`}
                                  style={{ height: `${Math.max(6, sodiumPct)}%` }}
                                  title={`Sodium: ${sodium}mg`}
                                ></div>
                              )}

                              {showSugar && (
                                <div 
                                  className={`w-full max-w-[12px] rounded-t-sm transition-all duration-500 ${
                                    isHighSugar
                                      ? 'bg-gradient-to-t from-rose-600 to-pink-400 shadow-sm shadow-pink-500/40'
                                      : 'bg-gradient-to-t from-slate-700 to-pink-500'
                                  }`}
                                  style={{ height: `${Math.max(6, sugarPct)}%` }}
                                  title={`Sugar: ${sugar}g`}
                                ></div>
                              )}
                            </div>

                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Overnight HRV Chart */}
                {activeMetricTab === 'hrv_stress' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Heart" className="w-3.5 h-3.5 text-pink-400 mr-1.5" />
                          Overnight HRV & Autonomic Recovery
                        </h3>
                        <p className="text-[10px] text-slate-400">Drops below 40ms correlate with systemic inflammation</p>
                      </div>
                      <span className="text-[10px] font-mono bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded-lg border border-pink-500/30">
                        Vitals
                      </span>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-40 pt-4">
                      {aggregatedTimeSeries.map((d, idx) => {
                        const hrv = d.hrvMs || 50;
                        const heightPct = Math.min(100, Math.round((hrv / 80) * 100));
                        const isLowHrv = hrv < 40;

                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group min-w-0">
                            <span className={`text-[7.5px] font-mono font-bold mb-0.5 truncate w-full text-center ${isLowHrv ? 'text-rose-400 font-extrabold' : 'text-slate-300'}`}>
                              {hrv}ms
                            </span>
                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                              <div 
                                className={`w-full rounded-lg transition-all duration-500 ${
                                  isLowHrv
                                    ? 'bg-gradient-to-t from-rose-700 to-red-500 shadow-sm shadow-rose-500/40'
                                    : 'bg-gradient-to-t from-pink-700 to-indigo-500'
                                }`}
                                style={{ height: `${Math.max(10, heightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Flares & Symptoms Burden Chart */}
                {activeMetricTab === 'symptoms' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="AlertCircle" className="w-3.5 h-3.5 text-rose-400 mr-1.5" />
                          Symptom Severity Burden
                        </h3>
                        <p className="text-[10px] text-slate-400">Total cumulative flare severity score</p>
                      </div>
                      <span className="text-[10px] font-mono bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-lg border border-rose-500/30">
                        Heatmap
                      </span>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-36 pt-4">
                      {aggregatedTimeSeries.map((d, idx) => {
                        const score = d.symptomScore;
                        const heightPct = Math.min(100, Math.round((score / 12) * 100));
                        const maxSev = d.maxSeverity;

                        return (
                          <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group min-w-0">
                            <span className={`text-[8px] font-mono mb-1 truncate w-full text-center ${maxSev >= 4 ? 'text-rose-400 font-bold' : maxSev > 0 ? 'text-amber-400' : 'text-slate-500'}`}>
                              {score > 0 ? score : '0'}
                            </span>
                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                              <div 
                                className={`w-full rounded-lg transition-all duration-500 ${
                                  maxSev >= 4
                                    ? 'bg-gradient-to-t from-rose-800 to-red-500 shadow-sm shadow-rose-500/30'
                                    : maxSev >= 3
                                    ? 'bg-gradient-to-t from-amber-700 to-rose-400'
                                    : score > 0
                                    ? 'bg-gradient-to-t from-emerald-700 to-amber-400'
                                    : 'bg-slate-800/40'
                                }`}
                                style={{ height: `${Math.max(6, heightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* ================= TAB 4: AI INSIGHTS ================= */}
            {activeTab === 'ai' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-indigo-900/60 via-slate-900 to-violet-950/40 p-4 rounded-3xl border border-indigo-500/30 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center">
                        <Icon name="Sparkles" className="w-4 h-4 text-white" />
                      </div>
                      <div>
                        <h2 className="text-sm font-bold text-white">Longitudinal AI Diagnostic</h2>
                        <p className="text-[10px] text-indigo-300">Cross-day correlation & root cause analysis</p>
                      </div>
                    </div>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Synthesizes multi-day entries across meals, workouts, overnight HRV, and hydration to pinpoint delayed triggers and baseline protectors.
                  </p>
                </div>
              </div>
            )}

          </main>

          {/* Live Barcode Scanner Camera Viewport Modal */}
          {showBarcodeScannerModal && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-between animate-in fade-in duration-200">
              
              {/* Scanner Top Bar */}
              <div className="px-5 pt-safe pt-4 pb-3 flex items-center justify-between z-20 bg-gradient-to-b from-black/80 to-transparent">
                <div className="flex items-center space-x-2">
                  <div className="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-300">
                    <Icon name="Barcode" className="w-4 h-4 text-emerald-400" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-white leading-tight">Australian Barcode Scanner</h3>
                    <p className="text-[10px] text-emerald-400 font-mono">Live Reticle • EAN-13 & NIP</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <button
                    type="button"
                    onClick={toggleScannerTorch}
                    className={`p-2 rounded-xl border transition ${
                      scannerTorchOn 
                        ? 'bg-amber-400 text-slate-950 border-amber-300 font-bold' 
                        : 'bg-slate-900/80 border-slate-700 text-slate-300 hover:text-white'
                    }`}
                    title="Toggle Flashlight"
                  >
                    <Icon name="Zap" className="w-4 h-4" />
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      stopBarcodeCamera();
                      setShowBarcodeScannerModal(false);
                    }}
                    className="p-2 rounded-xl bg-slate-900/80 border border-slate-700 text-slate-300 hover:text-white transition"
                    title="Close Scanner"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Viewport Reticle Box */}
              <div className="relative flex-1 flex items-center justify-center overflow-hidden p-6">
                <video
                  ref={videoRef}
                  playsInline
                  muted
                  className="absolute inset-0 w-full h-full object-cover"
                />

                {/* Dark Vignette Overlay with Center Window */}
                <div className="absolute inset-0 bg-black/50 pointer-events-none"></div>

                {/* Targeting Box */}
                <div className="relative w-64 h-64 sm:w-72 sm:h-72 rounded-3xl border-2 border-emerald-400/80 shadow-[0_0_0_9999px_rgba(0,0,0,0.5)] flex items-center justify-center overflow-hidden">
                  
                  {/* Corner Target Accents */}
                  <div className="absolute top-2 left-2 w-5 h-5 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
                  <div className="absolute top-2 right-2 w-5 h-5 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
                  <div className="absolute bottom-2 left-2 w-5 h-5 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
                  <div className="absolute bottom-2 right-2 w-5 h-5 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>

                  {/* Animated Laser Scanning Line */}
                  <div className="absolute left-3 right-3 h-0.5 bg-gradient-to-r from-transparent via-emerald-400 to-transparent shadow-[0_0_12px_#34d399] scanner-laser-line"></div>

                  <span className="text-[11px] font-semibold text-emerald-200/90 bg-black/60 px-3 py-1 rounded-full border border-emerald-500/30 backdrop-blur-sm pointer-events-none">
                    Align barcode inside window
                  </span>
                </div>
              </div>

              {/* Scanner Bottom Action Controls */}
              <div className="px-5 pb-safe pb-5 z-20 space-y-3 bg-gradient-to-t from-black via-black/90 to-transparent">
                <div className="text-center text-xs text-slate-300">
                  <span>Auto-detects Woolworths, Coles & Australian food products</span>
                </div>

                {/* Fallback Manual Entry Barcode Input */}
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={manualBarcodeCode}
                    onChange={(e) => setManualBarcodeCode(e.target.value)}
                    placeholder="Or type digits (e.g. 9300633...)"
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder:text-slate-500 font-mono focus:outline-none focus:border-emerald-400"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      if (manualBarcodeCode.trim()) {
                        lookupBarcodeNutritionalData(manualBarcodeCode);
                      }
                    }}
                    disabled={!manualBarcodeCode.trim() || isScanningBarcode}
                    className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition disabled:opacity-40 shrink-0"
                  >
                    Lookup
                  </button>
                </div>

                <div className="flex gap-2">
                  <label className="flex-1 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white text-xs font-semibold flex items-center justify-center space-x-1.5 cursor-pointer active:scale-95 transition">
                    <Icon name="Camera" className="w-3.5 h-3.5 text-indigo-400" />
                    <span>Upload Packaging Photo</span>
                    <input
                      type="file"
                      accept="image/*"
                      className="hidden"
                      onChange={(e) => {
                        stopBarcodeCamera();
                        setShowBarcodeScannerModal(false);
                        handleBarcodeUpload(e);
                      }}
                    />
                  </label>

                  <button
                    type="button"
                    onClick={() => {
                      stopBarcodeCamera();
                      setShowBarcodeScannerModal(false);
                    }}
                    className="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs font-semibold transition"
                  >
                    Cancel
                  </button>
                </div>
              </div>

            </div>
          )}

          {/* Dedicated Modal 1: Daily Goals & Targets (Moved Out of Settings) */}
          {showGoalsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white flex items-center">
                    <Icon name="Target" className="w-4 h-4 mr-2 text-indigo-400" />
                    Daily Goals & Metabolism
                  </h3>
                  <button
                    onClick={() => setShowGoalsModal(false)}
                    className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                {/* Body Weight Setting */}
                <div className="space-y-1.5 bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Flame" className="w-3.5 h-3.5 mr-1 text-emerald-400" /> Body Weight (Metabolism)
                    </span>
                    <span className="text-emerald-400 font-mono font-bold">
                      {tempWeightKg} kg ({(tempWeightKg * 2.20462).toFixed(1)} lbs)
                    </span>
                  </div>
                  <input
                    type="range"
                    min="40"
                    max="160"
                    step="1"
                    value={tempWeightKg}
                    onChange={(e) => setTempWeightKg(Number(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                    <span>40kg</span>
                    <span>75kg (Default)</span>
                    <span>160kg</span>
                  </div>
                </div>

                {/* Daily Steps Target */}
                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Activity" className="w-3.5 h-3.5 mr-1 text-emerald-400" /> Daily Steps Target
                    </span>
                    <span className="text-emerald-400 font-mono font-bold">{tempSteps.toLocaleString()}</span>
                  </div>
                  <input
                    type="range"
                    min="3000"
                    max="20000"
                    step="500"
                    value={tempSteps}
                    onChange={(e) => setTempSteps(Number(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                    <span>3,000</span>
                    <span>8,000 (Avg)</span>
                    <span>20,000</span>
                  </div>
                </div>

                {/* Daily Water Target Setting */}
                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Droplets" className="w-3.5 h-3.5 mr-1 text-cyan-400" /> Daily Water Target
                    </span>
                    <span className="text-cyan-400 font-mono font-bold">{tempWaterL} Litres</span>
                  </div>
                  <input
                    type="range"
                    min="1.0"
                    max="5.0"
                    step="0.1"
                    value={tempWaterL}
                    onChange={(e) => setTempWaterL(e.target.value)}
                    className="w-full accent-cyan-400 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                    <span>1.0L</span>
                    <span>2.5L (Default)</span>
                    <span>5.0L</span>
                  </div>
                </div>

                <div className="pt-2 flex gap-2">
                  <button
                    type="button"
                    onClick={() => setShowGoalsModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={saveSettings}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-500 shadow-md"
                  >
                    Save Targets
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 2: System Settings, Push Notifications & Data Backup */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-1 border-b border-slate-800">
                  <h3 className="text-sm font-bold text-white flex items-center">
                    <Icon name="Settings" className="w-4 h-4 mr-2 text-indigo-400" />
                    App Settings & Alerts
                  </h3>
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                {/* Push Notifications Section */}
                <div className="space-y-3 bg-slate-950/70 p-3.5 rounded-2xl border border-indigo-500/30">
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-white flex items-center">
                        <Icon name="Bell" className="w-3.5 h-3.5 mr-1.5 text-indigo-400" />
                        Push Notifications
                      </span>
                      <span className="text-[10px] text-slate-400 block mt-0.5">
                        Status: <strong className={notifPermission === 'granted' ? 'text-emerald-400' : 'text-amber-400'}>
                          {notifPermission === 'granted' ? 'Enabled' : notifPermission === 'denied' ? 'Blocked' : 'Action Required'}
                        </strong>
                      </span>
                    </div>

                    {notifPermission !== 'granted' ? (
                      <button
                        type="button"
                        onClick={requestNotificationPermission}
                        className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold shadow-md shadow-indigo-600/30 transition active:scale-95"
                      >
                        Enable
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={sendTestNotification}
                        className="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 hover:text-white text-[10px] font-medium transition"
                      >
                        Test Alert
                      </button>
                    )}
                  </div>

                  {/* List of Granular Notification Toggles */}
                  <div className="pt-2 border-t border-slate-800/80 space-y-2.5">
                    <span className="text-[9.5px] uppercase font-bold tracking-wider text-slate-400 block">
                      Alert Preferences
                    </span>

                    {/* Toggle 1: Missing Habits End of Day */}
                    <label className="flex items-start justify-between gap-2 cursor-pointer">
                      <div className="flex-1 pr-2">
                        <span className="text-xs font-semibold text-slate-200 block">End-of-Day Missing Habits</span>
                        <span className="text-[10px] text-slate-500 leading-tight block">
                          Alert at 8:30 pm if any of the 7 daily vitals (Sleep, HRV, Stress, etc.) have not been submitted.
                        </span>
                      </div>
                      <input
                        type="checkbox"
                        checked={notifToggles.habitsMissingEndOfDay}
                        onChange={(e) => updateNotifToggle('habitsMissingEndOfDay', e.target.checked)}
                        className="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600 cursor-pointer"
                      />
                    </label>

                    {/* Toggle 2: Water Below Target */}
                    <label className="flex items-start justify-between gap-2 cursor-pointer">
                      <div className="flex-1 pr-2">
                        <span className="text-xs font-semibold text-slate-200 block">Hydration Goal Deficit</span>
                        <span className="text-[10px] text-slate-500 leading-tight block">
                          Alert at 3:00 pm if consumed water is below {(targetWaterMl / 1000).toFixed(1)}L to prevent dehydration headaches.
                        </span>
                      </div>
                      <input
                        type="checkbox"
                        checked={notifToggles.waterBelowTarget}
                        onChange={(e) => updateNotifToggle('waterBelowTarget', e.target.checked)}
                        className="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600 cursor-pointer"
                      />
                    </label>

                    {/* Toggle 3: Steps Behind Target Midday */}
                    <label className="flex items-start justify-between gap-2 cursor-pointer">
                      <div className="flex-1 pr-2">
                        <span className="text-xs font-semibold text-slate-200 block">Step Motility Check</span>
                        <span className="text-[10px] text-slate-500 leading-tight block">
                          Afternoon prompt if steps are under 4,000 to encourage gut transit movement.
                        </span>
                      </div>
                      <input
                        type="checkbox"
                        checked={notifToggles.stepsBehindMidday}
                        onChange={(e) => updateNotifToggle('stepsBehindMidday', e.target.checked)}
                        className="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600 cursor-pointer"
                      />
                    </label>

                    {/* Toggle 4: Post-Meal Flare Check */}
                    <label className="flex items-start justify-between gap-2 cursor-pointer">
                      <div className="flex-1 pr-2">
                        <span className="text-xs font-semibold text-slate-200 block">Post-Meal Reaction Prompt</span>
                        <span className="text-[10px] text-slate-500 leading-tight block">
                          Ping 90 mins after logging a meal tagged with potential triggers (dairy, gluten, sugar).
                        </span>
                      </div>
                      <input
                        type="checkbox"
                        checked={notifToggles.postMealSymptomCheck}
                        onChange={(e) => updateNotifToggle('postMealSymptomCheck', e.target.checked)}
                        className="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600 cursor-pointer"
                      />
                    </label>

                    {/* Toggle 5: Late Night Curfew */}
                    <label className="flex items-start justify-between gap-2 cursor-pointer">
                      <div className="flex-1 pr-2">
                        <span className="text-xs font-semibold text-slate-200 block">Late Night Kitchen Curfew</span>
                        <span className="text-[10px] text-slate-500 leading-tight block">
                          Gentle reminder 2 hours before bed to safeguard overnight HRV recovery.
                        </span>
                      </div>
                      <input
                        type="checkbox"
                        checked={notifToggles.lateNightCurfew}
                        onChange={(e) => updateNotifToggle('lateNightCurfew', e.target.checked)}
                        className="mt-1 w-4 h-4 rounded bg-slate-900 border-slate-700 accent-indigo-600 cursor-pointer"
                      />
                    </label>
                  </div>
                </div>

                {/* Data Backup & Restore Controls */}
                <div className="pt-2 border-t border-slate-800 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
                    Data Retention & Backup (Multi-Year)
                  </span>
                  <p className="text-[10px] text-slate-500 leading-tight">
                    Back up your health logs as JSON or restore from a previously exported backup:
                  </p>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute("href", dataStr);
                        downloadAnchor.setAttribute("download", `pulsehealth_backup_${new Date().toISOString().split('T')[0]}.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                        showToast('Backup JSON downloaded!');
                      }}
                      className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[10px] font-semibold flex items-center justify-center space-x-1.5 transition active:scale-95"
                    >
                      <Icon name="Download" className="w-3.5 h-3.5 text-indigo-400" />
                      <span>Download JSON</span>
                    </button>
                    <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[10px] font-semibold flex items-center justify-center space-x-1.5 cursor-pointer transition active:scale-95">
                      <Icon name="RefreshCw" className="w-3.5 h-3.5 text-emerald-400" />
                      <span>Restore JSON</span>
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (event) => {
                            try {
                              const parsed = JSON.parse(event.target.result);
                              if (Array.isArray(parsed)) {
                                setLogs(parsed);
                                showToast(`Successfully restored ${parsed.length} records!`);
                                setShowSettingsModal(false);
                              } else {
                                showToast('Invalid backup format (must be array)');
                              }
                            } catch (err) {
                              showToast('Invalid JSON backup file');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>

                {/* GitHub Deployment & Version Update Checker */}
                <div className="pt-2 border-t border-slate-800 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-400 flex items-center">
                      <Icon name="GitBranch" className="w-3 h-3 mr-1 text-indigo-400" />
                      Check for App Updates
                    </span>
                    <span className="text-[9px] font-mono text-slate-500">
                      Build: {localStorage.getItem('pulsehealth_installed_commit_sha') || 'v1.0.0'}
                    </span>
                  </div>

                  <div className="bg-slate-950/90 border border-slate-800/90 rounded-2xl p-2.5 space-y-1.5 text-[11px] text-slate-300">
                    <div className="flex items-center space-x-1.5 text-indigo-300 font-semibold text-[11px]">
                      <Icon name="Info" className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                      <span>What do I type in this box?</span>
                    </div>
                    <p className="text-[10.5px] text-slate-400 leading-relaxed">
                      Enter the <strong className="text-slate-200">GitHub username</strong> and <strong className="text-slate-200">repository name</strong> where you uploaded this <code className="text-indigo-300 font-mono text-[10px]">index.html</code> file (e.g. GitHub Pages).
                    </p>
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-2 font-mono text-[10px] text-slate-300 space-y-0.5">
                      <span className="text-slate-500 block text-[9px] font-sans uppercase font-bold tracking-wider">Format examples:</span>
                      <div className="text-emerald-400 font-bold">your-username/pulsehealth</div>
                      <div className="text-slate-500 truncate">https://github.com/your-username/pulsehealth</div>
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">
                      GitHub Repository Path
                    </label>
                    <input
                      type="text"
                      value={githubRepo}
                      onChange={(e) => {
                        setGithubRepo(e.target.value);
                        try {
                          localStorage.setItem('pulsehealth_github_repo', e.target.value);
                        } catch(err) {}
                      }}
                      placeholder="e.g. johnsmith/pulsehealth"
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 font-mono"
                    />

                    <button
                      type="button"
                      onClick={checkForAppUpdate}
                      disabled={isCheckingUpdate || !githubRepo.trim()}
                      className="w-full py-2.5 bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-200 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center space-x-1.5 transition disabled:opacity-40 active:scale-[0.99]"
                    >
                      <Icon name="RefreshCw" className={`w-3.5 h-3.5 ${isCheckingUpdate ? 'animate-spin' : ''}`} />
                      <span>{isCheckingUpdate ? 'Connecting to GitHub API...' : 'Check for Updates Now'}</span>
                    </button>
                  </div>

                  {updateStatus && (
                    <div className={`p-2.5 rounded-xl border text-xs space-y-2 ${
                      updateStatus.available
                        ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200'
                        : 'bg-slate-950 border-slate-800 text-slate-400'
                    }`}>
                      <p className="leading-snug text-[11px]">{updateStatus.message}</p>
                      {updateStatus.available && (
                        <button
                          type="button"
                          onClick={handleApplyAppUpdate}
                          className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold shadow-md shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5"
                        >
                          <Icon name="DownloadCloud" className="w-3.5 h-3.5" />
                          <span>Update & Reload App Now</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>

                <div className="pt-2">
                  <button
                    type="button"
                    onClick={() => setShowSettingsModal(false)}
                    className="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700"
                  >
                    Close Settings
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Confirmation Modal */}
          {deletingItemId && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4">
                <div className="flex items-center space-x-2 text-rose-400">
                  <Icon name="Trash2" className="w-5 h-5 text-rose-400" />
                  <h3 className="text-sm font-bold text-white">Delete Entry?</h3>
                </div>
                <p className="text-xs text-slate-300">Are you sure you want to delete this event?</p>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setDeletingItemId(null)}
                    className="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => handleDeleteLog(deletingItemId)}
                    className="flex-1 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold"
                  >
                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Floating Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/95 backdrop-blur-lg border-t border-slate-900 px-6 py-2.5 z-40 pb-safe">
            <div className="flex items-center justify-between">
              {[
                { id: 'add', label: 'Capture', icon: 'Plus' },
                { id: 'timeline', label: 'Timeline', icon: 'Calendar' },
                { id: 'analytics', label: 'Trends', icon: 'BarChart2' },
                { id: 'ai', label: 'AI Insights', icon: 'Sparkles' }
              ].map(tab => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center py-1 transition ${
                      isActive ? 'text-indigo-400' : 'text-slate-500 hover:text-slate-300'
                    }`}
                  >
                    <div className={`p-1.5 rounded-xl transition ${isActive ? 'bg-indigo-500/20 shadow-sm' : ''}`}>
                      <Icon name={tab.icon} className="w-5 h-5" />
                    </div>
                    <span className={`text-[10px] mt-0.5 font-medium ${isActive ? 'font-bold text-slate-100' : ''}`}>
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </nav>

        </div>
      );
    }

    // Render the React application into DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
