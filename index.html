  <!-- iOS Touch Icons: Pre-populated with High-Res PNG Canvas Generator (Resolves iOS fallback 'P' letter) -->
  <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="">
  <link id="apple-touch-icon-precomposed" rel="apple-touch-icon-precomposed" href="">
  <link id="favicon-icon" rel="icon" type="image/png" href="">

  <script>
    // iOS Safari requires a raster PNG (not raw SVG) for Apple Touch Icons, otherwise it generates a generic letter icon ('P').
    (function generateRasterAppIcon() {
      try {
        const size = 192;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Background rounded rectangle
        ctx.fillStyle = '#060913';
        ctx.fillRect(0, 0, size, size);

        // Ambient radial glow
        const glow = ctx.createRadialGradient(size * 0.5, size * 0.45, 10, size * 0.5, size * 0.45, size * 0.65);
        glow.addColorStop(0, '#4338ca');
        glow.addColorStop(0.55, '#1e1b4b');
        glow.addColorStop(1, '#050814');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);

        // Biometric Heart Silhouette
        ctx.save();
        ctx.translate(size * 0.5, size * 0.46);
        ctx.beginPath();
        const topCurveHeight = size * 0.22;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(-size * 0.05, -size * 0.12, -size * 0.38, -size * 0.12, -size * 0.38, topCurveHeight * 0.6);
        ctx.bezierCurveTo(-size * 0.38, size * 0.32, 0, size * 0.42, 0, size * 0.52);
        ctx.bezierCurveTo(0, size * 0.42, size * 0.38, size * 0.32, size * 0.38, topCurveHeight * 0.6);
        ctx.bezierCurveTo(size * 0.38, -size * 0.12, size * 0.05, -size * 0.12, 0, topCurveHeight);
        ctx.closePath();

        const heartGrad = ctx.createLinearGradient(-size * 0.3, -size * 0.2, size * 0.3, size * 0.4);
        heartGrad.addColorStop(0, 'rgba(251, 113, 133, 0.4)');
        heartGrad.addColorStop(0.5, 'rgba(225, 29, 72, 0.45)');
        heartGrad.addColorStop(1, 'rgba(159, 18, 57, 0.25)');
        ctx.fillStyle = heartGrad;
        ctx.fill();
        ctx.restore();

        // Neon ECG Waveform
        const pts = [
          [0.12, 0.53], [0.28, 0.53], [0.35, 0.38], [0.44, 0.72],
          [0.53, 0.32], [0.61, 0.62], [0.68, 0.47], [0.74, 0.53], [0.88, 0.53]
        ];
        
        // Outer Glow stroke
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0][0] * size, pts[0][1] * size);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i][0] * size, pts[i][1] * size);
        }
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Core Gradient stroke
        const lineGrad = ctx.createLinearGradient(size * 0.12, 0, size * 0.88, 0);
        lineGrad.addColorStop(0, '#38bdf8');
        lineGrad.addColorStop(0.4, '#818cf8');
        lineGrad.addColorStop(0.75, '#34d399');
        lineGrad.addColorStop(1, '#10b981');
        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 7;
        ctx.stroke();

        // Vitality Sparkle point
        ctx.beginPath();
        ctx.arc(pts[pts.length - 1][0] * size, pts[pts.length - 1][1] * size, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#34d399';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();

        const pngUrl = canvas.toDataURL('image/png');
        document.getElementById('apple-touch-icon').setAttribute('href', pngUrl);
        document.getElementById('apple-touch-icon-precomposed').setAttribute('href', pngUrl);
        document.getElementById('favicon-icon').setAttribute('href', pngUrl);
      } catch (e) {
        console.error('Failed to generate raster app icon', e);
      }
    })();
  </script>

<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root" class="h-full"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // Lightweight icon helper using Lucide
    function Icon({ name, className = "w-4 h-4", ...props }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        const iconName = name.replace(/([A-Z])/g, '-$1').toLowerCase().replace(/^-/, '');
        containerRef.current.innerHTML = `<i data-lucide="${iconName}" class="${className}"></i>`;
        window.lucide.createIcons({
          root: containerRef.current,
          attrs: { class: className }
        });
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" {...props} />;
    }

    // Default clean logs (empty array so no dummy data clutters user's device)
    const INITIAL_LOGS = [];

    function App() {
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('pulsehealth_logs');
          return saved ? JSON.parse(saved) : INITIAL_LOGS;
        } catch {
          return INITIAL_LOGS;
        }
      });

      const [activeTab, setActiveTab] = useState('add'); // 'add', 'timeline', 'analytics', 'ai'
      const [addMode, setAddMode] = useState('meal'); // 'meal', 'symptom', 'stool', 'exercise', 'lifestyle', 'medication'

      // User Profile & Goals
      const [targetSteps, setTargetSteps] = useState(() => {
        try {
          const s = localStorage.getItem('pulsehealth_target_steps');
          return s ? Number(s) : 8000;
        } catch { return 8000; }
      });
      const [targetWaterMl, setTargetWaterMl] = useState(() => {
        try {
          const w = localStorage.getItem('pulsehealth_target_water');
          return w ? Number(w) : 2500;
        } catch { return 2500; }
      });
      const [userWeightKg, setUserWeightKg] = useState(() => {
        try {
          const savedWeight = localStorage.getItem('pulsehealth_user_weight');
          return savedWeight ? Number(savedWeight) : 75;
        } catch {
          return 75;
        }
      });

      // Modals State: Separated Goals & Metabolism from System Settings
      const [showGoalsModal, setShowGoalsModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      const [tempSteps, setTempSteps] = useState(8000);
      const [tempWaterL, setTempWaterL] = useState('2.5');
      const [tempWeightKg, setTempWeightKg] = useState(75);

      // Push Notification Settings State
      const [notifPermission, setNotifPermission] = useState(() => {
        if (typeof window !== 'undefined' && 'Notification' in window) {
          return Notification.permission;
        }
        return 'default';
      });

      const [notifToggles, setNotifToggles] = useState(() => {
        try {
          const saved = localStorage.getItem('pulsehealth_notif_toggles');
          return saved ? JSON.parse(saved) : {
            habitsMissingEndOfDay: true,
            waterBelowTarget: true,
            stepsBehindMidday: false,
            postMealSymptomCheck: true,
            lateNightCurfew: false
          };
        } catch {
          return {
            habitsMissingEndOfDay: true,
            waterBelowTarget: true,
            stepsBehindMidday: false,
            postMealSymptomCheck: true,
            lateNightCurfew: false
          };
        }
      });

      const updateNotifToggle = (key, val) => {
        setNotifToggles(prev => {
          const updated = { ...prev, [key]: val };
          try {
            localStorage.setItem('pulsehealth_notif_toggles', JSON.stringify(updated));
          } catch(e) {}
          return updated;
        });
      };

      const requestNotificationPermission = async () => {
        if (!('Notification' in window)) {
          showToast('Notifications not supported in this browser');
          return;
        }

        try {
          const permission = await Notification.requestPermission();
          setNotifPermission(permission);
          if (permission === 'granted') {
            showToast('Push notifications enabled!');
            new Notification('PulseHealth Active', {
              body: 'Health alerts & habits check-ins are now enabled.',
              icon: document.getElementById('apple-touch-icon')?.getAttribute('href') || ''
            });
          } else if (permission === 'denied') {
            showToast('Permission blocked. Enable in iOS/Browser Settings.');
          }
        } catch (err) {
          console.error(err);
          showToast('Error requesting notification permission');
        }
      };

      const sendTestNotification = () => {
        if (!('Notification' in window) || Notification.permission !== 'granted') {
          showToast('Please enable notifications first!');
          return;
        }

        new Notification('PulseHealth • Daily Alert Test', {
          body: 'Habits Check-in: 3 items missing for today. Tap to log now.',
          icon: document.getElementById('apple-touch-icon')?.getAttribute('href') || ''
        });
        showToast('Test notification sent!');
      };

      // GitHub Update Checker State
      const [githubRepo, setGithubRepo] = useState(() => {
        try {
          return localStorage.getItem('pulsehealth_github_repo') || '';
        } catch {
          return '';
        }
      });
      const [isCheckingUpdate, setIsCheckingUpdate] = useState(false);
      const [updateStatus, setUpdateStatus] = useState(null);

      // Timeline Filters & Editing
      const [timelineFilter, setTimelineFilter] = useState('all');
      const [editingItem, setEditingItem] = useState(null);
      const [deletingItemId, setDeletingItemId] = useState(null);

      // Analytics State
      const [analyticsDaysRange, setAnalyticsDaysRange] = useState(7);
      const [analyticsAggregation, setAnalyticsAggregation] = useState('auto');
      const [activeMetricTab, setActiveMetricTab] = useState('calories');
      const [saltSugarViewMode, setSaltSugarViewMode] = useState('both');
      const [selectedChartPoint, setSelectedChartPoint] = useState(null);

      // Form States - Meal
      const [mealTitle, setMealTitle] = useState('');
      const [mealTags, setMealTags] = useState([]);
      const [mealCalories, setMealCalories] = useState(0);
      const [mealProtein, setMealProtein] = useState(0);
      const [mealCarbs, setMealCarbs] = useState(0);
      const [mealSugar, setMealSugar] = useState(0);
      const [mealSodium, setMealSodium] = useState(0);
      const [mealWater, setMealWater] = useState(0);
      const [mealPace, setMealPace] = useState('relaxed');
      const [mealPosture, setMealPosture] = useState('table');
      const [isLateNight, setIsLateNight] = useState(false);
      const [isAnalyzingPhoto, setIsAnalyzingPhoto] = useState(false);
      const [isEstimatingMealAI, setIsEstimatingMealAI] = useState(false);
      const [isScanningBarcode, setIsScanningBarcode] = useState(false);

      // Live Barcode Scanner Modal State
      const [showBarcodeScannerModal, setShowBarcodeScannerModal] = useState(false);
      const [scannerTorchOn, setScannerTorchOn] = useState(false);
      const [manualBarcodeCode, setManualBarcodeCode] = useState('');
      const videoRef = useRef(null);
      const mediaStreamRef = useRef(null);
      const scanAnimationRef = useRef(null);
      const isProcessingBarcodeRef = useRef(false);
      const [scannerStatusText, setScannerStatusText] = useState('Align barcode inside window');

      // Form States - Habits Date Selection
      const [lifestyleDate, setLifestyleDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [lifestyleSleep, setLifestyleSleep] = useState(7.5);
      const [lifestyleStress, setLifestyleStress] = useState(2);
      const [lifestyleRestingHr, setLifestyleRestingHr] = useState(60);
      const [lifestyleHrv, setLifestyleHrv] = useState(58);
      const [lifestyleWater, setLifestyleWater] = useState(2500);
      const [lifestyleSteps, setLifestyleSteps] = useState(8000);
      const [lifestyleCaloriesBurned, setLifestyleCaloriesBurned] = useState(450);

      const [showHrGuide, setShowHrGuide] = useState(false);
      const [showHrvGuide, setShowHrvGuide] = useState(false);
      const [showStressGuide, setShowStressGuide] = useState(false);

      // Form States - Symptom
      const [symptomTitle, setSymptomTitle] = useState('');
      const [symptomCategory, setSymptomCategory] = useState('headache');
      const [symptomSeverity, setSymptomSeverity] = useState(3);
      const [symptomNotes, setSymptomNotes] = useState('');

      // Form States - Stool
      const [bristolType, setBristolType] = useState(4);
      const [stoolNotes, setStoolNotes] = useState('');

      // Form States - Workout
      const [exerciseTitle, setExerciseTitle] = useState('');
      const [workoutFocus, setWorkoutFocus] = useState('lifting_upper');
      const [workoutDuration, setWorkoutDuration] = useState(45);
      const [workoutIntensity, setWorkoutIntensity] = useState(7);
      const [workoutSteps, setWorkoutSteps] = useState(3500);
      const [workoutCaloriesBurned, setWorkoutCaloriesBurned] = useState(350);
      const [isEstimatingWorkoutAI, setIsEstimatingWorkoutAI] = useState(false);

      // Form States - Medication & Supplements
      const [medName, setMedName] = useState('Magnesium');
      const [medDose, setMedDose] = useState('350mg');
      const [medReason, setMedReason] = useState('Sleep & recovery');

      // AI Insights State
      const [isAnalyzingAI, setIsAnalyzingAI] = useState(false);
      const [aiReport, setAiReport] = useState(null);
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);
      const currentTimeStr = useMemo(() => {
        const d = new Date();
        return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: true });
      }, []);

      // Date formatters (DD/MM and DD MMM YYYY)
      const formatShortDate = (isoDate) => {
        if (!isoDate) return '';
        const parts = isoDate.split('-');
        if (parts.length < 3) return isoDate;
        return `${parts[2]}/${parts[1]}`;
      };

      const formatDateLabel = (isoDate) => {
        if (!isoDate) return '';
        try {
          const d = new Date(isoDate + 'T00:00:00');
          return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
        } catch {
          return isoDate;
        }
      };

      // Reset meal inputs
      const resetMealForm = () => {
        setMealTitle('');
        setMealTags([]);
        setMealCalories(0);
        setMealProtein(0);
        setMealCarbs(0);
        setMealSugar(0);
        setMealSodium(0);
        setMealWater(0);
        setMealPace('relaxed');
        setMealPosture('table');
        setIsLateNight(false);
      };

      useEffect(() => {
        if (activeTab === 'add' && addMode === 'meal') {
          resetMealForm();
        }
      }, [activeTab, addMode]);

      // Dynamic Active Burn calculation based on MET & weight
      useEffect(() => {
        let baseMet = 3.5;
        if (workoutFocus === 'lifting_upper') baseMet = 4.0 + (workoutIntensity * 0.4);
        else if (workoutFocus === 'lifting_lower') baseMet = 5.0 + (workoutIntensity * 0.5);
        else if (workoutFocus === 'cardio_hiit') baseMet = 6.0 + (workoutIntensity * 0.65);
        else if (workoutFocus === 'mobility_walk') baseMet = 2.8 + (workoutIntensity * 0.2);

        const hours = workoutDuration / 60;
        const activeBurn = Math.round(baseMet * userWeightKg * hours);
        const stepBurn = Math.round(workoutSteps * 0.04);
        setWorkoutCaloriesBurned(Math.max(activeBurn, stepBurn + Math.round(activeBurn * 0.6)));
      }, [workoutDuration, workoutIntensity, workoutSteps, workoutFocus, userWeightKg]);

      // Storage sync
      useEffect(() => {
        try {
          localStorage.setItem('pulsehealth_logs', JSON.stringify(logs));
        } catch (e) {
          console.error('Failed to save logs to localStorage', e);
        }
      }, [logs]);

      // Check for App Updates via GitHub API
      const checkForAppUpdate = async () => {
        const repoClean = githubRepo.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, '');
        if (!repoClean || !repoClean.includes('/')) {
          showToast('Enter valid owner/repo (e.g. username/pulsehealth)');
          return;
        }

        try {
          localStorage.setItem('pulsehealth_github_repo', repoClean);
        } catch(e) {}

        setIsCheckingUpdate(true);
        setUpdateStatus(null);
        showToast('Connecting to GitHub API...');

        try {
          const res = await fetch(`https://api.github.com/repos/${repoClean}/commits?per_page=1`, {
            headers: { 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });

          if (!res.ok) {
            throw new Error(`Repository not found or rate-limited (${res.status})`);
          }

          const commits = await res.json();
          if (Array.isArray(commits) && commits.length > 0) {
            const latestCommit = commits[0];
            const latestSha = latestCommit.sha.substring(0, 7);
            const commitMsg = latestCommit.commit?.message?.split('\n')[0] || 'Latest build';
            const commitDate = new Date(latestCommit.commit?.author?.date || Date.now()).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });

            const currentInstalledSha = localStorage.getItem('pulsehealth_installed_commit_sha') || '';

            if (currentInstalledSha && currentInstalledSha === latestSha) {
              setUpdateStatus({
                available: false,
                commitSha: latestSha,
                message: `You are running the latest version (${latestSha} • ${commitDate}).`
              });
              showToast('App is up to date!');
            } else {
              setUpdateStatus({
                available: true,
                commitSha: latestSha,
                message: `Newer deployment found: ${latestSha} ("${commitMsg}" • ${commitDate})`
              });
              showToast('Update found! You can reload now.');
            }
          } else {
            showToast('No commits found in repository.');
          }
        } catch (err) {
          console.error('GitHub update error', err);
          showToast(err.message || 'Could not verify GitHub updates.');
        } finally {
          setIsCheckingUpdate(false);
        }
      };

      const handleApplyAppUpdate = () => {
        if (updateStatus?.commitSha) {
          localStorage.setItem('pulsehealth_installed_commit_sha', updateStatus.commitSha);
        }
        showToast('Reloading with latest deployment...');
        setTimeout(() => {
          window.location.reload(true);
        }, 600);
      };

      // Lookup Australian & Global barcode databases (Open Food Facts + Gemini Fallback)
      const lookupBarcodeNutritionalData = async (rawBarcode) => {
        const cleanBarcode = String(rawBarcode).replace(/\D/g, '');
        if (!cleanBarcode || cleanBarcode.length < 6) {
          showToast('Invalid barcode length');
          return;
        }

        setIsScanningBarcode(true);
        showToast(`Searching barcode ${cleanBarcode}...`);

        try {
          let found = false;
          // 1. First attempt: Open Food Facts Australia / Global API
          try {
            const offRes = await fetch(`https://world.openfoodfacts.org/api/v2/product/${cleanBarcode}.json`, {
              cache: 'no-cache'
            });
            if (offRes.ok) {
              const offData = await offRes.json();
              if (offData.status === 1 && offData.product) {
                const prod = offData.product;
                const nut = prod.nutriments || {};

                let kcal = nut['energy-kcal_serving'] || nut['energy-kcal_100g'];
                if (!kcal && (nut['energy_serving'] || nut['energy_100g'])) {
                  kcal = Math.round((nut['energy_serving'] || nut['energy_100g']) / 4.184);
                }

                const name = prod.product_name_en || prod.product_name || prod.brands || 'Australian Grocery Product';
                const p = Math.round(nut['proteins_serving'] || nut['proteins_100g'] || 0);
                const c = Math.round(nut['carbohydrates_serving'] || nut['carbohydrates_100g'] || 0);
                const s = Math.round(nut['sugars_serving'] || nut['sugars_100g'] || 0);
                const na = Math.round((nut['sodium_serving'] || nut['sodium_100g'] || 0) * 1000);

                const tags = [];
                const allergens = `${prod.allergens_tags || []} ${prod.ingredients_text || ''}`.toLowerCase();
                if (allergens.includes('milk') || allergens.includes('dairy') || allergens.includes('lactose')) tags.push('dairy');
                if (allergens.includes('gluten') || allergens.includes('wheat')) tags.push('gluten');
                if (allergens.includes('caffeine') || allergens.includes('coffee')) tags.push('caffeine');
                if (s >= 15) tags.push('sugar');

                setMealTitle(name);
                setMealCalories(Math.round(kcal || 220));
                setMealProtein(p);
                setMealCarbs(c);
                setMealSugar(s);
                setMealSodium(na);
                setMealTags(tags);
                found = true;
                showToast(`Loaded: ${name}`);
              }
            }
          } catch (offErr) {
            console.debug('OpenFoodFacts fetch failed, trying AI fallback...', offErr);
          }

          // 2. Second attempt: Gemini Search-Grounded Nutritional Estimation

            estSugar = 32;
            estCal += 280;
            tags.push('sugar');

            estCal += 350;
            tags.push('fried');

          setMealProtein(estProt);
          setMealCarbs(estCarbs);
          setMealSugar(estSugar);
          setMealSodium(estSodium);

      // Add Handlers

      // Calculate Daily Aggregate Time Series
      const dailyTimeSeries = useMemo(() => {
        const datesMap = {};

        logs.forEach(item => {
          const d = item.date;
          if (!datesMap[d]) {
            datesMap[d] = {
              date: d,
              caloriesConsumedKcal: 0,
              caloriesBurnedWorkoutKcal: 0,
              caloriesBurnedLifestyleKcal: 0,
              caloriesBurnedTotalKcal: 0,
              netCaloriesKcal: 0,
              mealWaterMl: 0,
              lifestyleWaterTotalMl: 0,
              waterMl: 0,
              proteinG: 0,
              carbsG: 0,
              sugarG: 0,
              sodiumMg: 0,
              symptomScore: 0,
              symptomCount: 0,
              maxSeverity: 0,
              bristolList: [],
              sleepHours: 0,
              stress: 0,
              restingHr: 0,
              hrvMs: 0,
              steps: 0,
              exerciseMinutes: 0,
              workoutFocus: null,
              maxIntensity: 0,

            datesMap[d].caloriesConsumedKcal += (item.caloriesKcal || 0);
            datesMap[d].mealWaterMl += (item.waterMl || 0);
            datesMap[d].proteinG += (item.proteinG || 0);
            datesMap[d].carbsG += (item.carbsG || 0);
            datesMap[d].sugarG += (item.sugarG || 0);
            datesMap[d].sodiumMg += (item.sodiumMg || 0);
            if (item.eatingPace === 'rushed') datesMap[d].hasRushedMeal = true;
            if (item.isLateNight) datesMap[d].hasLateNightMeal = true;
          } else if (item.type === 'exercise') {
            datesMap[d].exerciseMinutes += (item.durationMins || 0);
            datesMap[d].exerciseSteps += (item.steps || 0);
            datesMap[d].caloriesBurnedWorkoutKcal += (item.caloriesBurnedKcal || Math.round((item.steps || 0) * 0.04) || 250);
            datesMap[d].workoutFocus = item.workoutFocus;
            datesMap[d].maxIntensity = Math.max(datesMap[d].maxIntensity, item.intensity || 0);
          } else if (item.type === 'lifestyle') {
            datesMap[d].lifestyleWaterTotalMl = Math.max(datesMap[d].lifestyleWaterTotalMl, item.waterTotalMl || 0);
            datesMap[d].sleepHours = item.sleepHours || 0;
            datesMap[d].stress = item.stressLevel || 0;
            datesMap[d].restingHr = item.restingHr || 60;
            datesMap[d].hrvMs = item.hrvMs || 55;
            datesMap[d].lifestyleSteps = Math.max(datesMap[d].lifestyleSteps, item.steps || 0);
            datesMap[d].caloriesBurnedLifestyleKcal = Math.max(datesMap[d].caloriesBurnedLifestyleKcal, item.caloriesBurnedTotalKcal || Math.round((item.steps || 0) * 0.04) || 0);
          } else if (item.type === 'symptom') {
            datesMap[d].symptomScore += (item.severity || 1);
            datesMap[d].symptomCount += 1;
            datesMap[d].maxSeverity = Math.max(datesMap[d].maxSeverity, item.severity || 1);
          } else if (item.type === 'stool') {
            datesMap[d].bristolList.push(item.bristolType);
          }
        });

        Object.values(datesMap).forEach(d => {
          d.waterMl = Math.max(d.mealWaterMl, d.lifestyleWaterTotalMl);
          d.steps = Math.max(d.exerciseSteps, d.lifestyleSteps, (d.exerciseSteps + (d.lifestyleSteps > d.exerciseSteps ? d.lifestyleSteps - d.exerciseSteps : 0)));
          
          const stepBurn = Math.round(d.steps * 0.04);
          d.caloriesBurnedTotalKcal = Math.max(
            d.caloriesBurnedWorkoutKcal + Math.max(0, stepBurn - Math.round(d.exerciseSteps * 0.04)),
            d.caloriesBurnedLifestyleKcal,
            stepBurn
          );
          
          d.netCaloriesKcal = d.caloriesConsumedKcal - d.caloriesBurnedTotalKcal;
        });

        return Object.values(datesMap).sort((a, b) => a.date.localeCompare(b.date));
      }, [logs]);

      // Aggregate time series into daily, weekly or monthly buckets
      const aggregatedTimeSeries = useMemo(() => {
        const sliceCount = analyticsDaysRange;
        const rawSliced = dailyTimeSeries.slice(-sliceCount);

        let mode = analyticsAggregation;
        if (mode === 'auto') {
          if (analyticsDaysRange > 180) mode = 'monthly';
          else if (analyticsDaysRange >= 30) mode = 'weekly';
          else mode = 'daily';
        }

        if (mode === 'daily') {
          return rawSliced.map(d => ({
            ...d,
            label: formatShortDate(d.date),
            fullLabel: formatDateLabel(d.date)
          }));
        }

        const buckets = {};

        rawSliced.forEach(item => {
          let bucketKey = '';
          let bucketLabel = '';

          if (mode === 'weekly') {
            const dObj = new Date(item.date + 'T00:00:00');
            const day = dObj.getDay();
            const diff = dObj.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(dObj.setDate(diff));
            bucketKey = monday.toISOString().split('T')[0];
            bucketLabel = `${monday.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}`;
          } else {
            const [y, m] = item.date.split('-');
            bucketKey = `${y}-${m}`;
            const mDate = new Date(Number(y), Number(m) - 1, 1);
            bucketLabel = mDate.toLocaleDateString('en-AU', { month: 'short', year: '2-digit' });
          }

          if (!buckets[bucketKey]) {
            buckets[bucketKey] = {
              date: bucketKey,
              label: bucketLabel,
              fullLabel: mode === 'weekly' ? `Week of ${bucketLabel}` : `${bucketLabel}`,
              daysCount: 0,
              caloriesConsumedSum: 0,
              caloriesBurnedSum: 0,
              waterSum: 0,
              stepsSum: 0,
              proteinSum: 0,
              sugarSum: 0,
              sodiumSum: 0,
              hrvSum: 0,
              hrvDays: 0,
              symptomScoreSum: 0,
              symptomCountSum: 0,
              maxSeverity: 0,
              hasLateNightMeal: false,
              hasRushedMeal: false,
              workoutFocus: null,
            };
          }

          const b = buckets[bucketKey];
          b.daysCount += 1;
          b.caloriesConsumedSum += (item.caloriesConsumedKcal || 0);
          b.caloriesBurnedSum += (item.caloriesBurnedTotalKcal || 0);
          b.waterSum += (item.waterMl || 0);
          b.stepsSum += (item.steps || 0);
          b.proteinSum += (item.proteinG || 0);
          b.sugarSum += (item.sugarG || 0);
          b.sodiumSum += (item.sodiumMg || 0);
          if (item.hrvMs > 0) {
            b.hrvSum += item.hrvMs;
            b.hrvDays += 1;
          }
          b.symptomScoreSum += (item.symptomScore || 0);
          b.symptomCountSum += (item.symptomCount || 0);
          b.maxSeverity = Math.max(b.maxSeverity, item.maxSeverity || 0);
          if (item.hasLateNightMeal) b.hasLateNightMeal = true;
          if (item.hasRushedMeal) b.hasRushedMeal = true;
          if (item.workoutFocus) b.workoutFocus = item.workoutFocus;
        });

        const aggregatedList = Object.values(buckets).map(b => {
          const avgConsumed = Math.round(b.caloriesConsumedSum / (b.daysCount || 1));
          const avgBurned = Math.round(b.caloriesBurnedSum / (b.daysCount || 1));
          return {
            date: b.date,
            label: b.label,
            fullLabel: b.fullLabel,
            caloriesConsumedKcal: avgConsumed,
            caloriesBurnedTotalKcal: avgBurned,
            netCaloriesKcal: avgConsumed - avgBurned,
            waterMl: Math.round(b.waterSum / (b.daysCount || 1)),
            steps: Math.round(b.stepsSum / (b.daysCount || 1)),
            proteinG: Math.round(b.proteinSum / (b.daysCount || 1)),
            sugarG: Math.round(b.sugarSum / (b.daysCount || 1)),
            sodiumMg: Math.round(b.sodiumSum / (b.daysCount || 1)),
            hrvMs: b.hrvDays > 0 ? Math.round(b.hrvSum / b.hrvDays) : 55,
            symptomScore: Math.round((b.symptomScoreSum / (b.daysCount || 1)) * 10) / 10,
            symptomCount: b.symptomCountSum,
            maxSeverity: b.maxSeverity,
            hasLateNightMeal: b.hasLateNightMeal,
            hasRushedMeal: b.hasRushedMeal,
            workoutFocus: b.workoutFocus,
            isAggregated: true,
            aggregationType: mode
          };
        });

        return aggregatedList.sort((a, b) => a.date.localeCompare(b.date));
      }, [dailyTimeSeries, analyticsDaysRange, analyticsAggregation]);

      // High Level Summary Metrics
      const summaryMetrics = useMemo(() => {
        if (aggregatedTimeSeries.length === 0) {
          return { avgCaloriesConsumed: 0, avgCaloriesBurned: 0, avgNetCalories: 0, avgWaterL: '0.0', avgProteinG: 0, avgSugarG: 0, avgSodiumMg: 0, avgSteps: 0, avgHrv: 0, symptomFreeDaysPct: 100, triggerLeader: 'None' };
        }

        const totalConsumed = aggregatedTimeSeries.reduce((acc, d) => acc + (d.caloriesConsumedKcal || 0), 0);
        const totalBurned = aggregatedTimeSeries.reduce((acc, d) => acc + (d.caloriesBurnedTotalKcal || 0), 0);
        const totalWater = aggregatedTimeSeries.reduce((acc, d) => acc + d.waterMl, 0);
        const totalProtein = aggregatedTimeSeries.reduce((acc, d) => acc + d.proteinG, 0);
        const totalSugar = aggregatedTimeSeries.reduce((acc, d) => acc + d.sugarG, 0);
        const totalSodium = aggregatedTimeSeries.reduce((acc, d) => acc + d.sodiumMg, 0);
        const totalSteps = aggregatedTimeSeries.reduce((acc, d) => acc + d.steps, 0);
        const validHrvDays = aggregatedTimeSeries.filter(d => d.hrvMs > 0);
        const totalHrv = validHrvDays.reduce((acc, d) => acc + d.hrvMs, 0);
        const symptomFreeDays = aggregatedTimeSeries.filter(d => d.symptomCount === 0).length;

        const tagCount = {};
        logs.filter(l => l.type === 'meal').forEach(m => {
          m.tags?.forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; });
        });
        const topTag = Object.entries(tagCount).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Dairy';

        const avgConsumed = Math.round(totalConsumed / aggregatedTimeSeries.length);
        const avgBurned = Math.round(totalBurned / aggregatedTimeSeries.length);

        return {
          avgCaloriesConsumed: avgConsumed,
          avgCaloriesBurned: avgBurned,
          avgNetCalories: avgConsumed - avgBurned,
          avgWaterL: (totalWater / aggregatedTimeSeries.length / 1000).toFixed(1),
          avgProteinG: Math.round(totalProtein / aggregatedTimeSeries.length),
          avgSugarG: Math.round(totalSugar / aggregatedTimeSeries.length),
          avgSodiumMg: Math.round(totalSodium / aggregatedTimeSeries.length),
          avgSteps: Math.round(totalSteps / aggregatedTimeSeries.length),
          avgHrv: validHrvDays.length > 0 ? Math.round(totalHrv / validHrvDays.length) : 56,
          symptomFreeDaysPct: Math.round((symptomFreeDays / aggregatedTimeSeries.length) * 100),
          triggerLeader: topTag.toUpperCase()

      }, [aggregatedTimeSeries, logs]);

      // Today's Aggregate for Header
      const todayAggregate = useMemo(() => {
        const todayEntry = dailyTimeSeries.find(d => d.date === todayStr);
        return todayEntry || {
          caloriesConsumedKcal: 0,

        };

      // AI Longitudinal Correlation Engine
      const runAICorrelationAnalysis = async () => {

          setAiReport({

              {

              },
              {
                trigger: "Hydration Deficit (<1,800ml) + Upper Body Lifts",

                frequency: `Occurred on ${dehydWithHeadache.length} of ${dehydrationDays.length} low-water days`,

              },
              {
                trigger: "Late-Night Dining (Within 2h of Sleep)",
                symptom: "Suppressed Overnight HRV (<40ms) & Next-Morning Slump",
                confidence: "88% Statistical Match",
                frequency: "Present in 100% of late-night dining instances",
                lagTime: "Overnight Sleep Cycle",
                evidenceType: "Autonomic Nervous System Strain",

              }
            ],
            protectiveFactors: [
              `Daily steps exceeding 8,500 yielded optimal Type 4 bowel motility in ${optimalStoolCount} out of ${goodStepsDays.length} occurrences.`,
              "Water intake exceeding 2.6L completely eliminated tension headache episodes across the entire timeframe.",
              "Balanced meals consumed in a relaxed posture at a dining table showed zero reports of post-meal bloating."
            ],
            actionableAdvice: [
              "Initiate a strict 10-day targeted dairy elimination sprint to establish a clean gastrointestinal baseline.",
              "Implement a pre-workout hydration protocol: drink 500ml water with 250-400mg sodium 30 minutes before heavy lifting sessions.",
              "Enforce a 2.5-hour kitchen curfew before sleep to restore overnight parasympathetic HRV above 55ms."
            ]
          });
          showToast('Longitudinal pattern analysis compiled!');
        } finally {
          setIsAnalyzingAI(false);
        }
      };

      const saveGoals = () => {
        setTargetSteps(Number(tempSteps));
        const newWaterMl = Math.round(Number(tempWaterL) * 1000);
        setTargetWaterMl(newWaterMl);
        setUserWeightKg(Number(tempWeightKg));
        try {
          localStorage.setItem('pulsehealth_user_weight', String(tempWeightKg));
          localStorage.setItem('pulsehealth_target_steps', String(tempSteps));
          localStorage.setItem('pulsehealth_target_water', String(newWaterMl));
        } catch (e) {
          console.error(e);
        }
        setShowGoalsModal(false);
        showToast('Goals & body weight updated!');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-28 max-w-md mx-auto relative shadow-2xl selection:bg-indigo-500 selection:text-white border-x border-slate-900">
          
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-4 py-2 rounded-full shadow-lg text-xs font-semibold flex items-center space-x-2 animate-in fade-in slide-in-from-top-4 duration-200">
              <Icon name="Sparkles" className="w-3.5 h-3.5 text-indigo-200" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* iOS App Header */}
          <header className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md px-4 pt-safe pb-3 border-b border-slate-900/90">
            <div className="flex items-center justify-between pt-2">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/25">
                  <Icon name="Activity" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
                    PulseHealth
                    <span className="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                      AI
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400 font-medium">Symptom & Trigger Correlation</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {/* Daily Goals & Targets Button */}
                <button
                  onClick={() => {
                    setTempSteps(targetSteps);
                    setTempWaterL((targetWaterMl / 1000).toFixed(1));
                    setTempWeightKg(userWeightKg);
                    setShowGoalsModal(true);
                  }}
                  className="p-2 rounded-2xl bg-slate-900 border border-slate-800 text-emerald-400 hover:text-emerald-300 transition active:scale-95"
                  title="Daily Goals & Metabolism Profile"
                >
                  <Icon name="Target" className="w-4 h-4" />
                </button>

                {/* System Settings & Notifications Button */}
                <button
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 rounded-2xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition active:scale-95"
                  title="Settings, Push Notifications & Updates"
                >
                  <Icon name="Settings" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Live Vitals Header Pill */}
            <div className="mt-3 grid grid-cols-4 gap-1.5 bg-slate-900/90 p-2 rounded-2xl border border-slate-800 text-[10px]">
              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Droplets" className="w-3 h-3 text-cyan-400 mr-0.5" /> Water
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {((todayAggregate.waterMl || 0) / 1000).toFixed(1)}L
                </span>
              </div>

              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Activity" className="w-3 h-3 text-emerald-400 mr-0.5" /> Steps
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {(todayAggregate.steps || 0).toLocaleString()}
                </span>
              </div>

              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Heart" className="w-3 h-3 text-rose-400 mr-0.5" /> HRV
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {todayAggregate.hrvMs || 59}ms
                </span>
              </div>

              <div className="flex flex-col items-center justify-center">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Flame" className="w-3 h-3 text-amber-400 mr-0.5" /> Net Cal
                </span>
                <span className={`font-mono font-bold mt-0.5 ${todayAggregate.netCaloriesKcal >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                  {todayAggregate.netCaloriesKcal > 0 ? `+${todayAggregate.netCaloriesKcal}` : todayAggregate.netCaloriesKcal}
                </span>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="p-4 space-y-4">
            
            {/* ================= VIEW 1: CAPTURE / ADD ================= */}
            {activeTab === 'add' && (
              <div className="space-y-4">
                
                {/* Category Selector */}
                <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[11px]">
                  {[
                    { id: 'meal', label: 'Meal', icon: 'Utensils', iconColor: 'text-indigo-400', activeBg: 'bg-indigo-600' },
                    { id: 'symptom', label: 'Flare', icon: 'AlertCircle', iconColor: 'text-rose-400', activeBg: 'bg-rose-600' },
                    { id: 'stool', label: 'Bowel', icon: 'FileText', iconColor: 'text-amber-400', activeBg: 'bg-amber-600' },
                    { id: 'exercise', label: 'Workout', icon: 'Flame', iconColor: 'text-emerald-400', activeBg: 'bg-emerald-600' },
                    { id: 'lifestyle', label: 'Habits', icon: 'Moon', iconColor: 'text-violet-400', activeBg: 'bg-violet-600' },
                    { id: 'medication', label: 'Meds & Sups', icon: 'ShieldCheck', iconColor: 'text-teal-400', activeBg: 'bg-teal-600' }
                  ].map(item => {
                    const isActive = addMode === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setAddMode(item.id)}
                        className={`flex flex-col items-center py-2 px-1 rounded-xl font-semibold transition-all ${
                          isActive 
                            ? `${item.activeBg} text-white shadow-sm` 
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
                        }`}
                      >
                        <Icon name={item.icon} className={`w-3.5 h-3.5 mb-1 ${isActive ? 'text-white' : item.iconColor}`} />
                        <span className="text-[10px] truncate">{item.label}</span>
                      </button>
                    );
                  })}
                </div>

                {/* MEAL FORM */}
                {addMode === 'meal' && (
                  <form onSubmit={handleAddMeal} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Utensils" className="w-4 h-4 mr-2 text-indigo-400" />
                        Log Food & Drink
                      </h2>

                      <div className="flex items-center space-x-1.5">
                        <button
                          type="button"
                          onClick={resetMealForm}
                          className="px-2.5 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 hover:text-white text-[11px] font-medium transition active:scale-95"
                        >
                          Clear
                        </button>

                        <button
                          type="button"
                          onClick={startBarcodeScanner}
                          disabled={isScanningBarcode}
                          className={`flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold hover:bg-emerald-600/30 transition active:scale-95 ${
                            isScanningBarcode ? 'opacity-50 pointer-events-none' : ''
                          }`}
                        >
                          <Icon name="Barcode" className={`w-3.5 h-3.5 ${isScanningBarcode ? 'animate-pulse' : ''}`} />
                          <span>{isScanningBarcode ? 'Scanning...' : 'Barcode'}</span>
                        </button>

                        <button
                          type="button"
                          onClick={handleSimulatePhotoAnalyze}
                          disabled={isAnalyzingPhoto}
                          className="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 text-xs font-semibold hover:bg-indigo-600/30 transition disabled:opacity-50"
                        >
                          <Icon name="Camera" className="w-3.5 h-3.5" />
                          <span>{isAnalyzingPhoto ? 'Scanning...' : 'Plate'}</span>
                        </button>
                      </div>
                    </div>

                    <div className="bg-emerald-950/40 border border-emerald-500/20 px-3 py-1.5 rounded-xl flex items-center justify-between text-[10px] text-emerald-300">
                      <span className="flex items-center gap-1.5">
                        <Icon name="Barcode" className="w-3.5 h-3.5 text-emerald-400 shrink-0" />
                        <span>Live camera scanner for Australian barcodes (EAN-13) & Nutrition Info.</span>
                      </span>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">
                          Meal Description
                        </label>
                        <button
                          type="button"
                          onClick={handleEstimateMealWithAI}
                          disabled={isEstimatingMealAI || !mealTitle.trim()}
                          className="text-xs px-2.5 py-1 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-200 hover:text-white font-semibold transition disabled:opacity-40 disabled:pointer-events-none flex items-center space-x-1"
                        >
                          <Icon name="Sparkles" className={`w-3.5 h-3.5 text-indigo-300 ${isEstimatingMealAI ? 'animate-spin' : ''}`} />
                          <span>{isEstimatingMealAI ? 'Calculating...' : 'Estimate with AI'}</span>
                        </button>
                      </div>
                      <div className="relative">
                        <input
                          type="text"
                          value={mealTitle}
                          onChange={(e) => setMealTitle(e.target.value)}
                          placeholder="e.g. Scrambled eggs, sourdough & black coffee"
                          className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 pr-10"
                          required
                        />
                      </div>
                    </div>

                    {/* Calorie Intake Slider */}
                    <div className="bg-slate-950/90 p-3 rounded-2xl border border-amber-500/30">
                      <div className="flex justify-between items-center text-xs font-semibold text-slate-200 mb-1">
                        <span className="flex items-center text-amber-400">
                          <Icon name="Flame" className="w-3.5 h-3.5 mr-1 text-amber-400" /> Energy Intake
                        </span>
                        <span className="font-mono text-amber-400 font-bold text-sm">
                          {mealCalories} kcal <span className="text-[10px] text-amber-300/80 font-normal">({Math.round(mealCalories * 4.184)} kJ)</span>
                        </span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="2000"
                        step="25"
                        value={mealCalories}
                        onChange={(e) => setMealCalories(Number(e.target.value))}
                        className="w-full accent-amber-500 cursor-pointer"
                      />
                    </div>

                    {/* Sensitivity Tags */}
                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">
                        Dietary Factors & Intolerances
                      </label>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { id: 'dairy', label: 'Dairy / Lactose' },
                          { id: 'gluten', label: 'Gluten' },
                          { id: 'caffeine', label: 'Caffeine' },
                          { id: 'alcohol', label: 'Alcohol' },
                          { id: 'spicy', label: 'Spicy' },
                          { id: 'fried', label: 'Greasy / Fried' },
                          { id: 'sugar', label: 'High Sugar' }
                        ].map(tag => {
                          const selected = mealTags.includes(tag.id);
                          return (
                            <button
                              type="button"
                              key={tag.id}
                              onClick={() => toggleMealTag(tag.id)}
                              className={`text-xs px-2.5 py-1.5 rounded-xl font-medium transition ${
                                selected
                                  ? 'bg-indigo-600 text-white font-semibold shadow-sm'
                                  : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                              }`}
                            >
                              #{tag.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Macronutrient Sliders */}
                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Protein</span>
                          <span className="font-mono text-indigo-400 font-bold">{mealProtein}g</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="100"
                          step="5"
                          value={mealProtein}
                          onChange={(e) => setMealProtein(Number(e.target.value))}
                          className="w-full accent-indigo-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Carbs</span>
                          <span className="font-mono text-amber-400 font-bold">{mealCarbs}g</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="150"
                          step="5"
                          value={mealCarbs}
                          onChange={(e) => setMealCarbs(Number(e.target.value))}
                          className="w-full accent-amber-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Sugar</span>
                          <span className="font-mono text-pink-400 font-bold">{mealSugar}g</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="80"
                          step="2"
                          value={mealSugar}
                          onChange={(e) => setMealSugar(Number(e.target.value))}
                          className="w-full accent-pink-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Sodium</span>
                          <span className="font-mono text-purple-400 font-bold">{mealSodium}mg</span>
                        </div>
                        <input
                          type="range"
                          min="0"
                          max="3000"
                          step="50"
                          value={mealSodium}
                          onChange={(e) => setMealSodium(Number(e.target.value))}
                          className="w-full accent-purple-500 cursor-pointer"
                        />
                      </div>
                    </div>

                    {/* Fluid with Meal */}
                    <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                      <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                        <span className="flex items-center">
                          <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400 mr-1" /> Fluid with Meal
                        </span>
                        <span className="font-mono text-cyan-400 font-bold">{mealWater} ml</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="1000"
                        step="50"
                        value={mealWater}
                        onChange={(e) => setMealWater(Number(e.target.value))}
                        className="w-full accent-cyan-400 cursor-pointer"
                      />
                    </div>

                    {/* Eating Context: Pace & Posture */}
                    <div className="space-y-2.5 pt-2 border-t border-slate-800">
                      <div className="flex items-center justify-between text-xs">
                        <span className="text-slate-400 font-medium">Eating Pace</span>
                        <div className="flex gap-1.5">
                          {[
                            { id: 'relaxed', label: '🧘 Relaxed' },
                            { id: 'rushed', label: '⚡ Rushed (<10m)' }
                          ].map(p => (
                            <button
                              type="button"
                              key={p.id}
                              onClick={() => setMealPace(p.id)}
                              className={`px-3 py-1.5 rounded-xl font-medium text-[11px] transition ${
                                mealPace === p.id 
                                  ? 'bg-indigo-600 text-white font-bold shadow-sm' 
                                  : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                              }`}
                            >
                              {p.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs">
                        <span className="text-slate-400 font-medium">Posture / Setting</span>
                        <div className="flex gap-1.5">
                          {[
                            { id: 'table', label: '🍽️ Table' },
                            { id: 'desk', label: '💻 Desk' },
                            { id: 'standing', label: '🚶 Moving' }
                          ].map(pos => (
                            <button
                              type="button"
                              key={pos.id}
                              onClick={() => setMealPosture(pos.id)}
                              className={`px-2.5 py-1.5 rounded-xl font-medium text-[11px] transition ${
                                mealPosture === pos.id 
                                  ? 'bg-indigo-600 text-white font-bold shadow-sm' 
                                  : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                              }`}
                            >
                              {pos.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="bg-slate-950/90 p-3 rounded-2xl border border-slate-800 space-y-1.5">
                        <div className="flex items-center justify-between">
                          <div>
                            <span className="text-xs font-bold text-slate-200 block">Late-Night Meal?</span>
                            <span className="text-[10px] text-slate-400">Consumed within 2 hours of bedtime</span>
                          </div>
                          
                          <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                            <button
                              type="button"
                              onClick={() => setIsLateNight(false)}
                              className={`px-3 py-1 rounded-lg font-bold transition ${
                                !isLateNight
                                  ? 'bg-slate-800 text-slate-200 shadow-sm border border-slate-700'
                                  : 'text-slate-500 hover:text-slate-300'
                              }`}
                            >
                              No
                            </button>
                            <button
                              type="button"
                              onClick={() => setIsLateNight(true)}
                              className={`px-3 py-1 rounded-lg font-bold transition flex items-center space-x-1 ${
                                isLateNight
                                  ? 'bg-amber-500 text-slate-950 shadow-sm'
                                  : 'text-slate-500 hover:text-slate-300'
                              }`}
                            >
                              <span>🌙 Yes</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Log Meal & Track Calories</span>
                    </button>
                  </form>
                )}

                {/* SYMPTOM FORM */}
                {addMode === 'symptom' && (
                  <form onSubmit={handleAddSymptom} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="AlertCircle" className="w-4 h-4 mr-2 text-rose-400" />
                      Record Flare or Discomfort
                    </h2>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Symptom Type
                      </label>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'headache', label: 'Headache / Migraine' },
                          { id: 'bloating', label: 'Bloating & Distension' },
                          { id: 'sore_stomach', label: 'Sore Stomach / Cramps' },
                          { id: 'brain_fog', label: 'Brain Fog / Slump' },
                          { id: 'acid_reflux', label: 'Acid Reflux / Heartburn' },
                          { id: 'palpitations', label: 'Palpitations / Racing Heart' },
                          { id: 'skin_flare', label: 'Skin Flare / Itch / Hives' },
                          { id: 'joint_pain', label: 'Joint / Neck Pain' },
                          { id: 'postprandial_fatigue', label: 'Food Coma / Deep Fatigue' },
                          { id: 'nausea', label: 'Nausea / Queasiness' }
                        ].map(item => (
                          <button
                            type="button"
                            key={item.id}
                            onClick={() => {
                              setSymptomCategory(item.id);
                              if (!symptomTitle) setSymptomTitle(item.label);
                            }}
                            className={`text-xs p-2.5 rounded-2xl text-left font-medium transition ${
                              symptomCategory === item.id 
                                ? 'bg-rose-600/20 border border-rose-500 text-rose-300 font-bold' 
                                : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {item.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Specific Description
                      </label>
                      <input
                        type="text"
                        value={symptomTitle}
                        onChange={(e) => setSymptomTitle(e.target.value)}
                        placeholder="e.g. Throbbing right temple, stomach gurgling"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500"
                        required
                      />
                    </div>

                    <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80">
                      <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1.5">
                        <span>Severity Rating</span>
                        <span className="font-mono text-rose-400 font-bold">{symptomSeverity} / 5</span>
                      </div>
                      <div className="flex justify-between gap-1.5">
                        {[1, 2, 3, 4, 5].map(lvl => (
                          <button
                            type="button"
                            key={lvl}
                            onClick={() => setSymptomSeverity(lvl)}
                            className={`flex-1 py-2 rounded-xl font-bold text-xs transition ${
                              symptomSeverity === lvl 
                                ? 'bg-rose-600 text-white shadow-sm shadow-rose-600/40' 
                                : 'bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {lvl}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Notes & Trigger Suspicions
                      </label>
                      <textarea
                        value={symptomNotes}
                        onChange={(e) => setSymptomNotes(e.target.value)}
                        placeholder="What did you feel? Did this happen after a specific meal or workout?"
                        rows={2}
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-rose-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="AlertCircle" className="w-4 h-4" />
                      <span>Record Flare</span>
                    </button>
                  </form>
                )}

                {/* BRISTOL STOOL FORM */}
                {addMode === 'stool' && (
                  <form onSubmit={handleAddStool} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="FileText" className="w-4 h-4 mr-2 text-amber-400" />
                      Bristol Stool Chart Log
                    </h2>

                    <div className="space-y-1.5">
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">
                        Select Consistency (Types 1 - 7)
                      </label>

                      <div className="grid grid-cols-1 gap-1.5 text-xs">
                        {[
                          { type: 1, label: 'Type 1: Hard lumps / pellets (Severe Constipation)', color: 'text-rose-400' },
                          { type: 2, label: 'Type 2: Lumpy sausage (Mild Constipation)', color: 'text-amber-400' },
                          { type: 3, label: 'Type 3: Sausage with cracks (Normal)', color: 'text-emerald-400' },
                          { type: 4, label: 'Type 4: Smooth, soft snake (Optimal / Ideal)', color: 'text-emerald-400 font-bold' },
                          { type: 5, label: 'Type 5: Soft blobs with clear edges (Low Fiber)', color: 'text-amber-400' },
                          { type: 6, label: 'Type 6: Fluffy pieces, ragged edges (Mild Diarrhea)', color: 'text-rose-400' },
                          { type: 7, label: 'Type 7: Entirely liquid (Severe Diarrhea / Rapid Transit)', color: 'text-rose-400' },
                        ].map(item => (
                          <button
                            type="button"
                            key={item.type}
                            onClick={() => setBristolType(item.type)}
                            className={`p-2.5 rounded-2xl text-left transition border ${
                              bristolType === item.type 
                                ? 'bg-amber-600/20 border-amber-500 text-amber-200 font-semibold' 
                                : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                            }`}
                          >
                            <span className={`block font-medium ${item.color}`}>{item.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Transit Notes (Optional)
                      </label>
                      <input
                        type="text"
                        value={stoolNotes}
                        onChange={(e) => setStoolNotes(e.target.value)}
                        placeholder="e.g. Urgency, cramping prior to movement"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-amber-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-amber-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Save Stool Entry</span>
                    </button>
                  </form>
                )}

                {/* WORKOUT FORM */}
                {addMode === 'exercise' && (
                  <form onSubmit={handleAddExercise} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Flame" className="w-4 h-4 mr-2 text-emerald-400" />
                        Log Workout Session
                      </h2>

                      <button
                        type="button"
                        onClick={handleEstimateWorkoutWithAI}
                        disabled={isEstimatingWorkoutAI}
                        className="flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold hover:bg-emerald-600/30 transition disabled:opacity-50"
                      >
                        <Icon name="Sparkles" className={`w-3.5 h-3.5 ${isEstimatingWorkoutAI ? 'animate-spin' : ''}`} />
                        <span>{isEstimatingWorkoutAI ? 'Calculating...' : 'Estimate Burn with AI'}</span>
                      </button>
                    </div>

                    <div className="flex items-center justify-between px-3 py-1.5 rounded-xl bg-slate-950/80 border border-slate-800 text-[10px] text-slate-400">
                      <span className="flex items-center">
                        <span>Metabolism profile: </span>
                        <strong className="text-slate-200 ml-1">{userWeightKg} kg</strong>
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          setTempSteps(targetSteps);
                          setTempWaterL((targetWaterMl / 1000).toFixed(1));
                          setTempWeightKg(userWeightKg);
                          setShowGoalsModal(true);
                        }}
                        className="text-emerald-400 hover:underline font-semibold"
                      >
                        Change Weight
                      </button>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Modality & Focus
                      </label>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'lifting_upper', label: '🏋️ Lifting (Upper / Push / Pull)' },
                          { id: 'lifting_lower', label: '🦵 Lifting (Lower / Legs / Squats)' },
                          { id: 'cardio_hiit', label: '🏃 Running / Cycling / HIIT' },
                          { id: 'mobility_walk', label: '🧘 Walk / Mobility / Yoga' }
                        ].map(item => (
                          <button
                            type="button"
                            key={item.id}
                            onClick={() => setWorkoutFocus(item.id)}
                            className={`text-xs p-2.5 rounded-2xl text-left font-medium transition ${
                              workoutFocus === item.id 
                                ? 'bg-emerald-600/20 border border-emerald-500 text-emerald-300 font-bold' 
                                : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {item.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Workout Title / Notes
                      </label>
                      <input
                        type="text"
                        value={exerciseTitle}
                        onChange={(e) => setExerciseTitle(e.target.value)}
                        placeholder="e.g. Bench press, shoulder press, triceps"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Duration</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutDuration} min</span>
                        </div>
                        <input
                          type="range"
                          min="10"
                          max="120"
                          step="5"
                          value={workoutDuration}
                          onChange={(e) => setWorkoutDuration(Number(e.target.value))}
                          className="w-full accent-emerald-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Intensity (RPE)</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutIntensity} / 10</span>
                        </div>
                        <input
                          type="range"
                          min="1"
                          max="10"
                          step="1"
                          value={workoutIntensity}
                          onChange={(e) => setWorkoutIntensity(Number(e.target.value))}
                          className="w-full accent-emerald-500 cursor-pointer"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Steps in Session</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutSteps.toLocaleString()}</span>
                        </div>
                        <input
                          type="range"
                          min="500"
                          max="15000"
                          step="500"
                          value={workoutSteps}
                          onChange={(e) => setWorkoutSteps(Number(e.target.value))}
                          className="w-full accent-emerald-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span className="text-rose-400 flex items-center">
                            <Icon name="Flame" className="w-3 h-3 mr-0.5" /> Energy Burned
                          </span>
                          <span className="font-mono text-rose-400 font-bold">
                            -{workoutCaloriesBurned} kcal
                          </span>
                        </div>
                        <input
                          type="range"
                          min="50"
                          max="1500"
                          step="25"
