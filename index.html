                          value={workoutCaloriesBurned}
                          onChange={(e) => setWorkoutCaloriesBurned(Number(e.target.value))}
                          className="w-full accent-rose-500 cursor-pointer"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Log Workout (-{workoutCaloriesBurned} kcal)</span>
                    </button>
                  </form>
                )}

                {/* HABITS / LIFESTYLE FORM */}
                {addMode === 'lifestyle' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="space-y-2 pb-3 border-b border-slate-800/80">
                      <div className="flex items-center justify-between">
                        <h2 className="text-sm font-bold text-white flex items-center">
                          <Icon name="Moon" className="w-4 h-4 mr-2 text-indigo-400" />
                          Daily Habits & Vitals
                        </h2>
                        <span className="text-[10px] text-slate-400 font-mono">
                          {existingLifestyleLog ? '✓ Logged for date' : '○ Not yet logged'}
                        </span>
                      </div>

                      <div className="bg-slate-950 p-2.5 rounded-2xl border border-slate-800 flex items-center justify-between gap-2">
                        <div className="flex items-center space-x-2">
                          <Icon name="Calendar" className="w-4 h-4 text-indigo-400 shrink-0" />
                          <div className="flex flex-col">
                            <span className="text-[9.5px] uppercase font-bold tracking-wider text-slate-400">
                              Logging For Date
                            </span>
                            <span className="text-xs font-bold text-slate-200">
                              {formatDateLabel(lifestyleDate)}
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center space-x-1.5">
                          <button
                            type="button"
                            onClick={() => setLifestyleDate(todayStr)}
                            className={`text-[10px] px-2 py-1 rounded-lg font-semibold transition ${
                              lifestyleDate === todayStr 
                                ? 'bg-indigo-600 text-white' 
                                : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white'
                            }`}
                          >
                            Today
                          </button>

                          <button
                            type="button"
                            onClick={() => {
                              const yest = new Date();
                              yest.setDate(yest.getDate() - 1);
                              setLifestyleDate(yest.toISOString().split('T')[0]);
                            }}
                            className={`text-[10px] px-2 py-1 rounded-lg font-semibold transition ${
                              (() => {
                                const y = new Date();
                                y.setDate(y.getDate() - 1);
                                return lifestyleDate === y.toISOString().split('T')[0];
                              })()
                                ? 'bg-indigo-600 text-white'
                                : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white'
                            }`}
                          >
                            Yesterday
                          </button>

                          <div className="relative overflow-hidden rounded-lg">
                            <div
                              className="flex items-center space-x-1 px-2.5 py-1 bg-slate-900 border border-slate-700 hover:border-indigo-500 text-indigo-300 text-[10px] font-semibold transition pointer-events-none"
                            >
                              <Icon name="Calendar" className="w-3 h-3 text-indigo-400" />
                              <span>Calendar</span>
                            </div>
                            <input
                              id="lifestyle-date-picker"
                              type="date"
                              max={todayStr}
                              value={lifestyleDate}
                              onChange={(e) => {
                                if (e.target.value) setLifestyleDate(e.target.value);
                              }}
                              className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                              title="Pick custom date"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center justify-between">
                        <p className="text-[10px] text-slate-400 leading-tight">
                          Submit habits individually or tap <strong className="text-indigo-400">Submit All</strong> below.
                        </p>
                        <button
                          type="button"
                          onClick={handleSaveAllHabits}
                          className="px-2.5 py-1 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-200 hover:text-white text-[10px] font-bold transition active:scale-95 flex items-center space-x-1 shrink-0 ml-2"
                        >
                          <Icon name="Check" className="w-3 h-3" />
                          <span>Submit All</span>
                        </button>
                      </div>
                    </div>

                    {/* 7 ITEMS LISTED DOWN THE PAGE */}
                    <div className="space-y-3">
                      
                      {/* 1. SLEEP */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Moon" className="w-3.5 h-3.5 text-indigo-400" />
                            <span className="text-xs font-bold text-slate-200">1. Sleep Duration</span>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 py-0.2 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-indigo-400 font-bold text-sm">{lifestyleSleep} hrs</span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="4"
                            max="12"
                            step="0.5"
                            value={lifestyleSleep}
                            onChange={(e) => setLifestyleSleep(Number(e.target.value))}
                            className="flex-1 accent-indigo-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('sleepHours', Number(lifestyleSleep), 'Sleep')}
                            disabled={isSleepLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isSleepLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30 active:scale-95'
                            }`}
                          >
                            {isSleepLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.sleepHours === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>
                      </div>

                      {/* 2. STRESS */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2 relative">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Zap" className="w-3.5 h-3.5 text-amber-400" />
                            <span className="text-xs font-bold text-slate-200">2. Subjective Stress</span>
                            <button
                              type="button"
                              onClick={() => {
                                setShowStressGuide(prev => !prev);
                                setShowHrGuide(false);
                                setShowHrvGuide(false);
                              }}
                              className="text-slate-400 hover:text-amber-400 transition p-0.5 rounded-full"
                            >
                              <Icon name="Info" className="w-3.5 h-3.5 text-amber-400" />
                            </button>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 py-0.2 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-amber-400 font-bold text-sm">{lifestyleStress} / 5</span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="1"
                            max="5"
                            step="1"
                            value={lifestyleStress}
                            onChange={(e) => setLifestyleStress(Number(e.target.value))}
                            className="flex-1 accent-amber-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('stressLevel', Number(lifestyleStress), 'Stress level')}
                            disabled={isStressLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isStressLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-amber-600 hover:bg-amber-500 text-white shadow-md shadow-amber-600/30 active:scale-95'
                            }`}
                          >
                            {isStressLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.stressLevel === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>

                        {showStressGuide && (
                          <div className="absolute right-0 sm:left-0 sm:w-80 top-full mt-1 z-50 bg-slate-900 border border-amber-500/40 rounded-2xl p-3.5 shadow-2xl shadow-black/80 text-left text-xs space-y-2">
                            <div className="flex items-center justify-between pb-1.5 border-b border-slate-800">
                              <span className="font-bold text-white">How to Score Subjective Stress</span>
                              <button type="button" onClick={() => setShowStressGuide(false)} className="text-slate-400 hover:text-white">
                                <Icon name="X" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                            <p className="text-[11px] text-slate-300 leading-relaxed">
                              Rate cumulative somatic & mental load (1 = Peaceful, 3 = Moderate tension/tight jaw, 5 = Overwhelmed/panic).
                            </p>
                          </div>
                        )}
                      </div>

                      {/* 3. OVERNIGHT HRV */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2 relative">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Heart" className="w-3.5 h-3.5 text-pink-400" />
                            <span className="text-xs font-bold text-slate-200">3. Overnight HRV</span>
                            <button
                              type="button"
                              onClick={() => {
                                setShowHrvGuide(prev => !prev);
                                setShowHrGuide(false);
                                setShowStressGuide(false);
                              }}
                              className="text-slate-400 hover:text-pink-400 transition p-0.5 rounded-full"
                            >
                              <Icon name="Info" className="w-3.5 h-3.5 text-pink-400" />
                            </button>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 py-0.2 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-pink-400 font-bold text-sm">{lifestyleHrv} ms</span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="20"
                            max="100"
                            step="1"
                            value={lifestyleHrv}
                            onChange={(e) => setLifestyleHrv(Number(e.target.value))}
                            className="flex-1 accent-pink-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('hrvMs', Number(lifestyleHrv), 'Overnight HRV')}
                            disabled={isHrvLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isHrvLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-pink-600 hover:bg-pink-500 text-white shadow-md shadow-pink-600/30 active:scale-95'
                            }`}
                          >
                            {isHrvLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.hrvMs === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>

                        {showHrvGuide && (
                          <div className="absolute right-0 sm:left-0 sm:w-80 top-full mt-1 z-50 bg-slate-900 border border-pink-500/40 rounded-2xl p-3.5 shadow-2xl shadow-black/80 text-left text-xs space-y-2">
                            <div className="flex items-center justify-between pb-1.5 border-b border-slate-800">
                              <span className="font-bold text-white">How to Measure HRV (ms)</span>
                              <button type="button" onClick={() => setShowHrvGuide(false)} className="text-slate-400 hover:text-white">
                                <Icon name="X" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                            <p className="text-[11px] text-slate-300 leading-relaxed">
                              <strong>Overnight sleep reading</strong> in Apple Health / Oura / Whoop. Drops &gt;15-20% below baseline indicate fatigue or a pending flare.
                            </p>
                          </div>
                        )}
                      </div>

                      {/* 4. RESTING HR */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2 relative">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Activity" className="w-3.5 h-3.5 text-rose-400" />
                            <span className="text-xs font-bold text-slate-200">4. Resting Heart Rate</span>
                            <button
                              type="button"
                              onClick={() => {
                                setShowHrGuide(prev => !prev);
                                setShowHrvGuide(false);
                                setShowStressGuide(false);
                              }}
                              className="text-slate-400 hover:text-rose-400 transition p-0.5 rounded-full"
                            >
                              <Icon name="Info" className="w-3.5 h-3.5 text-rose-400" />
                            </button>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 py-0.2 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-rose-400 font-bold text-sm">{lifestyleRestingHr} bpm</span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="45"
                            max="95"
                            step="1"
                            value={lifestyleRestingHr}
                            onChange={(e) => setLifestyleRestingHr(Number(e.target.value))}
                            className="flex-1 accent-rose-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('restingHr', Number(lifestyleRestingHr), 'Resting HR')}
                            disabled={isRestingHrLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isRestingHrLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-rose-600 hover:bg-rose-500 text-white shadow-md shadow-rose-600/30 active:scale-95'
                            }`}
                          >
                            {isRestingHrLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.restingHr === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>

                        {showHrGuide && (
                          <div className="absolute right-0 sm:left-0 sm:w-80 top-full mt-1 z-50 bg-slate-900 border border-rose-500/40 rounded-2xl p-3.5 shadow-2xl shadow-black/80 text-left text-xs space-y-2">
                            <div className="flex items-center justify-between pb-1.5 border-b border-slate-800">
                              <span className="font-bold text-white">How to Measure Resting HR</span>
                              <button type="button" onClick={() => setShowHrGuide(false)} className="text-slate-400 hover:text-white">
                                <Icon name="X" className="w-3.5 h-3.5" />
                              </button>
                            </div>
                            <p className="text-[11px] text-slate-300 leading-relaxed">
                              <strong>First thing upon waking</strong> before getting out of bed or having caffeine. Count beats for 30s and multiply by 2.
                            </p>
                          </div>
                        )}
                      </div>

                      {/* 5. DAILY WATER */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400" />
                            <span className="text-xs font-bold text-slate-200">5. Daily Water Intake</span>
                            <span className="text-[9px] text-cyan-400/90 uppercase font-mono px-1.5 py-0.2 rounded bg-cyan-950/40 border border-cyan-800/60">Fluid</span>
                          </div>
                          <span className="font-mono text-cyan-400 font-bold text-sm">{(lifestyleWater / 1000).toFixed(1)} Litres</span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="500"
                            max="5000"
                            step="100"
                            value={lifestyleWater}
                            onChange={(e) => setLifestyleWater(Number(e.target.value))}
                            className="flex-1 accent-cyan-400 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('waterTotalMl', Number(lifestyleWater), 'Water intake')}
                            disabled={isWaterLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isWaterLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-md shadow-cyan-600/30 active:scale-95'
                            }`}
                          >
                            {isWaterLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.waterTotalMl === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>
                      </div>

                      {/* 6. ACTIVE ENERGY BURN */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Flame" className="w-3.5 h-3.5 text-rose-400" />
                            <span className="text-xs font-bold text-slate-200">6. Active Energy Burn</span>
                            <span className="text-[9px] text-rose-400/90 uppercase font-mono px-1.5 py-0.2 rounded bg-rose-950/40 border border-rose-800/60">Expenditure</span>
                          </div>
                          <span className="font-mono text-rose-400 font-bold text-sm">
                            -{lifestyleCaloriesBurned} kcal
                          </span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="100"
                            max="1600"
                            step="50"
                            value={lifestyleCaloriesBurned}
                            onChange={(e) => setLifestyleCaloriesBurned(Number(e.target.value))}
                            className="flex-1 accent-rose-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('caloriesBurnedTotalKcal', Number(lifestyleCaloriesBurned), 'Active burn')}
                            disabled={isBurnLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isBurnLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-rose-600 hover:bg-rose-500 text-white shadow-md shadow-rose-600/30 active:scale-95'
                            }`}
                          >
                            {isBurnLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.caloriesBurnedTotalKcal === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>
                      </div>

                      {/* 7. DAILY TOTAL STEPS */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Activity" className="w-3.5 h-3.5 text-emerald-400" />
                            <span className="text-xs font-bold text-slate-200">7. Daily Total Steps</span>
                            <span className="text-[9px] text-emerald-400/90 uppercase font-mono px-1.5 py-0.2 rounded bg-emerald-950/40 border border-emerald-800/60">Motility</span>
                          </div>
                          <span className="font-mono text-emerald-400 font-bold text-sm">{lifestyleSteps.toLocaleString()}</span>
                        </div>

                        <div className="flex items-center space-x-3">
                          <input
                            type="range"
                            min="1000"
                            max="22000"
                            step="500"
                            value={lifestyleSteps}
                            onChange={(e) => setLifestyleSteps(Number(e.target.value))}
                            className="flex-1 accent-emerald-500 cursor-pointer"
                          />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('steps', Number(lifestyleSteps), 'Step count')}
                            disabled={isStepsLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isStepsLoggedForDate
                                ? 'bg-slate-900 border border-slate-800 text-slate-400 cursor-default opacity-80'
                                : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/30 active:scale-95'
                            }`}
                          >
                            {isStepsLoggedForDate ? (
                              <>
                                <Icon name="Check" className="w-3.5 h-3.5 text-emerald-400" />
                                <span>Logged</span>
                              </>
                            ) : (
                              <>
                                <Icon name="Plus" className="w-3.5 h-3.5" />
                                <span>{existingLifestyleLog && typeof existingLifestyleLog.steps === 'number' ? 'Update' : 'Submit'}</span>
                              </>
                            )}
                          </button>
                        </div>
                      </div>

                    </div>

                    {/* Bottom Full Submission Option */}
                    <div className="pt-2 border-t border-slate-800/80">
                      <button
                        type="button"
                        onClick={handleSaveAllHabits}
                        className="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-xs shadow-md shadow-indigo-600/30 transition flex items-center justify-center space-x-2"
                      >
                        <Icon name="Check" className="w-4 h-4" />
                        <span>Submit All 7 Habits for {formatShortDate(lifestyleDate)}</span>
                      </button>
                    </div>
                  </div>
                )}

                {/* MEDICATION & SUPPLEMENTS FORM */}
                {addMode === 'medication' && (
                  <form onSubmit={handleAddMedication} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="ShieldCheck" className="w-4 h-4 mr-2 text-teal-400" />
                        Log Medication or Supplement
                      </h2>
                      <span className="text-[10px] text-teal-400/90 font-medium bg-teal-950/50 border border-teal-800/40 px-2 py-0.5 rounded-lg">
                        1-Tap Quick Stacks
                      </span>
                    </div>

                    <div className="space-y-1.5">
                      <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">
                        Quick-Select Common Supplements & Meds
                      </span>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { name: 'Magnesium', dose: '350mg', reason: 'Sleep & muscle recovery (osmotic effect)' },
                          { name: 'Pre-Workout', dose: '1 scoop', reason: 'Training focus / caffeine' },
                          { name: 'Multivitamin / Zinc', dose: '1 tab', reason: 'Daily nutrients' },
                          { name: 'Electrolytes', dose: '1 sachet', reason: 'Hydration & sodium' },
                          { name: 'Probiotic', dose: '1 cap', reason: 'Gut microbiome support' },
                          { name: 'Creatine', dose: '5g', reason: 'Strength & muscle hydration' },
                          { name: 'Iron Supplement', dose: '1 tab', reason: 'Ferritin (bowel firming)' },
                          { name: 'Paracetamol', dose: '1000mg', reason: 'Headache / pain relief' },
                          { name: 'Ibuprofen', dose: '400mg', reason: 'Anti-inflammatory / pain' }
                        ].map((item, idx) => {
                          const isSelected = medName.toLowerCase() === item.name.toLowerCase();
                          return (
                            <button
                              key={idx}
                              type="button"
                              onClick={() => {
                                setMedName(item.name);
                                setMedDose(item.dose);
                                setMedReason(item.reason);
                              }}
                              className={`text-xs px-2.5 py-1.5 rounded-xl font-medium transition ${
                                isSelected
                                  ? 'bg-teal-600 text-white font-bold shadow-sm'
                                  : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700 hover:text-white'
                              }`}
                            >
                              {item.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Name / Supplement
                      </label>
                      <input
                        type="text"
                        value={medName}
                        onChange={(e) => setMedName(e.target.value)}
                        placeholder="e.g. Magnesium Glycinate, Paracetamol, Zinc"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-teal-500"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                          Dosage (Optional)
                        </label>
                        <input
                          type="text"
                          value={medDose}
                          onChange={(e) => setMedDose(e.target.value)}
                          placeholder="e.g. 400mg, 1 scoop"
                          className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none"
                        />
                      </div>

                      <div>
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                          Reason / Benefit
                        </label>
                        <input
                          type="text"
                          value={medReason}
                          onChange={(e) => setMedReason(e.target.value)}
                          placeholder="e.g. Sleep, cramps, headache"
                          className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-teal-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Save Medication / Supplement</span>
                    </button>
                  </form>
                )}

              </div>
            )}

            {/* ================= VIEW 2: TIMELINE FEED ================= */}
            {activeTab === 'timeline' && (
              <div className="space-y-4">
                
                <div className="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                  {[
                    { id: 'all', label: 'All Events' },
                    { id: 'meal', label: 'Meals' },
                    { id: 'symptom', label: 'Flares' },
                    { id: 'exercise', label: 'Workouts' },
                    { id: 'stool', label: 'Bowel' },
                    { id: 'medication', label: 'Meds & Sups' },
                    { id: 'lifestyle', label: 'Habits' }
                  ].map(f => {
                    const count = f.id === 'all' ? logs.length : logs.filter(l => l.type === f.id).length;
                    const isActive = timelineFilter === f.id;
                    return (
                      <button
                        key={f.id}
                        onClick={() => setTimelineFilter(f.id)}
                        className={`px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition flex items-center space-x-1.5 ${
                          isActive 
                            ? 'bg-indigo-600 text-white shadow-sm' 
                            : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200'
                        }`}
                      >
                        <span>{f.label}</span>
                        <span className="text-[10px] px-1 rounded-md bg-black/20 font-mono">{count}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="space-y-2.5">
                  {filteredTimelineLogs.length === 0 ? (
                    <div className="text-center py-12 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">
                      <Icon name="Filter" className="w-8 h-8 text-slate-600 mx-auto mb-2" />
                      <p className="text-sm font-semibold text-slate-300">No events logged yet</p>
                      <p className="text-xs text-slate-500 mt-1">Start logging meals, habits, or workouts in the Capture tab.</p>
                    </div>
                  ) : (
                    filteredTimelineLogs.map(item => {
                      let badgeColor = 'bg-slate-800 text-slate-300';
                      let iconName = 'Utensils';

                      if (item.type === 'meal') {
                        badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
                        iconName = 'Utensils';
                      } else if (item.type === 'symptom') {
                        badgeColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
                        iconName = 'AlertCircle';
                      } else if (item.type === 'exercise') {
                        badgeColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                        iconName = 'Flame';
                      } else if (item.type === 'stool') {
                        badgeColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
                        iconName = 'FileText';
                      } else if (item.type === 'medication') {
                        badgeColor = 'bg-teal-500/20 text-teal-300 border border-teal-500/30';
                        iconName = 'ShieldCheck';
                      } else if (item.type === 'lifestyle') {
                        badgeColor = 'bg-violet-500/20 text-violet-300 border border-violet-500/30';
                        iconName = 'Moon';
                      }

                      return (
                        <div
                          key={item.id}
                          className="group bg-slate-900/70 p-3.5 rounded-2xl border border-slate-800/80 flex flex-col space-y-2.5 transition hover:border-slate-700/80"
                        >
                          <div className="flex items-start justify-between space-x-3">
                            <div className="flex items-start space-x-3 flex-1 min-w-0">
                              <div className={`p-2 rounded-xl shrink-0 ${badgeColor}`}>
                                <Icon name={iconName} className="w-4 h-4" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center space-x-2">
                                  <span className="text-xs font-bold text-white truncate">
                                    {item.title || item.name || 'Habits Check-in'}
                                  </span>
                                  {item.caloriesKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40">
                                      +{item.caloriesKcal} kcal ({Math.round(item.caloriesKcal * 4.184)} kJ)
                                    </span>
                                  )}
                                  {item.caloriesBurnedKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      -{item.caloriesBurnedKcal} kcal ({Math.round(item.caloriesBurnedKcal * 4.184)} kJ)
                                    </span>
                                  )}
                                  {item.severity && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      Sev {item.severity}/5
                                    </span>
                                  )}
                                  {item.bristolType && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40">
                                      Bristol Type {item.bristolType}
                                    </span>
                                  )}
                                </div>

                                <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1 text-[11px] text-slate-400">
                                  {item.type === 'meal' && (
                                    <>
                                      <span>{item.proteinG || 0}g protein</span>
                                      <span>•</span>
                                      <span>{item.sugarG || 0}g sugar</span>
                                      <span>•</span>
                                      <span>{item.sodiumMg || 0}mg sodium</span>
                                      <span>•</span>
                                      <span>{item.waterMl || 0}ml fluid</span>
                                      {item.isLateNight && <span className="text-amber-400 font-semibold">🌙 Late Night</span>}
                                    </>
                                  )}
                                  {item.type === 'exercise' && (
                                    <>
                                      <span>{item.durationMins} mins</span>
                                      <span>•</span>
                                      <span>RPE {item.intensity}/10</span>
                                      <span>•</span>
                                      <span>{item.steps?.toLocaleString()} steps</span>
                                      <span>•</span>
                                      <span className="text-rose-400 font-medium">-{item.caloriesBurnedKcal || 300} kcal</span>
                                    </>
                                  )}
                                  {item.type === 'lifestyle' && (
                                    <>
                                      {item.sleepHours !== undefined && <span>{item.sleepHours}h sleep</span>}
                                      {item.hrvMs !== undefined && <><span>•</span><span>{item.hrvMs}ms HRV</span></>}
                                      {item.waterTotalMl !== undefined && <><span>•</span><span>{((item.waterTotalMl || 0)/1000).toFixed(1)}L water</span></>}
                                      {item.caloriesBurnedTotalKcal !== undefined && <><span>•</span><span className="text-rose-400 font-medium">-{item.caloriesBurnedTotalKcal} kcal burn</span></>}
                                    </>
                                  )}
                                  {item.type === 'medication' && (
                                    <>
                                      <span>{item.dose}</span>
                                      <span>•</span>
                                      <span>For {item.reason}</span>
                                    </>
                                  )}
                                  {item.notes && (
                                    <p className="w-full text-slate-300 text-[11px] italic mt-0.5">"{item.notes}"</p>
                                  )}
                                </div>

                                {item.tags && item.tags.length > 0 && (
                                  <div className="flex flex-wrap gap-1 mt-1.5">
                                    {item.tags.map(t => (
                                      <span key={t} className="text-[9px] font-mono font-medium px-1.5 py-0.5 rounded bg-slate-950 text-indigo-300 border border-slate-800">
                                        #{t}
                                      </span>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="text-[10px] text-slate-400 block font-mono">{item.timestamp}</span>
                              <span className="text-[9px] text-slate-500 block">{formatShortDate(item.date)}</span>
                            </div>
                          </div>

                          {/* Edit & Delete Action Row */}
                          <div className="flex items-center justify-end space-x-1.5 pt-1.5 border-t border-slate-800/60">
                            <button
                              type="button"
                              onClick={() => handleStartEdit(item)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-indigo-300 text-[10px] font-medium transition flex items-center space-x-1"
                            >
                              <Icon name="Edit2" className="w-3 h-3 text-indigo-400" />
                              <span>Edit</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => setDeletingItemId(item.id)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-800/60 text-slate-400 hover:text-rose-300 text-[10px] font-medium transition flex items-center space-x-1"
                            >
                              <Icon name="Trash2" className="w-3 h-3 text-rose-400" />
                              <span>Delete</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}

                            const maxSev = d.maxSeverity;

                            return (
                              <div 
                                key={idx} 
                                onClick={() => setSelectedChartPoint(d)}

                                </span>
                                <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                                  <div 
                                    className={`w-full rounded-lg transition-all duration-500 ${
                                      maxSev >= 4
                                        ? 'bg-gradient-to-t from-rose-800 to-red-500 shadow-sm shadow-rose-500/30'
                                        : maxSev >= 3
                                        ? 'bg-gradient-to-t from-amber-700 to-rose-400'
                                        : score > 0
                                        ? 'bg-gradient-to-t from-emerald-700 to-amber-400'
                                        : 'bg-slate-800/40'
                                    }`}

                                  ></div>
                                </div>
                                <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">
                                  {d.label}
                                </span>
                              </div>
                            );

                    <span>Model: <strong className="text-indigo-200">Gemini 3 Flash</strong></span>

                        </span>
                      </div>
                      <p className="text-xs font-medium text-slate-200 leading-relaxed">
                        {aiReport.leadHypothesis}
                      </p>
                    </div>

                    <div className="space-y-2">
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">

                      </h3>

                        <div key={idx} className="bg-slate-900/80 p-4 rounded-3xl border border-slate-800 space-y-2.5">

                            <span className="text-xs font-bold text-white flex items-center">
                              <Icon name="AlertCircle" className="w-3.5 h-3.5 mr-1.5 text-rose-400 shrink-0" />
                              <span>{item.trigger} → {item.symptom}</span>
                            </span>
                            <span className="text-[9.5px] font-mono font-bold px-2 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">

                          </div>

                          <div className="grid grid-cols-2 gap-1.5 text-[10px] font-medium">
                            <div className="bg-slate-950 px-2 py-1.5 rounded-xl border border-slate-800 text-slate-300 flex items-center space-x-1.5">
                              <Icon name="Activity" className="w-3 h-3 text-indigo-400 shrink-0" />
                              <span className="truncate"><strong>Frequency:</strong> {item.frequency}</span>
                            </div>
                            <div className="bg-slate-950 px-2 py-1.5 rounded-xl border border-slate-800 text-slate-300 flex items-center space-x-1.5">
                              <Icon name="Clock" className="w-3 h-3 text-amber-400 shrink-0" />
                              <span className="truncate"><strong>Lag:</strong> {item.lagTime}</span>
                            </div>
                          </div>

                          <p className="text-xs text-slate-400 leading-relaxed border-t border-slate-800/80 pt-2">
                            {item.explanation}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {!aiReport && (
                  <div className="text-center py-10 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">
                    <Icon name="Sparkles" className="w-8 h-8 text-indigo-400 mx-auto mb-2 opacity-80" />
                    <p className="text-sm font-semibold text-slate-300">No longitudinal synthesis yet</p>
                    <p className="text-xs text-slate-500 mt-1 max-w-xs mx-auto">

                    </p>
                    <button
                      onClick={runAICorrelationAnalysis}
                      className="mt-4 px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-md shadow-indigo-600/30 hover:bg-indigo-500 transition"

                      Analyze My Complete Data
                    </button>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* ================= LIVE BARCODE SCANNER OVERLAY MODAL ================= */}
          {showBarcodeScannerModal && (

                  <Icon name="Barcode" className="w-5 h-5 text-emerald-400" />

                </div>

                <div className="flex items-center space-x-2">
                  <button

                    onClick={toggleScannerTorch}

                      scannerTorchOn 
                        ? 'bg-amber-500 text-slate-950 border-amber-400' 
                        : 'bg-slate-900/80 text-slate-300 border-slate-700'

                    title="Toggle Flashlight"
                  >
                    <Icon name="Zap" className="w-4 h-4" />
                  </button>

                  <button
                    type="button"
                    onClick={() => {

                      setShowBarcodeScannerModal(false);

                    <Icon name="X" className="w-4 h-4" />

                <video

                  autoPlay

                  {/* Corner Brackets */}
                  <div className="absolute top-0 left-0 w-5 h-5 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
                  <div className="absolute top-0 right-0 w-5 h-5 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
                  <div className="absolute bottom-0 left-0 w-5 h-5 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
                  <div className="absolute bottom-0 right-0 w-5 h-5 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>

                  {/* Animated Laser Line */}
                  <div className="scanner-laser-line absolute left-2 right-2 h-0.5 bg-emerald-400 shadow-[0_0_12px_2px_rgba(52,211,153,0.9)]"></div>
                </div>
              </div>
