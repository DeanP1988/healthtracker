                  <Icon name="Camera" className="w-4 h-4" />
                  <span>{isScanningBarcode ? 'Reading Frame...' : 'Scan Frame Now (AI Vision Fallback)'}</span>
                </button>

                <div className="flex items-center space-x-2">
                  <input
                    type="text"
                    inputMode="numeric"
                    value={manualBarcodeCode}
                    onChange={(e) => setManualBarcodeCode(e.target.value)}
                    placeholder="Or type EAN-13 / UPC barcode digits..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 font-mono"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      if (manualBarcodeCode.trim()) {
                        lookupBarcodeNutritionalData(manualBarcodeCode.trim());
                        setManualBarcodeCode('');
                      }
                    }}
                    className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 text-xs font-bold border border-slate-700"
                  >
                    Lookup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= DAILY GOALS & PROFILE MODAL ================= */}
          {showGoalsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white flex items-center">
                    <Icon name="Target" className="w-4 h-4 mr-2 text-emerald-400" />
                    Daily Goals & Metabolism Profile
                  </h3>
                  <button
                    onClick={() => setShowGoalsModal(false)}
                    className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-1.5 bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Flame" className="w-3.5 h-3.5 mr-1 text-emerald-400" /> Body Weight (Metabolism)
                    </span>
                    <span className="text-emerald-400 font-mono font-bold">{tempWeightKg} kg ({(tempWeightKg * 2.20462).toFixed(1)} lbs)</span>
                  </div>
                  <input
                    type="range"
                    min="40"
                    max="160"
                    step="1"
                    value={tempWeightKg}
                    onChange={(e) => setTempWeightKg(Number(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                </div>

                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Activity" className="w-3.5 h-3.5 mr-1 text-emerald-400" /> Daily Steps Target
                    </span>
                    <span className="text-emerald-400 font-mono font-bold">{tempSteps.toLocaleString()}</span>
                  </div>
                  <input
                    type="range"
                    min="3000"
                    max="20000"
                    step="500"
                    value={tempSteps}
                    onChange={(e) => setTempSteps(Number(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                </div>

                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Droplets" className="w-3.5 h-3.5 mr-1 text-cyan-400" /> Daily Water Target
                    </span>
                    <span className="text-cyan-400 font-mono font-bold">{tempWaterL} Litres</span>
                  </div>
                  <input
                    type="range"
                    min="1.0"
                    max="5.0"
                    step="0.1"
                    value={tempWaterL}
                    onChange={(e) => setTempWaterL(e.target.value)}
                    className="w-full accent-cyan-400 cursor-pointer"
                  />
                </div>

                <div className="pt-2 flex gap-2">
                  <button
                    type="button"
                    onClick={() => setShowGoalsModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={saveGoals}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-500 shadow-md"
                  >
                    Save Goals
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= SYSTEM SETTINGS, PUSH NOTIFICATIONS & UPDATES MODAL ================= */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white flex items-center">
                    <Icon name="Settings" className="w-4 h-4 mr-2 text-indigo-400" />
                    Settings, Alerts & Updates
                  </h3>
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                {/* PUSH NOTIFICATIONS SECTION */}
                <div className="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <Icon name="Bell" className="w-4 h-4 text-indigo-400" />
                      <div>
                        <span className="text-xs font-bold text-white block">Push Notifications</span>
                        <span className="text-[10px] text-slate-400">
                          Status: <strong className={notifPermission === 'granted' ? 'text-emerald-400' : 'text-amber-400'}>
                            {notifPermission === 'granted' ? 'Enabled' : notifPermission === 'denied' ? 'Blocked' : 'Action Required'}
                          </strong>
                        </span>
                      </div>
                    </div>

                    {notifPermission !== 'granted' ? (
                      <button
                        type="button"
                        onClick={requestNotificationPermission}
                        className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold shadow-sm transition"
                      >
                        Enable
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={sendTestNotification}
                        className="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-indigo-300 text-[10px] font-bold border border-slate-700"
                      >
                        Test Alert
                      </button>
                    )}
                  </div>

                  {/* Notification Toggles List */}
                  <div className="space-y-2 pt-2 border-t border-slate-800/80">
                    {[
                      {
                        key: 'habitsMissingEndOfDay',
                        title: 'End-of-Day Missing Habits Alert',
                        desc: 'Remind at 8:30 PM if any of the 7 daily habits haven’t been logged'
                      },
                      {
                        key: 'waterBelowTarget',
                        title: 'Water Deficit Alert',
                        desc: 'Notify at 3:00 PM if water intake is below daily target'
                      },
                      {
                        key: 'stepsBehindMidday',
                        title: 'Midday Step Motility Check',
                        desc: 'Alert if afternoon steps are below 50% of daily goal'
                      },
                      {
                        key: 'postMealSymptomCheck',
                        title: 'Post-Meal Symptom Prompt',
                        desc: 'Check-in 90 min after meals tagged with dairy, gluten, or sugar'
                      },
                      {
                        key: 'lateNightCurfew',
                        title: 'Late-Night Kitchen Curfew',
                        desc: 'Reminder 2.5 hrs before sleep to protect overnight HRV'
                      }
                    ].map(item => {
                      const enabled = Boolean(notifToggles[item.key]);
                      return (
                        <div key={item.key} className="flex items-start justify-between gap-2.5 py-1">
                          <div className="flex-1">
                            <span className="text-[11px] font-semibold text-slate-200 block">{item.title}</span>
                            <span className="text-[9.5px] text-slate-400 leading-tight block">{item.desc}</span>
                          </div>
                          <button
                            type="button"
                            onClick={() => updateNotifToggle(item.key, !enabled)}
                            className={`w-10 h-5 rounded-full transition-colors p-0.5 shrink-0 mt-0.5 ${
                              enabled ? 'bg-indigo-600' : 'bg-slate-800 border border-slate-700'
                            }`}
                          >
                            <div
                              className={`w-4 h-4 rounded-full bg-white shadow-sm transform transition-transform ${
                                enabled ? 'translate-x-5' : 'translate-x-0'
                              }`}
                            />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* GITHUB DEPLOYMENT UPDATE CHECKER */}
                <div className="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white flex items-center">
                      <Icon name="RefreshCw" className="w-3.5 h-3.5 mr-1.5 text-emerald-400" />
                      Check GitHub for App Updates
                    </span>
                  </div>

                  <div className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800/90 text-[10px] text-slate-400 space-y-1">
                    <p className="text-slate-300 font-semibold">What do I type in this box?</p>
                    <p>Enter your GitHub repository path (<code className="text-indigo-300 font-mono">username/repo-name</code>) or paste your full GitHub URL where this <code className="text-indigo-300 font-mono">index.html</code> is hosted.</p>
                    <p className="text-[9.5px] text-slate-500 font-mono">Example: johnsmith/pulsehealth</p>
                  </div>

                  <div className="flex gap-1.5">
                    <input
                      type="text"
                      value={githubRepo}
                      onChange={(e) => setGithubRepo(e.target.value)}
                      placeholder="username/pulsehealth"
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500 font-mono"
                    />
                    <button
                      type="button"
                      onClick={checkForAppUpdate}
                      disabled={isCheckingUpdate}
                      className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition disabled:opacity-50"
                    >
                      {isCheckingUpdate ? 'Checking...' : 'Check'}
                    </button>
                  </div>

                  {updateStatus && (
                    <div className={`p-2.5 rounded-xl border text-[11px] space-y-2 ${
                      updateStatus.available 
                        ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200' 
                        : 'bg-slate-900 border-slate-800 text-slate-300'
                    }`}>
                      <p>{updateStatus.message}</p>
                      {updateStatus.available && (
                        <button
                          type="button"
                          onClick={handleApplyAppUpdate}
                          className="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition"
                        >
                          Update & Reload App Now (Preserves All Data)
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* DATA BACKUP & RESTORE (JSON) */}
                <div className="pt-2 border-t border-slate-800 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
                    Data Retention & Backup (JSON)
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute("href", dataStr);
                        downloadAnchor.setAttribute("download", `pulsehealth_backup_${new Date().toISOString().split('T')[0]}.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                        showToast('Backup JSON downloaded!');
                      }}
                      className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1"
                    >
                      <Icon name="Download" className="w-3.5 h-3.5 text-indigo-400" />
                      <span>Download JSON</span>
                    </button>
                    <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1 cursor-pointer">
                      <Icon name="RefreshCw" className="w-3.5 h-3.5 text-emerald-400" />
                      <span>Restore JSON</span>
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (event) => {
                            try {
                              const parsed = JSON.parse(event.target.result);
                              if (Array.isArray(parsed)) {
                                setLogs(parsed);
                                showToast(`Successfully restored ${parsed.length} logs!`);
                                setShowSettingsModal(false);
                              }
                            } catch {
                              showToast('Invalid backup file');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setShowSettingsModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {/* Delete Confirmation Modal */}
          {deletingItemId && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center space-x-2 text-rose-400">
                  <div className="w-9 h-9 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center">
                    <Icon name="Trash2" className="w-5 h-5 text-rose-400" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-white">Delete Entry?</h3>
                    <p className="text-[11px] text-slate-400">This action will permanently remove this record.</p>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setDeletingItemId(null)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => handleDeleteLog(deletingItemId)}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md shadow-rose-600/30 transition flex items-center justify-center space-x-1"
                  >
                    <Icon name="Trash2" className="w-3.5 h-3.5" />
                    <span>Confirm Delete</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Edit Entry Modal */}
          {editingItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl my-auto max-h-[90vh] overflow-y-auto">
                
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-300">
                      <Icon name="Edit2" className="w-4 h-4" />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white capitalize">Edit {editingItem.type}</h3>
                      <p className="text-[10px] text-slate-400">{formatShortDate(editingItem.date)} • {editingItem.timestamp}</p>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => setEditingItem(null)}
                    className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleSaveEdit} className="space-y-3.5">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Date (YYYY-MM-DD)
                      </label>
                      <input
                        type="date"
                        value={editingItem.date || ''}
                        onChange={(e) => setEditingItem({ ...editingItem, date: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Timestamp
                      </label>
                      <input
                        type="text"
                        value={editingItem.timestamp || ''}
                        onChange={(e) => setEditingItem({ ...editingItem, timestamp: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200"
                        required
                      />
                    </div>
                  </div>

                  {editingItem.type !== 'lifestyle' && (
                    <div>
                      <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        {editingItem.type === 'medication' ? 'Medication / Supplement Name' : 'Title / Description'}
                      </label>
                      <input
                        type="text"
                        value={editingItem.title !== undefined ? editingItem.title : editingItem.name || ''}
                        onChange={(e) => setEditingItem({ 
                          ...editingItem, 
                          ...(editingItem.title !== undefined ? { title: e.target.value } : { name: e.target.value })
                        })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                        required
                      />
                    </div>
                  )}

                  {editingItem.type === 'meal' && (
                    <div className="space-y-3 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-amber-400 font-semibold flex items-center">
                          <Icon name="Flame" className="w-3.5 h-3.5 mr-1" /> Energy Intake
                        </span>
                        <span className="font-mono text-amber-400 font-bold">{editingItem.caloriesKcal || 0} kcal</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="2000"
                        step="25"
                        value={editingItem.caloriesKcal || 0}
                        onChange={(e) => setEditingItem({ ...editingItem, caloriesKcal: Number(e.target.value) })}
                        className="w-full accent-amber-500 cursor-pointer"
                      />

                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <span className="text-[10px] text-slate-400 block">Protein (g)</span>
                          <input
                            type="number"
                            min="0"
                            max="200"
                            value={editingItem.proteinG || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, proteinG: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Carbs (g)</span>
                          <input
                            type="number"
                            min="0"
                            max="300"
                            value={editingItem.carbsG || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, carbsG: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Sugar (g)</span>
                          <input
                            type="number"
                            min="0"
                            max="150"
                            value={editingItem.sugarG || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, sugarG: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Sodium (mg)</span>
                          <input
                            type="number"
                            min="0"
                            max="5000"
                            value={editingItem.sodiumMg || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, sodiumMg: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'exercise' && (
                    <div className="grid grid-cols-2 gap-2 bg-slate-950/60 p-3 rounded-2xl border border-slate-800 text-xs">
                      <div>
                        <span className="text-[10px] text-slate-400 block">Duration (min)</span>
                        <input
                          type="number"
                          value={editingItem.durationMins || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, durationMins: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Intensity RPE (1-10)</span>
                        <input
                          type="number"
                          min="1"
                          max="10"
                          value={editingItem.intensity || 5}
                          onChange={(e) => setEditingItem({ ...editingItem, intensity: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Session Steps</span>
                        <input
                          type="number"
                          value={editingItem.steps || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, steps: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Active Burn (kcal)</span>
                        <input
                          type="number"
                          value={editingItem.caloriesBurnedKcal || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, caloriesBurnedKcal: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-rose-300 font-bold"
                        />
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'symptom' && (
                    <div className="space-y-3 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-rose-400 font-semibold">Severity Rating</span>
                        <span className="font-mono text-rose-400 font-bold">{editingItem.severity || 1} / 5</span>
                      </div>
                      <div className="flex justify-between gap-1">
                        {[1, 2, 3, 4, 5].map(lvl => (
                          <button
                            type="button"
                            key={lvl}
                            onClick={() => setEditingItem({ ...editingItem, severity: lvl })}
                            className={`flex-1 py-1.5 rounded-xl font-bold text-xs transition ${
                              editingItem.severity === lvl
                                ? 'bg-rose-600 text-white shadow-sm'
                                : 'bg-slate-900 text-slate-400 border border-slate-800'
                            }`}
                          >
                            {lvl}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'stool' && (
                    <div className="space-y-2 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
                      <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">
                        Bristol Stool Type (1 - 7)
                      </label>
                      <div className="grid grid-cols-7 gap-1">
                        {[1, 2, 3, 4, 5, 6, 7].map(t => (
                          <button
                            type="button"
                            key={t}
                            onClick={() => setEditingItem({ ...editingItem, bristolType: t, title: `Bristol Type ${t} Movement` })}
                            className={`py-2 rounded-xl font-bold text-xs transition ${
                              editingItem.bristolType === t
                                ? 'bg-amber-600 text-white shadow-sm'
                                : 'bg-slate-900 text-slate-400 border border-slate-800'
                            }`}
                          >
                            T{t}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'medication' && (
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                          Dosage
                        </label>
                        <input
                          type="text"
                          value={editingItem.dose || ''}
                          onChange={(e) => setEditingItem({ ...editingItem, dose: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                          Reason
                        </label>
                        <input
                          type="text"
                          value={editingItem.reason || ''}
                          onChange={(e) => setEditingItem({ ...editingItem, reason: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200"
                        />
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'lifestyle' && (
                    <div className="grid grid-cols-2 gap-2 bg-slate-950/60 p-3 rounded-2xl border border-slate-800 text-xs">
                      <div>
                        <span className="text-[10px] text-slate-400 block">Sleep (hrs)</span>
                        <input
                          type="number"
                          step="0.5"
                          value={editingItem.sleepHours || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, sleepHours: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Overnight HRV (ms)</span>
                        <input
                          type="number"
                          value={editingItem.hrvMs || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, hrvMs: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Resting HR (bpm)</span>
                        <input
                          type="number"
                          value={editingItem.restingHr || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, restingHr: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Stress (1-5)</span>
                        <input
                          type="number"
                          min="1"
                          max="5"
                          value={editingItem.stressLevel || 1}
                          onChange={(e) => setEditingItem({ ...editingItem, stressLevel: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Water Total (ml)</span>
                        <input
                          type="number"
                          step="100"
                          value={editingItem.waterTotalMl || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, waterTotalMl: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Total Steps</span>
                        <input
                          type="number"
                          step="500"
                          value={editingItem.steps || 0}
                          onChange={(e) => setEditingItem({ ...editingItem, steps: Number(e.target.value) })}
                          className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                        />
                      </div>
                    </div>
                  )}

                  {editingItem.type !== 'lifestyle' && (
                    <div>
                      <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Notes
                      </label>
                      <textarea
                        value={editingItem.notes || ''}
                        onChange={(e) => setEditingItem({ ...editingItem, notes: e.target.value })}
                        rows={2}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                        placeholder="Add or update notes..."
                      />
                    </div>
                  )}

                  <div className="flex gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setEditingItem(null)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md shadow-indigo-600/30 transition flex items-center justify-center space-x-1"
                    >
                      <Icon name="Check" className="w-3.5 h-3.5" />
                      <span>Save Changes</span>
                    </button>
                  </div>

                </form>
              </div>
            </div>
          )}

          {/* iOS Floating Bottom Tab Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/95 backdrop-blur-lg border-t border-slate-900 px-6 py-2.5 pb-safe z-40">
            <div className="flex items-center justify-between">
              {[
                { id: 'add', label: 'Capture', icon: 'Plus' },
                { id: 'timeline', label: 'Timeline', icon: 'Calendar' },
                { id: 'analytics', label: 'Trends', icon: 'BarChart2' },
                { id: 'ai', label: 'AI Insights', icon: 'Sparkles' }
              ].map(tab => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center py-1 transition ${
                      isActive ? 'text-indigo-400' : 'text-slate-500 hover:text-slate-300'
                    }`}
                  >
                    <div className={`p-1.5 rounded-xl transition ${isActive ? 'bg-indigo-500/20 shadow-sm' : ''}`}>
                      <Icon name={tab.icon} className="w-5 h-5" />
                    </div>
                    <span className={`text-[10px] mt-0.5 font-medium ${isActive ? 'font-bold text-slate-100' : ''}`}>
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
