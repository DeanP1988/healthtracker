    // Helper wrapper to render Lucide SVG icons safely in browser environment
    function Icon({ name, className = "w-4 h-4", ...props }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!window.lucide || !containerRef.current) return;
        const iconDef = window.lucide.icons[name];
        if (iconDef) {
          const svgElement = window.lucide.createElement(iconDef);
          // Apply class attributes
          className.split(' ').forEach(cls => {
            if (cls.trim()) svgElement.classList.add(cls.trim());
          });
          containerRef.current.innerHTML = '';
          containerRef.current.appendChild(svgElement);
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" {...props} />;
    }

    function App() {
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('pulsehealth_logs');
          return saved ? JSON.parse(saved) : INITIAL_LOGS;
        } catch {
          return INITIAL_LOGS;
        }
      });

      const [activeTab, setActiveTab] = useState('add'); // 'add', 'timeline', 'analytics', 'ai'
      const [addMode, setAddMode] = useState('meal'); // 'meal', 'symptom', 'stool', 'exercise', 'lifestyle', 'medication'

      // Goals & User Profile
      const [targetSteps, setTargetSteps] = useState(8000);
      const [targetWaterMl, setTargetWaterMl] = useState(2500);
      const [userWeightKg, setUserWeightKg] = useState(() => {
        try {
          const w = localStorage.getItem('pulsehealth_user_weight');
          return w ? Number(w) : 75;
        } catch {
          return 75;
        }
      });
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [tempSteps, setTempSteps] = useState(8000);
      const [tempWaterL, setTempWaterL] = useState('2.5');
      const [tempWeightKg, setTempWeightKg] = useState(75);

      // Timeline Filter & Editing State
      const [timelineFilter, setTimelineFilter] = useState('all');
      const [editingItem, setEditingItem] = useState(null);
      const [deletingItemId, setDeletingItemId] = useState(null);

      // Analytics Options
      const [analyticsDaysRange, setAnalyticsDaysRange] = useState(7);
      const [analyticsAggregation, setAnalyticsAggregation] = useState('auto');
      const [activeMetricTab, setActiveMetricTab] = useState('calories');
      const [saltSugarViewMode, setSaltSugarViewMode] = useState('both');
      const [selectedChartPoint, setSelectedChartPoint] = useState(null);

      // Form State - Meal (Defaults to nil / 0)
      const [mealTitle, setMealTitle] = useState('');
      const [mealTags, setMealTags] = useState([]);
      const [mealCalories, setMealCalories] = useState(0);
      const [mealProtein, setMealProtein] = useState(0);
      const [mealCarbs, setMealCarbs] = useState(0);
      const [mealSugar, setMealSugar] = useState(0);
      const [mealSodium, setMealSodium] = useState(0);
      const [mealWater, setMealWater] = useState(0);
      const [mealPace, setMealPace] = useState('relaxed');
      const [mealPosture, setMealPosture] = useState('table');
      const [isLateNight, setIsLateNight] = useState(false);
      const [isAnalyzingPhoto, setIsAnalyzingPhoto] = useState(false);
      const [isEstimatingMealAI, setIsEstimatingMealAI] = useState(false);
      const [isScanningBarcode, setIsScanningBarcode] = useState(false);

      // Dates and Australian en-AU format
      const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);
      const currentTimeStr = useMemo(() => {
        return new Date().toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: true });
      }, []);

      // Habits State & Past Date Pop-up
      const [lifestyleDate, setLifestyleDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [lifestyleSleep, setLifestyleSleep] = useState(7.5);
      const [lifestyleStress, setLifestyleStress] = useState(2);
      const [lifestyleRestingHr, setLifestyleRestingHr] = useState(60);
      const [lifestyleHrv, setLifestyleHrv] = useState(58);
      const [lifestyleWater, setLifestyleWater] = useState(2500);
      const [lifestyleSteps, setLifestyleSteps] = useState(8000);
      const [lifestyleCaloriesBurned, setLifestyleCaloriesBurned] = useState(450);

      // Tooltip Info Overlays
      const [showHrGuide, setShowHrGuide] = useState(false);
      const [showHrvGuide, setShowHrvGuide] = useState(false);
      const [showStressGuide, setShowStressGuide] = useState(false);

      // Flare, Stool, Workout, Meds Forms
      const [symptomTitle, setSymptomTitle] = useState('');
      const [symptomCategory, setSymptomCategory] = useState('headache');
      const [symptomSeverity, setSymptomSeverity] = useState(3);
      const [symptomNotes, setSymptomNotes] = useState('');

      const [bristolType, setBristolType] = useState(4);
      const [stoolNotes, setStoolNotes] = useState('');

      const [exerciseTitle, setExerciseTitle] = useState('');
      const [workoutFocus, setWorkoutFocus] = useState('lifting_upper');
      const [workoutDuration, setWorkoutDuration] = useState(45);
      const [workoutIntensity, setWorkoutIntensity] = useState(7);
      const [workoutSteps, setWorkoutSteps] = useState(3500);
      const [workoutCaloriesBurned, setWorkoutCaloriesBurned] = useState(350);
      const [isEstimatingWorkoutAI, setIsEstimatingWorkoutAI] = useState(false);

      const [medName, setMedName] = useState('Magnesium');
      const [medDose, setMedDose] = useState('350mg');
      const [medReason, setMedReason] = useState('Sleep & muscle recovery');

      // AI Analysis
      const [isAnalyzingAI, setIsAnalyzingAI] = useState(false);
      const [aiReport, setAiReport] = useState(null);
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3200);
      };

      const formatShortDate = (iso) => {
        if (!iso) return '';
        const p = iso.split('-');
        return p.length >= 3 ? `${p[2]}/${p[1]}` : iso;
      };

      const formatDateLabel = (iso) => {
        if (!iso) return '';
        try {
          const d = new Date(iso + 'T00:00:00');
          return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
        } catch {
          return iso;
        }
      };

      // Reset meal helper
      const resetMealForm = () => {
        setMealTitle('');
        setMealTags([]);
        setMealCalories(0);
        setMealProtein(0);
        setMealCarbs(0);
        setMealSugar(0);
        setMealSodium(0);
        setMealWater(0);
        setMealPace('relaxed');
        setMealPosture('table');
        setIsLateNight(false);
      };

      useEffect(() => {
        if (activeTab === 'add' && addMode === 'meal') {
          resetMealForm();
        }
      }, [activeTab, addMode]);

      // Calculate Workout Burn dynamically from weight and MET
      useEffect(() => {
        let met = 3.5;
        if (workoutFocus === 'lifting_upper') met = 4.0 + (workoutIntensity * 0.4);
        else if (workoutFocus === 'lifting_lower') met = 5.0 + (workoutIntensity * 0.5);
        else if (workoutFocus === 'cardio_hiit') met = 6.2 + (workoutIntensity * 0.65);
        else if (workoutFocus === 'mobility_walk') met = 2.8 + (workoutIntensity * 0.2);

        const hours = workoutDuration / 60;
        const activeBurn = Math.round(met * userWeightKg * hours);
        const stepBurn = Math.round(workoutSteps * 0.04);
        setWorkoutCaloriesBurned(Math.max(activeBurn, stepBurn + Math.round(activeBurn * 0.5)));
      }, [workoutDuration, workoutIntensity, workoutSteps, workoutFocus, userWeightKg]);

      // Save to localStorage
      useEffect(() => {
        try {
          localStorage.setItem('pulsehealth_logs', JSON.stringify(logs));
        } catch (e) {
          console.error(e);
        }
      }, [logs]);

      // Find lifestyle log for chosen date
      const existingLifestyleLog = useMemo(() => {
        return logs.find(l => l.date === lifestyleDate && l.type === 'lifestyle') || null;
      }, [logs, lifestyleDate]);

      useEffect(() => {
        if (existingLifestyleLog) {
          if (typeof existingLifestyleLog.sleepHours === 'number') setLifestyleSleep(existingLifestyleLog.sleepHours);
          if (typeof existingLifestyleLog.stressLevel === 'number') setLifestyleStress(existingLifestyleLog.stressLevel);
          if (typeof existingLifestyleLog.restingHr === 'number') setLifestyleRestingHr(existingLifestyleLog.restingHr);
          if (typeof existingLifestyleLog.hrvMs === 'number') setLifestyleHrv(existingLifestyleLog.hrvMs);
          if (typeof existingLifestyleLog.waterTotalMl === 'number') setLifestyleWater(existingLifestyleLog.waterTotalMl);
          if (typeof existingLifestyleLog.steps === 'number') setLifestyleSteps(existingLifestyleLog.steps);
          if (typeof existingLifestyleLog.caloriesBurnedTotalKcal === 'number') setLifestyleCaloriesBurned(existingLifestyleLog.caloriesBurnedTotalKcal);
        }
      }, [existingLifestyleLog, lifestyleDate]);

      const isSleepLogged = existingLifestyleLog && typeof existingLifestyleLog.sleepHours === 'number' && existingLifestyleLog.sleepHours === Number(lifestyleSleep);
      const isStressLogged = existingLifestyleLog && typeof existingLifestyleLog.stressLevel === 'number' && existingLifestyleLog.stressLevel === Number(lifestyleStress);
      const isHrvLogged = existingLifestyleLog && typeof existingLifestyleLog.hrvMs === 'number' && existingLifestyleLog.hrvMs === Number(lifestyleHrv);
      const isRestingHrLogged = existingLifestyleLog && typeof existingLifestyleLog.restingHr === 'number' && existingLifestyleLog.restingHr === Number(lifestyleRestingHr);
      const isWaterLogged = existingLifestyleLog && typeof existingLifestyleLog.waterTotalMl === 'number' && existingLifestyleLog.waterTotalMl === Number(lifestyleWater);
      const isBurnLogged = existingLifestyleLog && typeof existingLifestyleLog.caloriesBurnedTotalKcal === 'number' && existingLifestyleLog.caloriesBurnedTotalKcal === Number(lifestyleCaloriesBurned);
      const isStepsLogged = existingLifestyleLog && typeof existingLifestyleLog.steps === 'number' && existingLifestyleLog.steps === Number(lifestyleSteps);

      const handleSaveSingleHabit = (fieldKey, val, label) => {
        setLogs(prev => {
          const idx = prev.findIndex(l => l.date === lifestyleDate && l.type === 'lifestyle');
          if (idx >= 0) {
            const upd = [...prev];
            upd[idx] = { ...upd[idx], [fieldKey]: val, timestamp: currentTimeStr };
            return upd;
          } else {
            return [{
              id: 'life-' + Date.now(),
              date: lifestyleDate,
              timestamp: currentTimeStr,
              type: 'lifestyle',
              [fieldKey]: val
            }, ...prev];
          }
        });
        showToast(`${label} recorded for ${formatShortDate(lifestyleDate)}!`);
      };

      const handleSaveAllHabits = () => {
        setLogs(prev => {
          const idx = prev.findIndex(l => l.date === lifestyleDate && l.type === 'lifestyle');
          const payload = {
            sleepHours: Number(lifestyleSleep),
            stressLevel: Number(lifestyleStress),
            hrvMs: Number(lifestyleHrv),
            restingHr: Number(lifestyleRestingHr),
            waterTotalMl: Number(lifestyleWater),
            caloriesBurnedTotalKcal: Number(lifestyleCaloriesBurned),
            steps: Number(lifestyleSteps),
            timestamp: currentTimeStr
          };
          if (idx >= 0) {
            const upd = [...prev];
            upd[idx] = { ...upd[idx], ...payload };
            return upd;
          } else {
            return [{ id: 'life-' + Date.now(), date: lifestyleDate, type: 'lifestyle', ...payload }, ...prev];
          }
        });
        showToast(`All habits saved for ${formatShortDate(lifestyleDate)}!`);
      };

      // Barcode upload & Nutrition OCR / Open Food Facts Australia
      const handleBarcodeUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setIsScanningBarcode(true);
        showToast('Scanning Australian package / barcode...');

        try {
          const base64Clean = await new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result.split(',')[1]);
            reader.onerror = rej;
            reader.readAsDataURL(file);
          });

          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const systemPrompt = "You are an Australian supermarket and food barcode reader. Read the packaging for barcode numbers (EAN-13) and/or Nutrition Information Panel (NIP) facts. Output JSON with barcode, productName, caloriesKcal, proteinG, carbsG, sugarG, sodiumMg, and tags.";
          const userQuery = "Identify the product name, barcode digits, and Australian nutritional values (converting kJ to kcal if necessary).";

          const payload = {
            contents: [{
              role: "user",
              parts: [
                { text: userQuery },
                { inlineData: { mimeType: file.type || "image/jpeg", data: base64Clean } }
              ]
            }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  barcode: { type: "STRING" },
                  productName: { type: "STRING" },
                  caloriesKcal: { type: "NUMBER" },
                  proteinG: { type: "NUMBER" },
                  carbsG: { type: "NUMBER" },
                  sugarG: { type: "NUMBER" },
                  sodiumMg: { type: "NUMBER" },
                  tags: { type: "ARRAY", items: { type: "STRING" } }
                },
                required: ["productName", "caloriesKcal", "proteinG", "carbsG", "sugarG", "sodiumMg", "tags"]
              }
            }
          };

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          const raw = json?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (raw) {
            const parsed = JSON.parse(raw);
            setMealTitle(parsed.productName || 'Australian Product');
            setMealCalories(Math.round(parsed.caloriesKcal || 250));
            setMealProtein(Math.round(parsed.proteinG || 12));
            setMealCarbs(Math.round(parsed.carbsG || 20));
            setMealSugar(Math.round(parsed.sugarG || 4));
            setMealSodium(Math.round(parsed.sodiumMg || 400));
            if (Array.isArray(parsed.tags)) setMealTags(parsed.tags);
            showToast(`Scanned: ${parsed.productName}`);
          }
        } catch {
          showToast('Could not scan barcode directly. Type description to estimate.');
        } finally {
          setIsScanningBarcode(false);
          e.target.value = '';
        }
      };

      // Meal AI Text Estimator
      const handleEstimateMealWithAI = async () => {
        if (!mealTitle.trim()) {
          showToast('Please type a meal name first!');
          return;
        }

        setIsEstimatingMealAI(true);
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        const systemPrompt = "You are an Australian clinical dietitian. Estimate realistic calories (kcal), macros (protein, carbs, sugar, sodium mg, fluid ml), and dietary tags for meals.";
        const userQuery = `Estimate nutrition for: "${mealTitle}". Return JSON with: caloriesKcal, proteinG, carbsG, sugarG, sodiumMg, waterMl, tags.`;

        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userQuery }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",
                  properties: {
                    caloriesKcal: { type: "NUMBER" },
                    proteinG: { type: "NUMBER" },
                    carbsG: { type: "NUMBER" },
                    sugarG: { type: "NUMBER" },
                    sodiumMg: { type: "NUMBER" },
                    waterMl: { type: "NUMBER" },
                    tags: { type: "ARRAY", items: { type: "STRING" } }
                  },
                  required: ["caloriesKcal", "proteinG", "carbsG", "sugarG", "sodiumMg", "waterMl", "tags"]
                }
              }
            })
          });
          const json = await res.json();
          const raw = json?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (raw) {
            const data = JSON.parse(raw);
            setMealCalories(Math.round(data.caloriesKcal || 400));
            setMealProtein(Math.round(data.proteinG || 15));
            setMealCarbs(Math.round(data.carbsG || 35));
            setMealSugar(Math.round(data.sugarG || 6));
            setMealSodium(Math.round(data.sodiumMg || 550));
            setMealWater(Math.round(data.waterMl || 0));
            if (Array.isArray(data.tags)) setMealTags(data.tags.map(t => t.toLowerCase()));
            showToast('AI estimated macros & calories!');
          }
        } catch {
          // Heuristic fallback
          let cal = 480, p = 25, c = 40, s = 6, na = 650, w = 250;
          const tags = [];
          const lower = mealTitle.toLowerCase();
          if (lower.includes('cheese') || lower.includes('milk') || lower.includes('yogurt')) tags.push('dairy');
          if (lower.includes('bread') || lower.includes('toast') || lower.includes('wrap') || lower.includes('pasta')) tags.push('gluten');
          if (lower.includes('coffee') || lower.includes('espresso')) { tags.push('caffeine'); w = 300; }
          if (lower.includes('sweet') || lower.includes('soda') || lower.includes('cake') || lower.includes('chocolate')) { tags.push('sugar'); s = 34; cal += 200; }
          setMealCalories(cal); setMealProtein(p); setMealCarbs(c); setMealSugar(s); setMealSodium(na); setMealWater(w); setMealTags(tags);
          showToast('Estimated values populated!');
        } finally {
          setIsEstimatingMealAI(false);
        }
      };

      // Add Handlers
      const handleAddMeal = (e) => {
        e.preventDefault();
        if (!mealTitle.trim()) return;

        const newEntry = {
          id: 'meal-' + Date.now(),
          date: todayStr,
          timestamp: currentTimeStr,
          type: 'meal',
          title: mealTitle,
          tags: mealTags,
          caloriesKcal: Number(mealCalories),
          proteinG: Number(mealProtein),
          carbsG: Number(mealCarbs),
          sugarG: Number(mealSugar),
          sodiumMg: Number(mealSodium),
          waterMl: Number(mealWater),
          eatingPace: mealPace,
          posture: mealPosture,
          isLateNight: Boolean(isLateNight)
        };
        setLogs(prev => [newEntry, ...prev]);
        resetMealForm();
        showToast('Meal logged (+energy tracked)');
        setActiveTab('timeline');
      };

      const handleAddSymptom = (e) => {
        e.preventDefault();
        if (!symptomTitle.trim()) return;
        setLogs(prev => [{
          id: 'symp-' + Date.now(),
          date: todayStr,
          timestamp: currentTimeStr,
          type: 'symptom',
          title: symptomTitle,
          symptomCategory: symptomCategory,
          severity: Number(symptomSeverity),
          notes: symptomNotes
        }, ...prev]);
        setSymptomTitle('');
        setSymptomNotes('');
        showToast('Flare registered!');
        setActiveTab('timeline');
      };

      const handleAddStool = (e) => {
        e.preventDefault();
        setLogs(prev => [{
          id: 'stool-' + Date.now(),
          date: todayStr,
          timestamp: currentTimeStr,
          type: 'stool',
          title: `Bristol Type ${bristolType} Movement`,
          bristolType: Number(bristolType),
          notes: stoolNotes
        }, ...prev]);
        setStoolNotes('');
        showToast('Bowel transit saved!');
        setActiveTab('timeline');
      };

      const handleAddExercise = (e) => {
        e.preventDefault();
        setLogs(prev => [{
          id: 'ex-' + Date.now(),
          date: todayStr,
          timestamp: currentTimeStr,
          type: 'exercise',
          title: exerciseTitle.trim() || 'Workout Session',
          workoutFocus: workoutFocus,
          durationMins: Number(workoutDuration),
          intensity: Number(workoutIntensity),
          steps: Number(workoutSteps),
          caloriesBurnedKcal: Number(workoutCaloriesBurned)
        }, ...prev]);
        setExerciseTitle('');
        showToast('Workout saved (-energy burned)!');
        setActiveTab('timeline');
      };

      const handleAddMedication = (e) => {
        e.preventDefault();
        if (!medName.trim()) return;
        setLogs(prev => [{
          id: 'med-' + Date.now(),
          date: todayStr,
          timestamp: currentTimeStr,
          type: 'medication',
          name: medName,
          dose: medDose,
          reason: medReason
        }, ...prev]);
        setMedName('');
        showToast('Medication / supplement recorded!');
        setActiveTab('timeline');
      };

      // Daily Time Series Builder
      const dailyTimeSeries = useMemo(() => {
        const map = {};
        logs.forEach(item => {
          const d = item.date;
          if (!map[d]) {
            map[d] = {
              date: d,
              caloriesConsumedKcal: 0,
              caloriesBurnedTotalKcal: 0,
              netCaloriesKcal: 0,
              waterMl: 0,
              steps: 0,
              proteinG: 0,
              sugarG: 0,
              sodiumMg: 0,
              hrvMs: 0,
              symptomScore: 0,
              symptomCount: 0,
              maxSeverity: 0,
              hasLateNightMeal: false,
              hasRushedMeal: false,
              workoutFocus: null
            };
          }

          if (item.type === 'meal') {
            map[d].caloriesConsumedKcal += (item.caloriesKcal || 0);
            map[d].waterMl += (item.waterMl || 0);
            map[d].proteinG += (item.proteinG || 0);
            map[d].sugarG += (item.sugarG || 0);
            map[d].sodiumMg += (item.sodiumMg || 0);
            if (item.isLateNight) map[d].hasLateNightMeal = true;
            if (item.eatingPace === 'rushed') map[d].hasRushedMeal = true;
          } else if (item.type === 'exercise') {
            map[d].steps += (item.steps || 0);
            map[d].caloriesBurnedTotalKcal += (item.caloriesBurnedKcal || 300);
            map[d].workoutFocus = item.workoutFocus;
          } else if (item.type === 'lifestyle') {
            map[d].waterMl = Math.max(map[d].waterMl, item.waterTotalMl || 0);
            map[d].steps = Math.max(map[d].steps, item.steps || 0);
            map[d].caloriesBurnedTotalKcal = Math.max(map[d].caloriesBurnedTotalKcal, item.caloriesBurnedTotalKcal || 450);
            map[d].hrvMs = item.hrvMs || 58;
          } else if (item.type === 'symptom') {
            map[d].symptomScore += (item.severity || 1);
            map[d].symptomCount += 1;
            map[d].maxSeverity = Math.max(map[d].maxSeverity, item.severity || 1);
          }
        });

        Object.values(map).forEach(d => {
          d.netCaloriesKcal = d.caloriesConsumedKcal - d.caloriesBurnedTotalKcal;
        });

        return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
      }, [logs]);

      // Filtered Timeline
      const filteredLogs = useMemo(() => {
        if (timelineFilter === 'all') return logs;
        return logs.filter(l => l.type === timelineFilter);
      }, [logs, timelineFilter]);

      // Today Header Pill Values
      const todayAggregate = useMemo(() => {
        return dailyTimeSeries[dailyTimeSeries.length - 1] || {
          waterMl: 0, steps: 0, hrvMs: 58, netCaloriesKcal: 0, caloriesConsumedKcal: 0, caloriesBurnedTotalKcal: 0
        };
      }, [dailyTimeSeries]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-28 max-w-md mx-auto relative shadow-2xl selection:bg-indigo-500 selection:text-white border-x border-slate-900 flex flex-col">
          
          {/* In-App Toast */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-4 py-2 rounded-full shadow-lg text-xs font-semibold flex items-center space-x-2 animate-bounce">
              <Icon name="Sparkles" className="w-3.5 h-3.5 text-indigo-200" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Sticky Header */}
          <header className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md px-4 pt-safe pb-3 border-b border-slate-900/90">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/25">
                  <Icon name="Activity" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
                    PulseHealth
                  </h1>
                  <p className="text-[11px] text-slate-400 font-medium">Symptom & Trigger Correlation</p>
                </div>
              </div>

              <button
                onClick={() => {
                  setTempSteps(targetSteps);
                  setTempWaterL((targetWaterMl / 1000).toFixed(1));
                  setTempWeightKg(userWeightKg);
                  setShowSettingsModal(true);
                }}
                className="p-2 rounded-2xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition active:scale-95"
                title="Settings & Targets"
              >
                <Icon name="Settings" className="w-4 h-4" />
              </button>
            </div>

            {/* Top Dashboard Vitals Pill */}
            <div className="mt-3 grid grid-cols-4 gap-1.5 bg-slate-900/90 p-2 rounded-2xl border border-slate-800 text-[10px]">
              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Droplets" className="w-3 h-3 text-cyan-400 mr-0.5" /> Water
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {((todayAggregate.waterMl || 0) / 1000).toFixed(1)}L
                </span>
              </div>

              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Activity" className="w-3 h-3 text-emerald-400 mr-0.5" /> Steps
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {(todayAggregate.steps || 0).toLocaleString()}
                </span>
              </div>

              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Heart" className="w-3 h-3 text-rose-400 mr-0.5" /> HRV
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {todayAggregate.hrvMs || 58}ms
                </span>
              </div>

              <div className="flex flex-col items-center justify-center" title={`Consumed: ${todayAggregate.caloriesConsumedKcal} kcal | Burned: -${todayAggregate.caloriesBurnedTotalKcal} kcal`}>
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Flame" className="w-3 h-3 text-amber-400 mr-0.5" /> Net Cal
                </span>
                <span className={`font-mono font-bold mt-0.5 ${todayAggregate.netCaloriesKcal >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                  {todayAggregate.netCaloriesKcal > 0 ? `+${todayAggregate.netCaloriesKcal}` : todayAggregate.netCaloriesKcal}
                </span>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="p-4 space-y-4 flex-1">
            
            {/* VIEW 1: CAPTURE */}
            {activeTab === 'add' && (
              <div className="space-y-4">
                {/* Mode Selector */}
                <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[11px]">
                  {[
                    { id: 'meal', label: 'Meal', icon: 'Utensils', color: 'text-indigo-400', activeBg: 'bg-indigo-600' },
                    { id: 'symptom', label: 'Flare', icon: 'AlertCircle', color: 'text-rose-400', activeBg: 'bg-rose-600' },
                    { id: 'stool', label: 'Bowel', icon: 'FileText', color: 'text-amber-400', activeBg: 'bg-amber-600' },
                    { id: 'exercise', label: 'Workout', icon: 'Flame', color: 'text-emerald-400', activeBg: 'bg-emerald-600' },
                    { id: 'lifestyle', label: 'Habits', icon: 'Moon', color: 'text-violet-400', activeBg: 'bg-violet-600' },
                    { id: 'medication', label: 'Meds & Sups', icon: 'ShieldCheck', color: 'text-teal-400', activeBg: 'bg-teal-600' }
                  ].map(m => {
                    const isActive = addMode === m.id;
                    return (
                      <button
                        key={m.id}
                        onClick={() => setAddMode(m.id)}
                        className={`flex flex-col items-center py-2 px-1 rounded-xl font-semibold transition ${
                          isActive ? `${m.activeBg} text-white shadow-sm` : 'text-slate-400 hover:text-white'
                        }`}
                      >
                        <Icon name={m.icon} className={`w-3.5 h-3.5 mb-1 ${isActive ? 'text-white' : m.color}`} />
                        <span className="text-[10px] truncate">{m.label}</span>
                      </button>
                    );
                  })}
                </div>

                {/* MEAL FORM */}
                {addMode === 'meal' && (
                  <form onSubmit={handleAddMeal} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Utensils" className="w-4 h-4 mr-2 text-indigo-400" />
                        Log Food & Drink
                      </h2>

                      <div className="flex items-center space-x-1.5">
                        <button
                          type="button"
                          onClick={resetMealForm}
                          className="px-2.5 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 hover:text-white text-[11px] font-medium"
                        >
                          Clear
                        </button>
                        <label className="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold hover:bg-emerald-600/30 transition cursor-pointer">
                          <Icon name="Barcode" className="w-3.5 h-3.5" />
                          <span>{isScanningBarcode ? 'Scanning...' : 'Barcode'}</span>
                          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleBarcodeUpload} />
                        </label>
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">
                          Meal Description
                        </label>
                        <button
                          type="button"
                          onClick={handleEstimateMealWithAI}
                          disabled={isEstimatingMealAI || !mealTitle.trim()}
                          className="text-xs px-2.5 py-1 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-200 hover:text-white font-semibold transition disabled:opacity-40 flex items-center space-x-1"
                        >
                          <Icon name="Sparkles" className="w-3.5 h-3.5 text-indigo-300" />
                          <span>{isEstimatingMealAI ? 'Estimating...' : 'Estimate with AI'}</span>
                        </button>
                      </div>
                      <input
                        type="text"
                        value={mealTitle}
                        onChange={(e) => setMealTitle(e.target.value)}
                        placeholder="e.g. Avocado on sourdough & poached eggs"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500"
                        required
                      />
                    </div>

                    {/* Calories Slider */}
                    <div className="bg-slate-950/90 p-3 rounded-2xl border border-amber-500/30">
                      <div className="flex justify-between items-center text-xs font-semibold text-slate-200 mb-1">
                        <span className="flex items-center text-amber-400">
                          <Icon name="Flame" className="w-3.5 h-3.5 mr-1" /> Energy Intake
                        </span>
                        <span className="font-mono text-amber-400 font-bold text-sm">
                          {mealCalories} kcal <span className="text-[10px] text-amber-300/80">({Math.round(mealCalories * 4.184)} kJ)</span>
                        </span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="2000"
                        step="25"
                        value={mealCalories}
                        onChange={(e) => setMealCalories(Number(e.target.value))}
                        className="w-full accent-amber-500 cursor-pointer"
                      />
                    </div>

                    {/* Macros Grid */}
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800">
                        <div className="flex justify-between text-slate-300 mb-1">
                          <span>Protein</span>
                          <span className="font-mono text-indigo-400 font-bold">{mealProtein}g</span>
                        </div>
                        <input type="range" min="0" max="100" step="5" value={mealProtein} onChange={(e) => setMealProtein(Number(e.target.value))} className="w-full accent-indigo-500" />
                      </div>
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800">
                        <div className="flex justify-between text-slate-300 mb-1">
                          <span>Carbs</span>
                          <span className="font-mono text-amber-400 font-bold">{mealCarbs}g</span>
                        </div>
                        <input type="range" min="0" max="150" step="5" value={mealCarbs} onChange={(e) => setMealCarbs(Number(e.target.value))} className="w-full accent-amber-500" />
                      </div>
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800">
                        <div className="flex justify-between text-slate-300 mb-1">
                          <span>Sugar</span>
                          <span className="font-mono text-pink-400 font-bold">{mealSugar}g</span>
                        </div>
                        <input type="range" min="0" max="80" step="2" value={mealSugar} onChange={(e) => setMealSugar(Number(e.target.value))} className="w-full accent-pink-500" />
                      </div>
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800">
                        <div className="flex justify-between text-slate-300 mb-1">
                          <span>Sodium</span>
                          <span className="font-mono text-purple-400 font-bold">{mealSodium}mg</span>
                        </div>
                        <input type="range" min="0" max="3000" step="50" value={mealSodium} onChange={(e) => setMealSodium(Number(e.target.value))} className="w-full accent-purple-500" />
                      </div>
                    </div>

                    {/* Late Night Switch */}
                    <div className="flex items-center justify-between bg-slate-950 p-3 rounded-2xl border border-slate-800">
                      <div>
                        <span className="text-xs font-bold text-slate-200 block">Late-Night Meal?</span>
                        <span className="text-[10px] text-slate-400">Consumed within 2 hours of sleep</span>
                      </div>
                      <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                        <button type="button" onClick={() => setIsLateNight(false)} className={`px-3 py-1 rounded-lg font-bold ${!isLateNight ? 'bg-slate-800 text-white' : 'text-slate-500'}`}>No</button>
                        <button type="button" onClick={() => setIsLateNight(true)} className={`px-3 py-1 rounded-lg font-bold ${isLateNight ? 'bg-amber-500 text-slate-950' : 'text-slate-500'}`}>🌙 Yes</button>
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition">
                      Log Meal & Track Intake
                    </button>
                  </form>
                )}

                {/* FLARE / SYMPTOM FORM */}
                {addMode === 'symptom' && (
                  <form onSubmit={handleAddSymptom} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="AlertCircle" className="w-4 h-4 mr-2 text-rose-400" />
                      Record Flare or Discomfort
                    </h2>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Symptom Type
                      </label>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'headache', label: 'Headache / Migraine' },
                          { id: 'bloating', label: 'Bloating & Distension' },
                          { id: 'sore_stomach', label: 'Sore Stomach / Cramps' },
                          { id: 'brain_fog', label: 'Brain Fog / Slump' },
                          { id: 'acid_reflux', label: 'Acid Reflux / Heartburn' },
                          { id: 'palpitations', label: 'Palpitations / Rapid HR' },
                          { id: 'skin_flare', label: 'Skin Flare / Itch / Hives' },
                          { id: 'joint_pain', label: 'Joint / Neck Pain' },
                          { id: 'postprandial_fatigue', label: 'Food Coma / Fatigue' },
                          { id: 'nausea', label: 'Nausea / Queasiness' }
                        ].map(item => (
                          <button
                            type="button"
                            key={item.id}
                            onClick={() => {
                              setSymptomCategory(item.id);
                              if (!symptomTitle) setSymptomTitle(item.label);
                            }}
                            className={`text-xs p-2.5 rounded-2xl text-left font-medium transition ${
                              symptomCategory === item.id 
                                ? 'bg-rose-600/20 border border-rose-500 text-rose-300 font-bold' 
                                : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {item.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Specific Description
                      </label>
                      <input
                        type="text"
                        value={symptomTitle}
                        onChange={(e) => setSymptomTitle(e.target.value)}
                        placeholder="e.g. Throbbing temple, distended abdomen"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500"
                        required
                      />
                    </div>

                    {/* Severity Rating */}
                    <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80">
                      <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1.5">
                        <span>Severity Rating</span>
                        <span className="font-mono text-rose-400 font-bold">{symptomSeverity} / 5</span>
                      </div>
                      <div className="flex justify-between gap-1.5">
                        {[1, 2, 3, 4, 5].map(lvl => (
                          <button
                            type="button"
                            key={lvl}
                            onClick={() => setSymptomSeverity(lvl)}
                            className={`flex-1 py-2 rounded-xl font-bold text-xs transition ${
                              symptomSeverity === lvl 
                                ? 'bg-rose-600 text-white shadow-sm shadow-rose-600/40' 
                                : 'bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {lvl}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Notes & Trigger Suspicions
                      </label>
                      <textarea
                        value={symptomNotes}
                        onChange={(e) => setSymptomNotes(e.target.value)}
                        placeholder="What did you feel? Did this follow a specific meal, workout or stress?"
                        rows={2}
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm shadow-lg shadow-rose-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="AlertCircle" className="w-4 h-4" />
                      <span>Record Flare</span>
                    </button>
                  </form>
                )}

                {/* BOWEL / BRISTOL STOOL FORM */}
                {addMode === 'stool' && (
                  <form onSubmit={handleAddStool} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="FileText" className="w-4 h-4 mr-2 text-amber-400" />
                      Bristol Stool Chart Log
                    </h2>

                    <div className="space-y-1.5">
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">
                        Select Consistency (Types 1 - 7)
                      </label>

                      <div className="grid grid-cols-1 gap-1.5 text-xs">
                        {[
                          { type: 1, label: 'Type 1: Hard lumps / pellets (Severe Constipation)', color: 'text-rose-400' },
                          { type: 2, label: 'Type 2: Lumpy sausage (Mild Constipation)', color: 'text-amber-400' },
                          { type: 3, label: 'Type 3: Sausage with cracks (Normal)', color: 'text-emerald-400' },
                          { type: 4, label: 'Type 4: Smooth, soft snake (Optimal / Ideal)', color: 'text-emerald-400 font-bold' },
                          { type: 5, label: 'Type 5: Soft blobs with clear edges (Low Fiber)', color: 'text-amber-400' },
                          { type: 6, label: 'Type 6: Fluffy pieces, ragged edges (Mild Diarrhea)', color: 'text-rose-400' },
                          { type: 7, label: 'Type 7: Entirely liquid (Severe Diarrhea / Rapid Transit)', color: 'text-rose-400' },
                        ].map(item => (
                          <button
                            type="button"
                            key={item.type}
                            onClick={() => setBristolType(item.type)}
                            className={`p-2.5 rounded-2xl text-left transition border ${
                              bristolType === item.type 
                                ? 'bg-amber-600/20 border-amber-500 text-amber-200 font-semibold' 
                                : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                            }`}
                          >
                            <span className={`block font-medium ${item.color}`}>{item.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Transit Notes (Optional)
                      </label>
                      <input
                        type="text"
                        value={stoolNotes}
                        onChange={(e) => setStoolNotes(e.target.value)}
                        placeholder="e.g. Urgency, cramping prior to movement"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-amber-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm shadow-lg shadow-amber-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Save Stool Entry</span>
                    </button>
                  </form>
                )}

                {/* WORKOUT / EXERCISE FORM */}
                {addMode === 'exercise' && (
                  <form onSubmit={handleAddExercise} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Flame" className="w-4 h-4 mr-2 text-emerald-400" />
                        Log Workout Session
                      </h2>

                      <span className="text-[10px] text-slate-400 font-mono">
                        Weight: <strong className="text-slate-200">{userWeightKg}kg</strong>
                      </span>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Modality & Focus
                      </label>
                      <div className="grid grid-cols-2 gap-1.5">
                        {[
                          { id: 'lifting_upper', label: '🏋️ Lifting (Upper / Press)' },
                          { id: 'lifting_lower', label: '🦵 Lifting (Lower / Legs)' },
                          { id: 'cardio_hiit', label: '🏃 Running / Cycling / HIIT' },
                          { id: 'mobility_walk', label: '🧘 Walk / Mobility / Yoga' }
                        ].map(item => (
                          <button
                            type="button"
                            key={item.id}
                            onClick={() => setWorkoutFocus(item.id)}
                            className={`text-xs p-2.5 rounded-2xl text-left font-medium transition ${
                              workoutFocus === item.id 
                                ? 'bg-emerald-600/20 border border-emerald-500 text-emerald-300 font-bold' 
                                : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                            }`}
                          >
                            {item.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Workout Title / Notes
                      </label>
                      <input
                        type="text"
                        value={exerciseTitle}
                        onChange={(e) => setExerciseTitle(e.target.value)}
                        placeholder="e.g. Bench press, shoulder press, triceps"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Duration</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutDuration} min</span>
                        </div>
                        <input
                          type="range"
                          min="10"
                          max="120"
                          step="5"
                          value={workoutDuration}
                          onChange={(e) => setWorkoutDuration(Number(e.target.value))}
                          className="w-full accent-emerald-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Intensity (RPE)</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutIntensity} / 10</span>
                        </div>
                        <input
                          type="range"
                          min="1"
                          max="10"
                          step="1"
                          value={workoutIntensity}
                          onChange={(e) => setWorkoutIntensity(Number(e.target.value))}
                          className="w-full accent-emerald-500 cursor-pointer"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Steps in Session</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutSteps.toLocaleString()}</span>
                        </div>
                        <input
                          type="range"
                          min="500"
                          max="15000"
                          step="500"
                          value={workoutSteps}
                          onChange={(e) => setWorkoutSteps(Number(e.target.value))}
                          className="w-full accent-emerald-500 cursor-pointer"
                        />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span className="text-rose-400 flex items-center">
                            <Icon name="Flame" className="w-3 h-3 mr-0.5" /> Burned
                          </span>
                          <span className="font-mono text-rose-400 font-bold">
                            -{workoutCaloriesBurned} kcal
                          </span>
                        </div>
                        <input
                          type="range"
                          min="50"
                          max="1500"
                          step="25"
                          value={workoutCaloriesBurned}
                          onChange={(e) => setWorkoutCaloriesBurned(Number(e.target.value))}
                          className="w-full accent-rose-500 cursor-pointer"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Log Workout (-{workoutCaloriesBurned} kcal / -{Math.round(workoutCaloriesBurned * 4.184)} kJ)</span>
                    </button>
                  </form>
                )}

                {/* HABITS FORM */}
                {addMode === 'lifestyle' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Moon" className="w-4 h-4 mr-2 text-indigo-400" />
                        Daily Habits & Vitals
                      </h2>
                      <button onClick={handleSaveAllHabits} className="px-2.5 py-1 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 text-indigo-200 hover:text-white text-xs font-bold transition">
                        Submit All
                      </button>
                    </div>

                    {/* 7 Habits Items */}
                    <div className="space-y-3">
                      {/* Sleep */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>1. Sleep Duration</span>
                          <span className="font-mono text-indigo-400">{lifestyleSleep} hrs</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="4" max="12" step="0.5" value={lifestyleSleep} onChange={(e) => setLifestyleSleep(Number(e.target.value))} className="flex-1 accent-indigo-500" />
                          <button type="button" onClick={() => handleSaveSingleHabit('sleepHours', Number(lifestyleSleep), 'Sleep')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isSleepLogged ? 'bg-slate-900 text-slate-500' : 'bg-indigo-600 text-white'}`}>
                            {isSleepLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Stress */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>2. Subjective Stress (1-5)</span>
                          <span className="font-mono text-amber-400">{lifestyleStress} / 5</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="1" max="5" step="1" value={lifestyleStress} onChange={(e) => setLifestyleStress(Number(e.target.value))} className="flex-1 accent-amber-500" />
                          <button type="button" onClick={() => handleSaveSingleHabit('stressLevel', Number(lifestyleStress), 'Stress')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isStressLogged ? 'bg-slate-900 text-slate-500' : 'bg-amber-600 text-white'}`}>
                            {isStressLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* HRV */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>3. Overnight HRV</span>
                          <span className="font-mono text-pink-400">{lifestyleHrv} ms</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="20" max="100" step="1" value={lifestyleHrv} onChange={(e) => setLifestyleHrv(Number(e.target.value))} className="flex-1 accent-pink-500" />
                          <button type="button" onClick={() => handleSaveSingleHabit('hrvMs', Number(lifestyleHrv), 'HRV')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isHrvLogged ? 'bg-slate-900 text-slate-500' : 'bg-pink-600 text-white'}`}>
                            {isHrvLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Resting HR */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>4. Resting Heart Rate</span>
                          <span className="font-mono text-rose-400">{lifestyleRestingHr} bpm</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="45" max="95" step="1" value={lifestyleRestingHr} onChange={(e) => setLifestyleRestingHr(Number(e.target.value))} className="flex-1 accent-rose-500" />
                          <button type="button" onClick={() => handleSaveSingleHabit('restingHr', Number(lifestyleRestingHr), 'Resting HR')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isRestingHrLogged ? 'bg-slate-900 text-slate-500' : 'bg-rose-600 text-white'}`}>
                            {isRestingHrLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Water */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>5. Daily Water Total</span>
                          <span className="font-mono text-cyan-400">{(lifestyleWater / 1000).toFixed(1)} Litres</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="500" max="5000" step="100" value={lifestyleWater} onChange={(e) => setLifestyleWater(Number(e.target.value))} className="flex-1 accent-cyan-400" />
                          <button type="button" onClick={() => handleSaveSingleHabit('waterTotalMl', Number(lifestyleWater), 'Water')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isWaterLogged ? 'bg-slate-900 text-slate-500' : 'bg-cyan-600 text-white'}`}>
                            {isWaterLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Active Burn */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>6. Active Energy Burn</span>
                          <span className="font-mono text-rose-400">-{lifestyleCaloriesBurned} kcal</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="100" max="1600" step="50" value={lifestyleCaloriesBurned} onChange={(e) => setLifestyleCaloriesBurned(Number(e.target.value))} className="flex-1 accent-rose-500" />
                          <button type="button" onClick={() => handleSaveSingleHabit('caloriesBurnedTotalKcal', Number(lifestyleCaloriesBurned), 'Active burn')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isBurnLogged ? 'bg-slate-900 text-slate-500' : 'bg-rose-600 text-white'}`}>
                            {isBurnLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>

                      {/* Steps */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex flex-col space-y-1.5">
                        <div className="flex justify-between text-xs font-bold text-slate-200">
                          <span>7. Daily Step Motility</span>
                          <span className="font-mono text-emerald-400">{lifestyleSteps.toLocaleString()}</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input type="range" min="1000" max="22000" step="500" value={lifestyleSteps} onChange={(e) => setLifestyleSteps(Number(e.target.value))} className="flex-1 accent-emerald-500" />
                          <button type="button" onClick={() => handleSaveSingleHabit('steps', Number(lifestyleSteps), 'Steps')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${isStepsLogged ? 'bg-slate-900 text-slate-500' : 'bg-emerald-600 text-white'}`}>
                            {isStepsLogged ? '✓ Logged' : 'Submit'}
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* MEDS & SUPS FORM */}
                {addMode === 'medication' && (
                  <form onSubmit={handleAddMedication} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="ShieldCheck" className="w-4 h-4 mr-2 text-teal-400" />
                      Log Meds & Supplements
                    </h2>

                    <div className="space-y-1.5">
                      <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">1-Tap Quick Stacks</span>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { name: 'Magnesium', dose: '350mg', reason: 'Sleep & bowel motility' },
                          { name: 'Pre-Workout', dose: '1 scoop', reason: 'Caffeine / training' },
                          { name: 'Multivitamin / Zinc', dose: '1 tab', reason: 'Daily micronutrients' },
                          { name: 'Electrolytes', dose: '1 sachet', reason: 'Hydration & sodium' },
                          { name: 'Creatine', dose: '5g', reason: 'Strength & hydration' },
                          { name: 'Paracetamol', dose: '1000mg', reason: 'Pain / headache' }
                        ].map((m, i) => (
                          <button
                            key={i}
                            type="button"
                            onClick={() => { setMedName(m.name); setMedDose(m.dose); setMedReason(m.reason); }}
                            className="text-xs px-2.5 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white"
                          >
                            {m.name}
                          </button>
                        ))}
                      </div>
                    </div>

                    <input type="text" value={medName} onChange={(e) => setMedName(e.target.value)} placeholder="Name (e.g. Magnesium Glycinate)" className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100" required />
                    
                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-500 text-white font-bold text-sm shadow-lg shadow-teal-600/30">
                      Save Entry
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* VIEW 2: TIMELINE */}
            {activeTab === 'timeline' && (
              <div className="space-y-4 animate-in fade-in duration-150">
                <div className="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                  {[
                    { id: 'all', label: 'All Events' },
                    { id: 'meal', label: 'Meals' },
                    { id: 'symptom', label: 'Flares' },
                    { id: 'exercise', label: 'Workouts' },
                    { id: 'stool', label: 'Bowel' },
                    { id: 'medication', label: 'Meds & Sups' },
                    { id: 'lifestyle', label: 'Habits' }
                  ].map(f => {
                    const count = f.id === 'all' ? logs.length : logs.filter(l => l.type === f.id).length;
                    const isActive = timelineFilter === f.id;
                    return (
                      <button
                        key={f.id}
                        onClick={() => setTimelineFilter(f.id)}
                        className={`px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition flex items-center space-x-1.5 ${
                          isActive 
                            ? 'bg-indigo-600 text-white shadow-sm' 
                            : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-slate-200'
                        }`}
                      >
                        <span>{f.label}</span>
                        <span className="text-[10px] px-1 rounded-md bg-black/20 font-mono">{count}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="space-y-2.5">
                  {filteredLogs.length === 0 ? (
                    <div className="text-center py-12 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">
                      <Icon name="Filter" className="w-8 h-8 text-slate-600 mx-auto mb-2" />
                      <p className="text-sm font-semibold text-slate-300">No events found</p>
                      <p className="text-xs text-slate-500 mt-1">There are no logged events matching this filter category.</p>
                      <button
                        onClick={() => setTimelineFilter('all')}
                        className="mt-3 text-xs text-indigo-400 font-semibold underline"
                      >
                        Reset Filter
                      </button>
                    </div>
                  ) : (
                    filteredLogs.map(item => {
                      let badgeColor = 'bg-slate-800 text-slate-300';
                      let iconName = 'Utensils';

                      if (item.type === 'meal') {
                        badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
                        iconName = 'Utensils';
                      } else if (item.type === 'symptom') {
                        badgeColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
                        iconName = 'AlertCircle';
                      } else if (item.type === 'exercise') {
                        badgeColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                        iconName = 'Flame';
                      } else if (item.type === 'stool') {
                        badgeColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
                        iconName = 'FileText';
                      } else if (item.type === 'medication') {
                        badgeColor = 'bg-teal-500/20 text-teal-300 border border-teal-500/30';
                        iconName = 'ShieldCheck';
                      } else if (item.type === 'lifestyle') {
                        badgeColor = 'bg-violet-500/20 text-violet-300 border border-violet-500/30';
                        iconName = 'Moon';
                      }

                      return (
                        <div
                          key={item.id}
                          className="group bg-slate-900/70 p-3.5 rounded-2xl border border-slate-800/80 flex flex-col space-y-2.5 transition hover:border-slate-700/80"
                        >
                          <div className="flex items-start justify-between space-x-3">
                            <div className="flex items-start space-x-3 flex-1 min-w-0">
                              <div className={`p-2 rounded-xl shrink-0 ${badgeColor}`}>
                                <Icon name={iconName} className="w-4 h-4" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center space-x-2">
                                  <span className="text-xs font-bold text-white truncate">
                                    {item.title || item.name || 'Habits Check-in'}
                                  </span>
                                  {item.caloriesKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40" title={`${Math.round(item.caloriesKcal * 4.184)} kJ`}>
                                      +{item.caloriesKcal} kcal ({Math.round(item.caloriesKcal * 4.184)} kJ)
                                    </span>
                                  )}
                                  {item.caloriesBurnedKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40" title={`${Math.round(item.caloriesBurnedKcal * 4.184)} kJ`}>
                                      -{item.caloriesBurnedKcal} kcal ({Math.round(item.caloriesBurnedKcal * 4.184)} kJ)
                                    </span>
                                  )}
                                  {item.severity && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      Sev {item.severity}/5
                                    </span>
                                  )}
                                  {item.bristolType && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40">
                                      Bristol Type {item.bristolType}
                                    </span>
                                  )}
                                </div>

                                <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1 text-[11px] text-slate-400">
                                  {item.type === 'meal' && (
                                    <>
                                      <span>{item.proteinG || 0}g protein</span>
                                      <span>•</span>
                                      <span>{item.sugarG || 0}g sugar</span>
                                      <span>•</span>
                                      <span>{item.sodiumMg || 0}mg sodium</span>
                                      <span>•</span>
                                      <span>{item.waterMl || 0}ml fluid</span>
                                      {item.isLateNight && <span className="text-amber-400 font-semibold">🌙 Late Night</span>}
                                    </>
                                  )}
                                  {item.type === 'exercise' && (
                                    <>
                                      <span>{item.durationMins} mins</span>
                                      <span>•</span>
                                      <span>RPE {item.intensity}/10</span>
                                      <span>•</span>
                                      <span>{item.steps?.toLocaleString()} steps</span>
                                      <span>•</span>
                                      <span className="text-rose-400 font-medium">-{item.caloriesBurnedKcal || 300} kcal</span>
                                    </>
                                  )}
                                  {item.type === 'lifestyle' && (
                                    <>
                                      {item.sleepHours !== undefined && <span>{item.sleepHours}h sleep</span>}
                                      {item.hrvMs !== undefined && <span>• {item.hrvMs}ms HRV</span>}
                                      {item.waterTotalMl !== undefined && <span>• {((item.waterTotalMl || 0)/1000).toFixed(1)}L water</span>}
                                      {item.caloriesBurnedTotalKcal !== undefined && <span className="text-rose-400 font-medium">• -{item.caloriesBurnedTotalKcal} kcal burn</span>}
                                    </>
                                  )}
                                  {item.type === 'medication' && (
                                    <>
                                      <span>{item.dose}</span>
                                      <span>•</span>
                                      <span>For {item.reason}</span>
                                    </>
                                  )}
                                  {item.notes && (
                                    <p className="w-full text-slate-300 text-[11px] italic mt-0.5">"{item.notes}"</p>
                                  )}
                                </div>

                                {item.tags && item.tags.length > 0 && (
                                  <div className="flex flex-wrap gap-1 mt-1.5">
                                    {item.tags.map(t => (
                                      <span key={t} className="text-[9px] font-mono font-medium px-1.5 py-0.5 rounded bg-slate-950 text-indigo-300 border border-slate-800">
                                        #{t}
                                      </span>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="text-[10px] text-slate-400 block font-mono">{item.timestamp}</span>
