                          className={`p-2.5 rounded-2xl text-left transition border ${
                            bristolType === item.type
                              ? 'bg-amber-600/20 border-amber-500 text-amber-200 font-semibold'
                              : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          <span className={`block font-medium ${item.color}`}>{item.label}</span>
                        </button>
                      ))}
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Transit Notes (Optional)
                      </label>
                      <input
                        type="text"
                        value={stoolNotes}
                        onChange={(e) => setStoolNotes(e.target.value)}
                        placeholder="e.g. Urgency, cramping prior to movement"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-amber-500"
                      />
                    </div>

                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-amber-600/30 transition flex items-center justify-center space-x-1.5">
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Save Stool Entry</span>
                    </button>
                  </form>
                )}

                {/* WORKOUT / EXERCISE FORM */}
                {addMode === 'exercise' && (
                  <form onSubmit={handleAddExercise} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Flame" className="w-4 h-4 mr-2 text-emerald-400" />
                        Log Workout Session
                      </h2>

                      <button
                        type="button"
                        onClick={handleEstimateWorkoutWithAI}
                        disabled={isEstimatingWorkoutAI}
                        className="flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold hover:bg-emerald-600/30 transition disabled:opacity-50"
                      >
                        <Icon name="Sparkles" className={`w-3.5 h-3.5 ${isEstimatingWorkoutAI ? 'animate-spin' : ''}`} />
                        <span>{isEstimatingWorkoutAI ? 'Calculating...' : 'Estimate Burn'}</span>
                      </button>
                    </div>

                    <div className="flex items-center justify-between px-3 py-1.5 rounded-xl bg-slate-950/80 border border-slate-800 text-[10px] text-slate-400">
                      <span>Metabolism profile: <strong className="text-slate-200">{userWeightKg} kg</strong></span>
                      <button
                        type="button"
                        onClick={() => {
                          setTempSteps(targetSteps);
                          setTempWaterL((targetWaterMl / 1000).toFixed(1));
                          setTempWeightKg(userWeightKg);
                          setShowGoalsModal(true);
                        }}
                        className="text-emerald-400 hover:underline font-semibold"
                      >
                        Change Weight
                      </button>
                    </div>

                    <div className="grid grid-cols-2 gap-1.5">
                      {[
                        { id: 'lifting_upper', label: '🏋️ Lifting (Upper / Push)' },
                        { id: 'lifting_lower', label: '🦵 Lifting (Lower / Legs)' },
                        { id: 'cardio_hiit', label: '🏃 Running / Cycling / HIIT' },
                        { id: 'mobility_walk', label: '🧘 Walk / Mobility / Yoga' }
                      ].map(item => (
                        <button
                          type="button"
                          key={item.id}
                          onClick={() => setWorkoutFocus(item.id)}
                          className={`text-xs p-2.5 rounded-2xl text-left font-medium transition ${
                            workoutFocus === item.id
                              ? 'bg-emerald-600/20 border border-emerald-500 text-emerald-300 font-bold'
                              : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Workout Title / Notes
                      </label>
                      <input
                        type="text"
                        value={exerciseTitle}
                        onChange={(e) => setExerciseTitle(e.target.value)}
                        placeholder="e.g. Bench press, shoulder press, 5km run"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-emerald-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Duration</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutDuration} min</span>
                        </div>
                        <input type="range" min="10" max="120" step="5" value={workoutDuration} onChange={(e) => setWorkoutDuration(Number(e.target.value))} className="w-full accent-emerald-500 cursor-pointer" />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Intensity (RPE)</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutIntensity} / 10</span>
                        </div>
                        <input type="range" min="1" max="10" step="1" value={workoutIntensity} onChange={(e) => setWorkoutIntensity(Number(e.target.value))} className="w-full accent-emerald-500 cursor-pointer" />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Steps in Session</span>
                          <span className="font-mono text-emerald-400 font-bold">{workoutSteps.toLocaleString()}</span>
                        </div>
                        <input type="range" min="0" max="15000" step="250" value={workoutSteps} onChange={(e) => setWorkoutSteps(Number(e.target.value))} className="w-full accent-emerald-500 cursor-pointer" />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span className="text-rose-400">Active Burn</span>
                          <span className="font-mono text-rose-400 font-bold">-{workoutCaloriesBurned} kcal</span>
                        </div>
                        <input type="range" min="50" max="1500" step="25" value={workoutCaloriesBurned} onChange={(e) => setWorkoutCaloriesBurned(Number(e.target.value))} className="w-full accent-rose-500 cursor-pointer" />
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center space-x-1.5">
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Log Workout (-{workoutCaloriesBurned} kcal)</span>
                    </button>
                  </form>
                )}

                {/* HABITS FORM: 7 ITEMS LISTED DOWN THE PAGE */}
                {addMode === 'lifestyle' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="space-y-2 pb-3 border-b border-slate-800/80">
                      <div className="flex items-center justify-between">
                        <h2 className="text-sm font-bold text-white flex items-center">
                          <Icon name="Moon" className="w-4 h-4 mr-2 text-indigo-400" />
                          Daily Habits & Vitals
                        </h2>
                        <button
                          type="button"
                          onClick={handleTriggerAppleHealthShortcut}
                          className="px-2.5 py-1 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/40 text-rose-300 text-[10px] font-bold transition flex items-center space-x-1 active:scale-95"
                          title="Run your Apple Health iOS Shortcut to pull live steps"
                        >
                          <Icon name="Heart" className="w-3 h-3 text-rose-400" />
                          <span>Sync Apple Health</span>
                        </button>
                      </div>
                      {lastHealthSync && (
                        <div className="flex items-center justify-between text-[10px] text-emerald-400/90 bg-emerald-950/30 border border-emerald-800/40 px-2.5 py-1 rounded-xl">
                          <span>Last Apple Health sync: <strong>{lastHealthSync}</strong></span>
                          <button type="button" onClick={() => setShowSettingsModal(true)} className="underline text-emerald-300">Setup</button>
                        </div>
                      )}

                      {/* Date Selector with Calendar Pop-up */}
                      <div className="bg-slate-950 p-2.5 rounded-2xl border border-slate-800 flex items-center justify-between gap-2">
                        <div className="flex items-center space-x-2">
                          <Icon name="Calendar" className="w-4 h-4 text-indigo-400 shrink-0" />
                          <div className="flex flex-col">
                            <span className="text-[9.5px] uppercase font-bold tracking-wider text-slate-400">Logging For</span>
                            <span className="text-xs font-bold text-slate-200">{formatDateLabel(lifestyleDate)}</span>
                          </div>
                        </div>

                        <div className="flex items-center space-x-1.5">
                          <button
                            type="button"
                            onClick={() => setLifestyleDate(todayStr)}
                            className={`text-[10px] px-2 py-1 rounded-lg font-semibold transition ${
                              lifestyleDate === todayStr ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'
                            }`}
                          >
                            Today
                          </button>

                          <button
                            type="button"
                            onClick={() => {
                              const yest = new Date();
                              yest.setDate(yest.getDate() - 1);
                              const yStr = `${yest.getFullYear()}-${String(yest.getMonth() + 1).padStart(2, '0')}-${String(yest.getDate()).padStart(2, '0')}`;
                              setLifestyleDate(yStr);
                            }}
                            className="text-[10px] px-2 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition"
                          >
                            Yesterday
                          </button>

                          <div className="relative overflow-hidden rounded-lg">
                            <div className="flex items-center space-x-1 px-2.5 py-1 bg-slate-900 border border-slate-700 text-indigo-300 text-[10px] font-semibold pointer-events-none">
                              <Icon name="Calendar" className="w-3 h-3 text-indigo-400" />
                              <span>Calendar</span>
                            </div>
                            <input
                              type="date"
                              max={todayStr}
                              value={lifestyleDate}
                              onChange={(e) => { if (e.target.value) setLifestyleDate(e.target.value); }}
                              className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center justify-between">
                        <p className="text-[10px] text-slate-400">
                          Submit items individually or tap <strong className="text-indigo-400">Submit All</strong>.
                        </p>
                        <button
                          type="button"
                          onClick={handleSaveAllHabits}
                          className="px-2.5 py-1 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-200 hover:text-white text-[10px] font-bold transition flex items-center space-x-1"
                        >
                          <Icon name="Check" className="w-3 h-3" />
                          <span>Submit All</span>
                        </button>
                      </div>
                    </div>

                    {/* 7 HABITS DOWN THE PAGE */}
                    <div className="space-y-3">
                      {/* 1. SLEEP */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Moon" className="w-3.5 h-3.5 text-indigo-400" />
                            <span className="text-xs font-bold text-slate-200">1. Sleep Duration</span>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-indigo-400 font-bold text-sm">{lifestyleSleep} hrs</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="4" max="12" step="0.5" value={lifestyleSleep} onChange={(e) => setLifestyleSleep(Number(e.target.value))} className="flex-1 accent-indigo-500 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('sleepHours', Number(lifestyleSleep), 'Sleep')}
                            disabled={isSleepLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isSleepLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isSleepLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isSleepLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isSleepLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.sleepHours === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                      </div>

                      {/* 2. SUBJECTIVE STRESS */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2 relative">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Zap" className="w-3.5 h-3.5 text-amber-400" />
                            <span className="text-xs font-bold text-slate-200">2. Subjective Stress</span>
                            <button type="button" onClick={() => setShowStressGuide(!showStressGuide)} className="text-amber-400">
                              <Icon name="Info" className="w-3.5 h-3.5" />
                            </button>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-amber-400 font-bold text-sm">{lifestyleStress} / 5</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="1" max="5" step="1" value={lifestyleStress} onChange={(e) => setLifestyleStress(Number(e.target.value))} className="flex-1 accent-amber-500 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('stressLevel', Number(lifestyleStress), 'Stress level')}
                            disabled={isStressLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isStressLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-amber-600 hover:bg-amber-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isStressLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isStressLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isStressLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.stressLevel === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                        {showStressGuide && (
                          <div className="p-2.5 bg-slate-900 border border-amber-500/40 rounded-xl text-[11px] text-slate-300">
                            1 = Calm & recovered, 3 = Moderate work/mental load, 5 = High somatic tension or overwhelm.
                          </div>
                        )}
                      </div>

                      {/* 3. OVERNIGHT HRV */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2 relative">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Heart" className="w-3.5 h-3.5 text-pink-400" />
                            <span className="text-xs font-bold text-slate-200">3. Overnight HRV</span>
                            <button type="button" onClick={() => setShowHrvGuide(!showHrvGuide)} className="text-pink-400">
                              <Icon name="Info" className="w-3.5 h-3.5" />
                            </button>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-pink-400 font-bold text-sm">{lifestyleHrv} ms</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="20" max="110" step="1" value={lifestyleHrv} onChange={(e) => setLifestyleHrv(Number(e.target.value))} className="flex-1 accent-pink-500 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('hrvMs', Number(lifestyleHrv), 'Overnight HRV')}
                            disabled={isHrvLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isHrvLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-pink-600 hover:bg-pink-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isHrvLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isHrvLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isHrvLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.hrvMs === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                        {showHrvGuide && (
                          <div className="p-2.5 bg-slate-900 border border-pink-500/40 rounded-xl text-[11px] text-slate-300">
                            Morning sleep average from Apple Watch, Oura, or Garmin. Drops &gt;15% below baseline signal inflammation or late meals.
                          </div>
                        )}
                      </div>

                      {/* 4. RESTING HEART RATE */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2 relative">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Activity" className="w-3.5 h-3.5 text-rose-400" />
                            <span className="text-xs font-bold text-slate-200">4. Resting Heart Rate</span>
                            <button type="button" onClick={() => setShowHrGuide(!showHrGuide)} className="text-rose-400">
                              <Icon name="Info" className="w-3.5 h-3.5" />
                            </button>
                            <span className="text-[9px] text-slate-400 uppercase font-mono px-1.5 rounded bg-slate-900 border border-slate-800">1x / day</span>
                          </div>
                          <span className="font-mono text-rose-400 font-bold text-sm">{lifestyleRestingHr} bpm</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="40" max="100" step="1" value={lifestyleRestingHr} onChange={(e) => setLifestyleRestingHr(Number(e.target.value))} className="flex-1 accent-rose-500 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('restingHr', Number(lifestyleRestingHr), 'Resting HR')}
                            disabled={isRestingHrLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isRestingHrLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-rose-600 hover:bg-rose-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isRestingHrLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isRestingHrLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isRestingHrLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.restingHr === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                        {showHrGuide && (
                          <div className="p-2.5 bg-slate-900 border border-rose-500/40 rounded-xl text-[11px] text-slate-300">
                            Measure upon waking before getting out of bed or having caffeine.
                          </div>
                        )}
                      </div>

                      {/* 5. DAILY WATER INTAKE */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400" />
                            <span className="text-xs font-bold text-slate-200">5. Daily Water Intake</span>
                            <span className="text-[9px] text-cyan-400/90 uppercase font-mono px-1.5 rounded bg-cyan-950/40 border border-cyan-800/60">Auto + Meals</span>
                          </div>
                          <span className="font-mono text-cyan-400 font-bold text-sm">{(lifestyleWater / 1000).toFixed(2)} L</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="0" max="5000" step="50" value={lifestyleWater} onChange={(e) => setLifestyleWater(Number(e.target.value))} className="flex-1 accent-cyan-400 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('waterTotalMl', Number(lifestyleWater), 'Water intake')}
                            disabled={isWaterLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isWaterLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isWaterLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isWaterLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isWaterLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.waterTotalMl === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                      </div>

                      {/* 6. ACTIVE ENERGY BURN */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Flame" className="w-3.5 h-3.5 text-rose-400" />
                            <span className="text-xs font-bold text-slate-200">6. Active Energy Burn</span>
                            <span className="text-[9px] text-rose-400/90 uppercase font-mono px-1.5 rounded bg-rose-950/40 border border-rose-800/60">Auto + Workouts</span>
                          </div>
                          <span className="font-mono text-rose-400 font-bold text-sm">-{lifestyleCaloriesBurned} kcal</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="0" max="2500" step="25" value={lifestyleCaloriesBurned} onChange={(e) => setLifestyleCaloriesBurned(Number(e.target.value))} className="flex-1 accent-rose-500 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('caloriesBurnedTotalKcal', Number(lifestyleCaloriesBurned), 'Active burn')}
                            disabled={isBurnLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isBurnLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-rose-600 hover:bg-rose-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isBurnLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isBurnLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isBurnLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.caloriesBurnedTotalKcal === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                      </div>

                      {/* 7. DAILY TOTAL STEPS */}
                      <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80 flex flex-col space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-1.5">
                            <Icon name="Activity" className="w-3.5 h-3.5 text-emerald-400" />
                            <span className="text-xs font-bold text-slate-200">7. Daily Total Steps</span>
                            <span className="text-[9px] text-emerald-400/90 uppercase font-mono px-1.5 rounded bg-emerald-950/40 border border-emerald-800/60">Auto + Workouts</span>
                          </div>
                          <span className="font-mono text-emerald-400 font-bold text-sm">{lifestyleSteps.toLocaleString()}</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <input type="range" min="0" max="25000" step="250" value={lifestyleSteps} onChange={(e) => setLifestyleSteps(Number(e.target.value))} className="flex-1 accent-emerald-500 cursor-pointer" />
                          <button
                            type="button"
                            onClick={() => handleSaveSingleHabit('steps', Number(lifestyleSteps), 'Step count')}
                            disabled={isStepsLoggedForDate}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shrink-0 ${
                              isStepsLoggedForDate ? 'bg-slate-900 border border-slate-800 text-slate-400 opacity-80' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md'
                            }`}
                          >
                            <Icon name={isStepsLoggedForDate ? 'Check' : 'Plus'} className={`w-3.5 h-3.5 ${isStepsLoggedForDate ? 'text-emerald-400' : ''}`} />
                            <span>{isStepsLoggedForDate ? 'Logged' : (existingLifestyleLog && typeof existingLifestyleLog.steps === 'number' ? 'Update' : 'Submit')}</span>
                          </button>
                        </div>
                      </div>
                    </div>

                    <div className="pt-2 border-t border-slate-800/80">
                      <button
                        type="button"
                        onClick={handleSaveAllHabits}
                        className="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-xs shadow-md shadow-indigo-600/30 transition flex items-center justify-center space-x-2"
                      >
                        <Icon name="Check" className="w-4 h-4" />
                        <span>Submit All 7 Habits for {formatShortDate(lifestyleDate)}</span>
                      </button>
                    </div>
                  </div>
                )}

                {/* MEDS & SUPPLEMENTS FORM */}
                {addMode === 'medication' && (
                  <form onSubmit={handleAddMedication} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="ShieldCheck" className="w-4 h-4 mr-2 text-teal-400" />
                        Log Medication or Supplement
                      </h2>
                      <span className="text-[10px] text-teal-400/90 font-medium bg-teal-950/50 border border-teal-800/40 px-2 py-0.5 rounded-lg">
                        1-Tap Stacks
                      </span>
                    </div>

                    <div className="flex flex-wrap gap-1.5">
                      {[
                        { name: 'Magnesium', dose: '350mg', reason: 'Sleep & recovery (osmotic bowel effect)' },
                        { name: 'Pre-Workout', dose: '1 scoop', reason: 'Training energy / caffeine' },
                        { name: 'Multivitamin / Zinc', dose: '1 tab', reason: 'Daily micronutrients' },
                        { name: 'Electrolytes', dose: '1 sachet', reason: 'Hydration & sodium' },
                        { name: 'Probiotic', dose: '1 cap', reason: 'Gut microbiome support' },
                        { name: 'Creatine', dose: '5g', reason: 'Strength & muscle hydration' },
                        { name: 'Iron Supplement', dose: '1 tab', reason: 'Ferritin (bowel firming)' },
                        { name: 'Paracetamol', dose: '1000mg', reason: 'Headache / pain relief' },
                        { name: 'Ibuprofen', dose: '400mg', reason: 'Anti-inflammatory' }
                      ].map((item, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => {
                            setMedName(item.name);
                            setMedDose(item.dose);
                            setMedReason(item.reason);
                          }}
                          className={`text-xs px-2.5 py-1.5 rounded-xl font-medium transition ${
                            medName.toLowerCase() === item.name.toLowerCase()
                              ? 'bg-teal-600 text-white font-bold shadow-sm'
                              : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          {item.name}
                        </button>
                      ))}
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Medication / Supplement Name
                      </label>
                      <input
                        type="text"
                        value={medName}
                        onChange={(e) => setMedName(e.target.value)}
                        placeholder="e.g. Magnesium Glycinate, Paracetamol, Zinc"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-teal-500"
                        required
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Dosage</label>
                        <input type="text" value={medDose} onChange={(e) => setMedDose(e.target.value)} placeholder="e.g. 400mg" className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2 text-sm text-slate-100" />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Reason</label>
                        <input type="text" value={medReason} onChange={(e) => setMedReason(e.target.value)} placeholder="e.g. Recovery" className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2 text-sm text-slate-100" />
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-teal-600/30 transition flex items-center justify-center space-x-1.5">
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Save Medication / Supplement</span>
                    </button>
                  </form>
                )}
              </div>
            )}

            {/* ================= VIEW 2: TIMELINE ================= */}
            {activeTab === 'timeline' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="Calendar" className="w-4 h-4 mr-1.5 text-indigo-400" />
                      Event Timeline
                    </h2>
                    <p className="text-[10px] text-slate-400">{filteredTimelineLogs.length} logged records</p>
                  </div>

                  <button
                    type="button"
                    onClick={handleExportTimelineCSV}
                    className="px-3 py-1.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-xs font-semibold transition flex items-center space-x-1.5 active:scale-95"
                  >
                    <Icon name="Download" className="w-3.5 h-3.5" />
                    <span>Export CSV</span>
                  </button>
                </div>

                {/* Filter Chips */}
                <div className="flex items-center space-x-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
                  {[
                    { id: 'all', label: 'All Events' },
                    { id: 'meal', label: 'Meals' },
                    { id: 'symptom', label: 'Flares' },
                    { id: 'exercise', label: 'Workouts' },
                    { id: 'stool', label: 'Bowel' },
                    { id: 'medication', label: 'Meds & Sups' },
                    { id: 'lifestyle', label: 'Habits' }
                  ].map(f => {
                    const count = f.id === 'all' ? logs.length : logs.filter(l => l.type === f.id).length;
                    return (
                      <button
                        key={f.id}
                        onClick={() => setTimelineFilter(f.id)}
                        className={`px-3 py-1.5 rounded-xl font-medium whitespace-nowrap transition flex items-center space-x-1.5 ${
                          timelineFilter === f.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-900 text-slate-400 border border-slate-800'
                        }`}
                      >
                        <span>{f.label}</span>
                        <span className="text-[10px] px-1 rounded-md bg-black/20 font-mono">{count}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Timeline Cards */}
                <div className="space-y-2.5">
                  {filteredTimelineLogs.length === 0 ? (
                    <div className="text-center py-12 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">
                      <Icon name="Filter" className="w-8 h-8 text-slate-600 mx-auto mb-2" />
                      <p className="text-sm font-semibold text-slate-300">No events logged yet</p>
                      <p className="text-xs text-slate-500 mt-1">Switch to the Capture tab to log meals, workouts, habits, or flares.</p>
                    </div>
                  ) : (
                    filteredTimelineLogs.map(item => {
                      let badgeColor = 'bg-slate-800 text-slate-300';
                      let iconName = 'Utensils';

                      if (item.type === 'meal') { badgeColor = 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'; iconName = 'Utensils'; }
                      else if (item.type === 'symptom') { badgeColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/30'; iconName = 'AlertCircle'; }
                      else if (item.type === 'exercise') { badgeColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'; iconName = 'Flame'; }
                      else if (item.type === 'stool') { badgeColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/30'; iconName = 'FileText'; }
                      else if (item.type === 'medication') { badgeColor = 'bg-teal-500/20 text-teal-300 border border-teal-500/30'; iconName = 'ShieldCheck'; }
                      else if (item.type === 'lifestyle') { badgeColor = 'bg-violet-500/20 text-violet-300 border border-violet-500/30'; iconName = 'Moon'; }

                      return (
                        <div key={item.id} className="bg-slate-900/70 p-3.5 rounded-2xl border border-slate-800/80 flex flex-col space-y-2.5">
                          <div className="flex items-start justify-between space-x-3">
                            <div className="flex items-start space-x-3 flex-1 min-w-0">
                              <div className={`p-2 rounded-xl shrink-0 ${badgeColor}`}>
                                <Icon name={iconName} className="w-4 h-4" />
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  <span className="text-xs font-bold text-white truncate">
                                    {item.title || item.name || 'Habits Check-in'}
                                  </span>
                                  {item.caloriesKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40">
                                      +{item.caloriesKcal} kcal ({Math.round(item.caloriesKcal * 4.184)} kJ)
                                    </span>
                                  )}
                                  {item.caloriesBurnedKcal > 0 && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      -{item.caloriesBurnedKcal} kcal ({Math.round(item.caloriesBurnedKcal * 4.184)} kJ)
                                    </span>
                                  )}
                                  {item.severity && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-rose-600/30 text-rose-300 border border-rose-500/40">
                                      Sev {item.severity}/5
                                    </span>
                                  )}
                                  {item.bristolType && (
                                    <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-600/30 text-amber-300 border border-amber-500/40">
                                      Bristol Type {item.bristolType}
                                    </span>
                                  )}
                                </div>

                                <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1 text-[11px] text-slate-400">
                                  {item.type === 'meal' && (
                                    <>
                                      <span>{item.proteinG || 0}g protein</span>
                                      <span>•</span>
                                      <span>{item.sugarG || 0}g sugar</span>
                                      <span>•</span>
                                      <span>{item.sodiumMg || 0}mg sodium</span>
                                      <span>•</span>
                                      <span>{item.waterMl || 0}ml fluid</span>
                                      {item.isLateNight && <span className="text-amber-400 font-semibold">🌙 Late Night</span>}
                                    </>
                                  )}
                                  {item.type === 'exercise' && (
                                    <>
                                      <span>{item.durationMins} mins</span>
                                      <span>•</span>
                                      <span>RPE {item.intensity}/10</span>
                                      <span>•</span>
                                      <span>{(item.steps || 0).toLocaleString()} steps</span>
                                    </>
                                  )}
                                  {item.type === 'lifestyle' && (
                                    <>
                                      {typeof item.sleepHours === 'number' && <span>{item.sleepHours}h sleep •</span>}
                                      {typeof item.hrvMs === 'number' && <span>{item.hrvMs}ms HRV •</span>}
                                      {typeof item.restingHr === 'number' && <span>{item.restingHr}bpm RHR •</span>}
                                      {typeof item.waterTotalMl === 'number' && <span>{(item.waterTotalMl / 1000).toFixed(1)}L water •</span>}
                                      {typeof item.steps === 'number' && <span>{item.steps.toLocaleString()} steps</span>}
                                    </>
                                  )}
                                  {item.type === 'medication' && (
                                    <>
                                      <span>{item.dose}</span>
                                      {item.reason && <><span>•</span><span>{item.reason}</span></>}
                                    </>
                                  )}
                                  {item.notes && (
                                    <p className="w-full text-slate-300 text-[11px] italic mt-0.5">"{item.notes}"</p>
                                  )}
                                </div>

                                {item.tags && item.tags.length > 0 && (
                                  <div className="flex flex-wrap gap-1 mt-1.5">
                                    {item.tags.map(t => (
                                      <span key={t} className="text-[9px] font-mono font-medium px-1.5 py-0.5 rounded bg-slate-950 text-indigo-300 border border-slate-800">
                                        #{t}
                                      </span>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>

                            <div className="text-right shrink-0">
                              <span className="text-[10px] text-slate-400 block font-mono">{item.timestamp}</span>
                              <span className="text-[9px] text-slate-500 block">{formatShortDate(item.date)}</span>
                            </div>
                          </div>

                          {/* Edit & Delete Actions */}
                          <div className="flex items-center justify-end space-x-1.5 pt-1.5 border-t border-slate-800/60">
                            <button
                              type="button"
                              onClick={() => handleStartEdit(item)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-indigo-300 text-[10px] font-medium transition flex items-center space-x-1"
                            >
                              <Icon name="Edit2" className="w-3 h-3 text-indigo-400" />
                              <span>Edit</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => setDeletingItemId(item.id)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-800/60 text-slate-400 hover:text-rose-300 text-[10px] font-medium transition flex items-center space-x-1"
                            >
                              <Icon name="Trash2" className="w-3 h-3 text-rose-400" />
                              <span>Delete</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* ================= VIEW 3: TRENDS ================= */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <div>
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="BarChart2" className="w-4 h-4 mr-1.5 text-indigo-400" />
                        Biometrics & Trends
                      </h2>
                      <p className="text-[10px] text-slate-400">Longitudinal patterns & energy balance</p>
                    </div>

                    <button
                      type="button"
                      onClick={handleExportTrendsCSV}
                      className="px-2.5 py-1 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-[10px] font-semibold transition flex items-center space-x-1 shrink-0"
                    >
                      <Icon name="Download" className="w-3 h-3" />
                      <span>Export CSV</span>
                    </button>
                  </div>

                  {/* Range & Aggregation Controls */}
                  <div className="flex items-center justify-between gap-1.5">
                    <div className="flex bg-slate-900 p-0.5 rounded-xl border border-slate-800 text-[10px]">
                      {[
                        { days: 7, label: '7D' },
                        { days: 14, label: '14D' },
                        { days: 30, label: '1M' },
                        { days: 90, label: '3M' },
                        { days: 180, label: '6M' },
                        { days: 365, label: '1Y' }
                      ].map(item => (
                        <button
                          key={item.days}
                          onClick={() => setAnalyticsDaysRange(item.days)}
                          className={`px-2 py-1 rounded-lg font-semibold transition ${
                            analyticsDaysRange === item.days ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>

                    <div className="flex bg-slate-900 p-0.5 rounded-xl border border-slate-800 text-[9px]">
                      {['auto', 'daily', 'weekly', 'monthly'].map(agg => (
                        <button
                          key={agg}
                          onClick={() => setAnalyticsAggregation(agg)}
                          className={`px-1.5 py-1 rounded-lg capitalize font-semibold ${
                            analyticsAggregation === agg ? 'bg-slate-800 text-indigo-300' : 'text-slate-500'
                          }`}
                        >
                          {agg}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Top 4-Card Summary Grid */}
                <div className="grid grid-cols-4 gap-2 bg-slate-900/70 p-3 rounded-2xl border border-slate-800/80 text-center">
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase block">Avg Net Energy</span>
                    <span className={`text-xs font-mono font-bold mt-0.5 block ${summaryMetrics.avgNetCalories >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                      {summaryMetrics.avgNetCalories > 0 ? `+${summaryMetrics.avgNetCalories}` : summaryMetrics.avgNetCalories} kcal
                    </span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase block">Avg Water</span>
                    <span className="text-xs font-mono font-bold text-cyan-400 mt-0.5 block">{summaryMetrics.avgWaterL} L</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase block">Avg Protein</span>
                    <span className="text-xs font-mono font-bold text-indigo-400 mt-0.5 block">{summaryMetrics.avgProteinG}g</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase block">Flare Free</span>
                    <span className="text-xs font-mono font-bold text-teal-400 mt-0.5 block">{summaryMetrics.symptomFreeDaysPct}%</span>
                  </div>
                </div>

                {/* 6-Metric Selector with Colored Icons */}
                <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[10px]">
                  {[
                    { id: 'calories', label: 'Calories', icon: 'Flame', color: 'text-amber-400' },
                    { id: 'exercise', label: 'Activity', icon: 'Activity', color: 'text-emerald-400' },
                    { id: 'water', label: 'Water', icon: 'Droplets', color: 'text-cyan-400' },
                    { id: 'sodium_sugar', label: 'Salt/Sugar', icon: 'Utensils', color: 'text-purple-400' },
                    { id: 'hrv_stress', label: 'HRV', icon: 'Heart', color: 'text-pink-400' },

                      <Icon name={tab.icon} className={`w-3.5 h-3.5 mb-0.5 ${tab.color}`} />

                      {activeMetricTab === 'exercise' && `${selectedChartPoint.steps.toLocaleString()} steps`}
                      {activeMetricTab === 'water' && `${(selectedChartPoint.waterMl / 1000).toFixed(2)} L`}
                      {activeMetricTab === 'sodium_sugar' && `${selectedChartPoint.sodiumMg}mg Na / ${selectedChartPoint.sugarG}g Sugar`}
                      {activeMetricTab === 'hrv_stress' && `${selectedChartPoint.hrvMs || '--'} ms HRV`}
                      {activeMetricTab === 'symptoms' && `${selectedChartPoint.symptomScore} flare score`}

                    </button>

                  <div className="text-center py-10 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">

                          <span className="text-[10px] font-mono text-amber-300">kcal</span>

                            const burnedPct = Math.min(100, Math.round(((d.caloriesBurnedTotalKcal || 0) / 2200) * 100));

                              <div key={idx} onClick={() => setSelectedChartPoint(d)} className="flex-1 flex flex-col items-center h-full cursor-pointer min-w-0">

                                  <div className="w-full max-w-[14px] bg-gradient-to-t from-amber-600 to-yellow-400 rounded-t-md" style={{ height: `${Math.max(d.caloriesConsumedKcal > 0 ? 8 : 0, consumedPct)}%` }} />

                                <div className="w-full h-0.5 bg-slate-700 my-0.5" />
                                <div className="w-full flex-1 flex items-start justify-center px-1">
                                  <div className="w-full max-w-[14px] bg-gradient-to-b from-rose-500 to-red-600 rounded-b-md" style={{ height: `${Math.max(d.caloriesBurnedTotalKcal > 0 ? 8 : 0, burnedPct)}%` }} />
                                </div>
                                <div className="h-4 text-[7.5px] font-mono text-rose-400 font-bold">{d.caloriesBurnedTotalKcal > 0 ? `-${d.caloriesBurnedTotalKcal}` : ''}</div>

                              </div>

                        </div>
                      </div>

                    {activeMetricTab === 'exercise' && (

                          </h3>
                        </div>
                        <div className="flex items-end justify-between gap-1.5 h-40 pt-4">
                          {aggregatedTimeSeries.map((d, idx) => {

                            return (
                              <div key={idx} onClick={() => setSelectedChartPoint(d)} className="flex-1 flex flex-col items-center h-full justify-end cursor-pointer min-w-0">
                                <span className="text-[7.5px] font-mono text-emerald-300 mb-1">{d.steps > 999 ? `${(d.steps / 1000).toFixed(1)}k` : d.steps}</span>
                                <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5">
                                  <div className="w-full rounded-lg bg-gradient-to-t from-emerald-600 to-teal-400" style={{ height: `${Math.max(8, pct)}%` }} />
                                </div>
                                <span className="text-[9px] text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {/* WATER CHART */}
                    {activeMetricTab === 'water' && (
                      <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">

                          <h3 className="font-bold text-white flex items-center">
                            <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400 mr-1.5" />

                          </h3>
                        </div>
                        <div className="flex items-end justify-between gap-1.5 h-40 pt-4">
                          {aggregatedTimeSeries.map((d, idx) => {
                            const litres = (d.waterMl || 0) / 1000;
                            const pct = Math.min(100, Math.round((litres / ((targetWaterMl / 1000) * 1.3)) * 100));
                            return (
                              <div key={idx} onClick={() => setSelectedChartPoint(d)} className="flex-1 flex flex-col items-center h-full justify-end cursor-pointer min-w-0">
                                <span className="text-[7.5px] font-mono text-cyan-300 mb-1">{litres.toFixed(1)}L</span>
                                <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5">
                                  <div className="w-full rounded-lg bg-gradient-to-t from-cyan-600 to-teal-400" style={{ height: `${Math.max(8, pct)}%` }} />
                                </div>
                                <span className="text-[9px] text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                                {mode}
                              </button>

                        </div>

                            const sodiumPct = Math.min(100, Math.round(((d.sodiumMg || 0) / 2600) * 100));
                            const sugarPct = Math.min(100, Math.round(((d.sugarG || 0) / 50) * 100));

                              <div key={idx} onClick={() => setSelectedChartPoint(d)} className="flex-1 flex flex-col items-center h-full justify-end cursor-pointer min-w-0">

                                    <div className="w-full max-w-[12px] rounded-t-sm bg-gradient-to-t from-rose-600 to-pink-400" style={{ height: `${Math.max(6, sugarPct)}%` }} />

                                </div>
                                <span className="text-[9px] text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                              </div>

                      </div>

                              <div key={idx} onClick={() => setSelectedChartPoint(d)} className="flex-1 flex flex-col items-center h-full justify-end cursor-pointer min-w-0">

                                <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5">
                                  <div className={`w-full rounded-lg ${hrv > 0 && hrv < 40 ? 'bg-rose-500' : 'bg-gradient-to-t from-pink-700 to-indigo-500'}`} style={{ height: `${Math.max(8, pct)}%` }} />
                                </div>
                                <span className="text-[9px] text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">

                            <Icon name="AlertCircle" className="w-3.5 h-3.5 text-rose-400 mr-1.5" />

                          </h3>
                        </div>
                        <div className="flex items-end justify-between gap-1.5 h-40 pt-4">
                          {aggregatedTimeSeries.map((d, idx) => {
                            const score = d.symptomScore || 0;
                            const pct = Math.min(100, Math.round((score / 10) * 100));
                            return (
                              <div key={idx} onClick={() => setSelectedChartPoint(d)} className="flex-1 flex flex-col items-center h-full justify-end cursor-pointer min-w-0">
                                <span className="text-[8px] font-mono text-rose-300 mb-1">{score}</span>
                                <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5">
                                  <div className="w-full rounded-lg bg-gradient-to-t from-rose-700 to-amber-500" style={{ height: `${Math.max(6, pct)}%` }} />
                                </div>
                                <span className="text-[9px] text-slate-400 mt-2 truncate w-full text-center">{d.label}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}

            {/* ================= VIEW 4: AI INSIGHTS ================= */}
            {activeTab === 'ai' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-indigo-900/60 via-slate-900 to-violet-950/40 p-4 rounded-3xl border border-indigo-500/30 space-y-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center">
                        <Icon name="Sparkles" className="w-4 h-4 text-white" />
                      </div>
                      <div>
                        <h2 className="text-sm font-bold text-white">Longitudinal AI Engine</h2>
                        <p className="text-[10px] text-indigo-300">Cross-day trigger & flare synthesis</p>
                      </div>
                    </div>

                    <button
                      onClick={runAICorrelationAnalysis}
                      disabled={isAnalyzingAI}
                      className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md transition disabled:opacity-50 flex items-center space-x-1"
                    >
                      <Icon name="RefreshCw" className={`w-3.5 h-3.5 ${isAnalyzingAI ? 'animate-spin' : ''}`} />
                      <span>{isAnalyzingAI ? 'Analyzing...' : 'Analyze History'}</span>
                    </button>
                  </div>

                  <p className="text-xs text-slate-300 leading-relaxed">

                  </p>

                    </div>

                      <div key={idx} className="bg-slate-900/80 p-4 rounded-3xl border border-slate-800 space-y-2">
                        <div className="flex justify-between items-start gap-2">
                          <span className="text-xs font-bold text-white">{item.trigger} → {item.symptom}</span>
                          <span className="text-[9.5px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">{item.confidence}</span>
                        </div>
                        <p className="text-xs text-slate-400">{item.explanation}</p>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-10 bg-slate-900/40 rounded-3xl border border-slate-800/80 p-6">
                    <Icon name="Sparkles" className="w-8 h-8 text-indigo-400 mx-auto mb-2 opacity-80" />
                    <p className="text-sm font-semibold text-slate-300">Ready to analyze your timeline</p>
                    <p className="text-xs text-slate-500 mt-1">Tap "Analyze History" above once you have logged meals, habits, or symptoms.</p>
                  </div>
                )}
              </div>
            )}
          </main>

            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between">

                <div className="flex items-center space-x-2">
                  <Icon name="Barcode" className="w-5 h-5 text-emerald-400" />
                  <div>
                    <h3 className="text-sm font-bold text-white leading-tight">Australian Barcode Scanner</h3>
                    <p className="text-[10px] text-emerald-300">{barcodeStatusText}</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  {hasTorch && (
                    <button
                      type="button"
                      onClick={toggleTorch}
                      className={`p-2 rounded-full border ${torchEnabled ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-slate-900/90 text-slate-200 border-slate-700'}`}
                      title="Toggle Flashlight"
                    >
                      <Icon name="Zap" className="w-4 h-4" />
                    </button>

                  <button
                    type="button"
                    onClick={() => { stopBarcodeCamera(); setShowBarcodeModal(false); }}

                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="relative flex-1 flex items-center justify-center overflow-hidden bg-slate-950">
                <video

                  className="absolute inset-0 w-full h-full object-cover"
                />

                <div className="relative w-64 h-44 border-2 border-emerald-400/80 rounded-2xl shadow-[0_0_0_9999px_rgba(2,6,23,0.65)] overflow-hidden">
                  <div className="absolute left-2 right-2 h-0.5 bg-emerald-400 shadow-[0_0_10px_#34d399] animate-scan-laser" />
                </div>
              </div>

              {/* Bottom Controls: Snap Frame Fallback & Manual Barcode Entry */}
              <div className="p-4 pb-safe bg-slate-950 border-t border-slate-800 space-y-3 z-20">

                  <Icon name="Camera" className="w-4 h-4" />
                  <span>{isLookingUpBarcode ? 'Reading Nutrition...' : 'Scan Frame Now (AI Vision Fallback)'}</span>
                </button>

                <div className="flex gap-2">
                  <input
                    type="text"
                    inputMode="numeric"
                    value={manualBarcodeInput}
                    onChange={(e) => setManualBarcodeInput(e.target.value)}
                    placeholder="Or enter barcode digits (e.g. 9300675024235)"
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder:text-slate-500"
                  />
                  <button
                    type="button"
                    onClick={() => lookupBarcodeOnline(manualBarcodeInput)}
                    disabled={isLookingUpBarcode || !manualBarcodeInput.trim()}
                    className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold disabled:opacity-40"
                  >
                    Lookup
                  </button>
                </div>
              </div>
            </div>
          )}

            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">

                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white flex items-center">
                    <Icon name="Target" className="w-4 h-4 mr-2 text-emerald-400" />
                    Daily Goals & Metabolism
                  </h3>
                  <button onClick={() => setShowGoalsModal(false)} className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                {/* Body Weight */}
                <div className="space-y-1.5 bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span>Body Weight</span>
                    <span className="text-emerald-400 font-mono font-bold">{tempWeightKg} kg</span>
                  </div>
                  <input type="range" min="40" max="160" step="1" value={tempWeightKg} onChange={(e) => setTempWeightKg(Number(e.target.value))} className="w-full accent-emerald-500 cursor-pointer" />
                </div>

                {/* Daily Steps Target */}
                <div className="space-y-1.5 bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span>Daily Steps Target</span>
                    <span className="text-emerald-400 font-mono font-bold">{Number(tempSteps).toLocaleString()}</span>
                  </div>
                  <input type="range" min="3000" max="20000" step="500" value={tempSteps} onChange={(e) => setTempSteps(Number(e.target.value))} className="w-full accent-emerald-500 cursor-pointer" />
                </div>

                {/* Daily Water Target */}
                <div className="space-y-1.5 bg-slate-950/70 p-3 rounded-2xl border border-slate-800">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span>Daily Water Target</span>
                    <span className="text-cyan-400 font-mono font-bold">{tempWaterL} Litres</span>
                  </div>
                  <input type="range" min="1.0" max="5.0" step="0.1" value={tempWaterL} onChange={(e) => setTempWaterL(e.target.value)} className="w-full accent-cyan-400 cursor-pointer" />
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => setShowGoalsModal(false)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Cancel</button>
                  <button type="button" onClick={saveGoals} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-md">Save Goals</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= SETTINGS, PUSH NOTIFICATIONS & GITHUB UPDATES MODAL ================= */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-bold text-white flex items-center">
                    <Icon name="Settings" className="w-4 h-4 mr-2 text-indigo-400" />

                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
