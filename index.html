                </div>

                {/* APPLE HEALTH AUTO-SYNC (iOS SHORTCUTS BRIDGE) */}
                <div className="bg-slate-950/80 p-3.5 rounded-2xl border border-rose-500/30 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white flex items-center gap-1.5">
                      <Icon name="Heart" className="w-3.5 h-3.5 text-rose-400" />
                      Apple Health Auto-Steps Sync
                    </span>
                    {lastHealthSync && (
                      <span className="text-[9px] font-mono text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-800/50">
                        Synced {lastHealthSync}
                      </span>
                    )}
                  </div>

                  <p className="text-[10px] text-slate-400 leading-relaxed">
                    Connect iPhone <strong className="text-slate-200">Apple Health</strong> via a free 2-step iOS Shortcut so your steps log automatically:
                  </p>

                  <div className="space-y-2 bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 text-[10px] text-slate-300">
                    <p className="font-bold text-indigo-300 uppercase tracking-wider text-[9px]">Part 1: Build the Shortcut (Top-to-Bottom)</p>
                    <ol className="space-y-1.5 list-decimal list-inside">
                      <li>Open Apple <strong className="text-white">Shortcuts</strong> → <strong className="text-white">Shortcuts</strong> tab → tap <strong className="text-white">+</strong> and name it <strong className="text-rose-300">{shortcutName}</strong>.</li>
                      <li><strong>Top Action:</strong> Add <strong className="text-white">Find Health Samples</strong> → set Type to <strong className="text-emerald-300">Steps</strong> & Start Date to <strong className="text-emerald-300">is Today</strong>.</li>
                      <li><strong>Bottom Action (below Health Samples):</strong> Add <strong className="text-white">Open URLs</strong> → tap the light-blue word <strong className="text-sky-400">URL</strong> to open the typing box → paste your link below, then tap the <strong className="text-indigo-300">Health Samples</strong> pill above your keyboard right after <code className="text-amber-300">=</code>.</li>
                    </ol>
                  </div>

                  <div className="flex gap-1.5">
                    <input
                      type="text"
                      readOnly
                      value={getHealthSyncTemplateUrl()}
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1.5 text-[10px] font-mono text-emerald-300 select-all"
                    />
                    <button
                      type="button"
                      onClick={handleCopyHealthSyncUrl}
                      className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-bold shrink-0"
                    >
                      Copy URL
                    </button>
                  </div>

                  <div className="pt-1 flex items-center justify-between gap-2">
                    <input
                      type="text"
                      value={shortcutName}
                      onChange={(e) => {
                        setShortcutName(e.target.value);
                        localStorage.setItem('pulsehealth_shortcut_name', e.target.value);
                      }}
                      placeholder="Shortcut Name"
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1.5 text-[11px] text-white"
                    />
                    <button
                      type="button"
                      onClick={handleTriggerAppleHealthShortcut}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-rose-300 text-[10px] font-bold shrink-0"
                    >
                      Run Shortcut Now
                    </button>
                  </div>

                  <div className="bg-slate-900/70 p-2 rounded-xl border border-slate-800/80 text-[9.5px] text-slate-400 space-y-1">
                    <p className="text-slate-200 font-semibold">Part 2: Zero-Tap Daily Automation</p>
                    <p>In the Shortcuts app → tap the <strong>Automation</strong> tab (bottom-center) → tap <strong>+</strong> → choose <strong>Time of Day</strong> (e.g. 8:30 PM, Daily) → select <strong>Run Immediately</strong> → tap <strong>Next</strong> → select <strong>{shortcutName}</strong> under <em>My Shortcuts</em>.</p>
                  </div>
                </div>

                {/* PUSH NOTIFICATIONS SECTION */}
                <div className="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-white flex items-center gap-1.5">
                        <Icon name="Bell" className="w-3.5 h-3.5 text-indigo-400" />
                        Push Notifications
                      </span>
                      <span className="text-[10px] text-slate-400 block">
                        Status: <strong className={notifPermission === 'granted' ? 'text-emerald-400' : 'text-amber-400'}>{notifPermission}</strong>
                      </span>
                    </div>

                    <div className="flex items-center gap-1.5">
                      {notifPermission === 'granted' && (
                        <button
                          type="button"
                          onClick={handleTestNotification}
                          className="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-200 text-[10px] font-semibold hover:bg-slate-700"
                        >
                          Test Alert
                        </button>
                      )}
                      <button
                        type="button"
                        onClick={handleEnableNotifications}
                        className="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold"
                      >
                        {notifPermission === 'granted' ? 'Enabled' : 'Enable'}
                      </button>
                    </div>
                  </div>

                  {/* Notification Toggles List */}
                  <div className="space-y-2 pt-2 border-t border-slate-800/80">
                    {[
                      {
                        key: 'endOfDayHabits',
                        title: 'End-of-Day Missing Habits Alert (8:30 pm)',
                        desc: 'Alert if any of the 7 daily habits or vitals have not been logged'
                      },
                      {
                        key: 'waterBelowTarget',
                        title: 'Water Below Daily Target Alert (3:00 pm)',
                        desc: `Remind if water intake is below ${(targetWaterMl / 1000).toFixed(1)}L goal`
                      },
                      {
                        key: 'stepsBehindPace',
                        title: 'Daily Steps Pace Check (4:30 pm)',
                        desc: `Nudge if step count is under 60% of ${targetSteps.toLocaleString()} target`
                      },
                      {
                        key: 'postMealSymptomCheck',
                        title: 'Post-Meal Symptom Check-in (90 mins)',
                        desc: 'Prompt after meals tagged with dairy, gluten, or high sugar'
                      },
                      {
                        key: 'lateNightCurfew',
                        title: 'Kitchen Curfew Reminder (2.5h pre-sleep)',
                        desc: 'Protect overnight HRV recovery by avoiding late meals'
                      }
                    ].map(item => {
                      const active = Boolean(notifPrefs[item.key]);
                      return (
                        <div key={item.key} className="flex items-center justify-between gap-2 py-1">
                          <div className="flex-1 min-w-0">
                            <span className="text-[11px] font-semibold text-slate-200 block leading-tight">{item.title}</span>
                            <span className="text-[9.5px] text-slate-500 block leading-tight mt-0.5">{item.desc}</span>
                          </div>
                          <button
                            type="button"
                            onClick={() => setNotifPrefs(prev => ({ ...prev, [item.key]: !prev[item.key] }))}
                            className={`w-10 h-5.5 rounded-full p-0.5 transition-colors shrink-0 ${active ? 'bg-indigo-600' : 'bg-slate-800'}`}
                          >
                            <div className={`w-4 h-4 rounded-full bg-white transition-transform ${active ? 'translate-x-4.5' : 'translate-x-0'}`} />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* GITHUB DEPLOYMENT UPDATE CHECKER */}
                <div className="bg-slate-950/80 p-3.5 rounded-2xl border border-slate-800 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-white flex items-center gap-1.5">
                      <Icon name="RefreshCw" className="w-3.5 h-3.5 text-emerald-400" />
                      Check GitHub for App Updates
                    </span>
                    <span className="text-[9px] font-mono text-slate-500">{APP_BUILD_ID}</span>
                  </div>

                  <div className="bg-slate-900/90 border border-slate-800 p-2 rounded-xl text-[10px] text-slate-400 space-y-1">
                    <p className="text-slate-300 font-semibold">What do I type in this box?</p>
                    <p>Enter your GitHub <strong className="text-indigo-300">username/repository</strong> where this <code className="text-slate-200">index.html</code> is hosted (or paste the full GitHub repo URL):</p>
                    <p className="font-mono text-[9.5px] text-emerald-400">Example: johnsmith/pulsehealth</p>
                  </div>

                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={githubRepo}
                      onChange={(e) => setGithubRepo(e.target.value)}
                      placeholder="username/repository"
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder:text-slate-600"
                    />
                    <button
                      type="button"
                      onClick={handleCheckGithubUpdate}
                      disabled={isCheckingUpdate}
                      className="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shrink-0 disabled:opacity-50"
                    >
                      {isCheckingUpdate ? 'Checking...' : 'Check'}
                    </button>
                  </div>

                  {updateStatus && (
                    <div className={`p-2.5 rounded-xl border text-[11px] space-y-2 ${updateStatus.hasUpdate ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200' : 'bg-slate-900 border-slate-800 text-slate-300'}`}>
                      <p>{updateStatus.message} {updateStatus.remoteSha && <span className="font-mono text-[9.5px] opacity-80">(#{updateStatus.remoteSha})</span>}</p>
                      {updateStatus.hasUpdate && (
                        <button
                          type="button"
                          onClick={handleApplyGithubUpdate}
                          className="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md"
                        >
                          Update & Reload App (Keeps All Data)
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {/* BACKUP & RESTORE JSON */}
                <div className="pt-2 border-t border-slate-800 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
                    Data Backup & Restore (JSON)
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute("href", dataStr);
                        downloadAnchor.setAttribute("download", `pulsehealth_backup_${todayStr}.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                        showToast('Backup JSON downloaded!');
                      }}
                      className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="Download" className="w-3.5 h-3.5 text-indigo-400" />
                      <span>Download JSON</span>
                    </button>

                    <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1.5 cursor-pointer">
                      <Icon name="RefreshCw" className="w-3.5 h-3.5 text-emerald-400" />
                      <span>Restore JSON</span>
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (event) => {
                            try {
                              const parsed = JSON.parse(event.target.result);
                              if (Array.isArray(parsed)) {
                                setLogs(parsed);
                                showToast(`Restored ${parsed.length} logs!`);
                                setShowSettingsModal(false);
                              }
                            } catch {
                              showToast('Invalid JSON backup file');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= DELETE CONFIRMATION MODAL ================= */}
          {deletingItemId && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4">
                <h3 className="text-sm font-bold text-white flex items-center space-x-2">
                  <Icon name="Trash2" className="w-4 h-4 text-rose-400" />
                  <span>Delete Entry?</span>
                </h3>
                <p className="text-xs text-slate-300">This will permanently remove the entry and recalculate daily totals.</p>
                <div className="flex gap-2">
                  <button onClick={() => setDeletingItemId(null)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Cancel</button>
                  <button onClick={() => handleDeleteLog(deletingItemId)} className="flex-1 py-2.5 rounded-xl bg-rose-600 text-white text-xs font-bold">Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= EDIT ENTRY MODAL ================= */}
          {editingItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-bold text-white capitalize">Edit {editingItem.type}</h3>
                  <button onClick={() => setEditingItem(null)} className="p-1 rounded-xl bg-slate-800 text-slate-400 hover:text-white">
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleSaveEdit} className="space-y-3">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-400 uppercase block mb-1">Date</label>
                      <input type="date" value={editingItem.date || ''} onChange={(e) => setEditingItem({ ...editingItem, date: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 uppercase block mb-1">Time</label>
                      <input type="text" value={editingItem.timestamp || ''} onChange={(e) => setEditingItem({ ...editingItem, timestamp: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white" />
                    </div>
                  </div>

                  {editingItem.type !== 'lifestyle' && (
                    <div>
                      <label className="text-[10px] text-slate-400 uppercase block mb-1">Title / Name</label>
                      <input
                        type="text"
                        value={editingItem.title !== undefined ? editingItem.title : editingItem.name || ''}
                        onChange={(e) => setEditingItem({
                          ...editingItem,
                          ...(editingItem.title !== undefined ? { title: e.target.value } : { name: e.target.value })
                        })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"
                      />
                    </div>
                  )}

                  {editingItem.type === 'meal' && (
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <span className="text-[10px] text-slate-400 block">Calories (kcal)</span>
                        <input type="number" value={editingItem.caloriesKcal || 0} onChange={(e) => setEditingItem({ ...editingItem, caloriesKcal: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Fluid (ml)</span>
                        <input type="number" value={editingItem.waterMl || 0} onChange={(e) => setEditingItem({ ...editingItem, waterMl: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Protein (g)</span>
                        <input type="number" value={editingItem.proteinG || 0} onChange={(e) => setEditingItem({ ...editingItem, proteinG: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Sugar (g)</span>
                        <input type="number" value={editingItem.sugarG || 0} onChange={(e) => setEditingItem({ ...editingItem, sugarG: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'exercise' && (
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <div>
                        <span className="text-[10px] text-slate-400 block">Duration (min)</span>
                        <input type="number" value={editingItem.durationMins || 0} onChange={(e) => setEditingItem({ ...editingItem, durationMins: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Steps</span>
                        <input type="number" value={editingItem.steps || 0} onChange={(e) => setEditingItem({ ...editingItem, steps: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-400 block">Burned (kcal)</span>
                        <input type="number" value={editingItem.caloriesBurnedKcal || 0} onChange={(e) => setEditingItem({ ...editingItem, caloriesBurnedKcal: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-white" />
                      </div>
                    </div>
                  )}

                  {editingItem.type === 'symptom' && (
                    <div>
                      <span className="text-[10px] text-slate-400 block mb-1">Severity (1-5)</span>
                      <input type="number" min="1" max="5" value={editingItem.severity || 1} onChange={(e) => setEditingItem({ ...editingItem, severity: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white" />
                    </div>
                  )}

                  {editingItem.type === 'stool' && (
                    <div>
                      <span className="text-[10px] text-slate-400 block mb-1">Bristol Type (1-7)</span>
                      <input type="number" min="1" max="7" value={editingItem.bristolType || 4} onChange={(e) => setEditingItem({ ...editingItem, bristolType: Number(e.target.value), title: `Bristol Type ${e.target.value} Movement` })} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white" />
                    </div>
                  )}

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setEditingItem(null)} className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Cancel</button>
                    <button type="submit" className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= FLOATING BOTTOM TAB BAR ================= */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/95 backdrop-blur-lg border-t border-slate-900 px-6 py-2.5 pb-safe z-40">
            <div className="flex items-center justify-between">
              {[
                { id: 'add', label: 'Capture', icon: 'Plus' },
                { id: 'timeline', label: 'Timeline', icon: 'Calendar' },
                { id: 'analytics', label: 'Trends', icon: 'BarChart2' },
                { id: 'ai', label: 'AI Insights', icon: 'Sparkles' }
              ].map(tab => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center py-1 transition ${isActive ? 'text-indigo-400' : 'text-slate-500 hover:text-slate-300'}`}
                  >
                    <div className={`p-1.5 rounded-xl transition ${isActive ? 'bg-indigo-500/20 shadow-sm' : ''}`}>
                      <Icon name={tab.icon} className="w-5 h-5" />
                    </div>
                    <span className={`text-[10px] mt-0.5 font-medium ${isActive ? 'font-bold text-slate-100' : ''}`}>
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </nav>

          {/* ================= CALENDAR POP-UP MODAL ================= */}
          {showDatePickerModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center space-x-2">
                    <Icon name="Calendar" className="w-4 h-4 text-indigo-400" />
                    <h3 className="text-sm font-bold text-white">Select Event Date</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowDatePickerModal(false)}
                    className="p-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-4 h-4" />
                  </button>
                </div>

                {/* Quick Chips */}
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setCaptureDate(todayStr);
                      setShowDatePickerModal(false);
                    }}
                    className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${
                      captureDate === todayStr
                        ? 'bg-indigo-600 text-white border-indigo-500'
                        : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    Today
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const d = new Date(todayStr + 'T00:00:00');
                      d.setDate(d.getDate() - 1);
                      const yStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                      setCaptureDate(yStr);
                      setShowDatePickerModal(false);
                    }}
                    className="flex-1 py-2 rounded-xl text-xs font-bold bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700 transition"
                  >
                    Yesterday
                  </button>
                </div>

                {/* Month Navigation */}
                <div className="flex items-center justify-between px-1">
                  <button
                    type="button"
                    onClick={() => {
                      setCalendarViewMonth(prev => {
                        const m = prev.month - 1;
                        return m < 0 ? { year: prev.year - 1, month: 11 } : { year: prev.year, month: m };
                      });
                    }}
                    className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white text-xs font-bold"
                  >
                    ‹ Prev
                  </button>
                  <span className="text-xs font-bold text-white">
                    {new Date(calendarViewMonth.year, calendarViewMonth.month, 1).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' })}
                  </span>
                  <button
                    type="button"
                    onClick={() => {
                      setCalendarViewMonth(prev => {
                        const m = prev.month + 1;
                        return m > 11 ? { year: prev.year + 1, month: 0 } : { year: prev.year, month: m };
                      });
                    }}
                    className="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white text-xs font-bold"
                  >
                    Next ›
                  </button>
                </div>

                {/* Calendar Grid (Mon - Sun) */}
                <div className="space-y-1">
                  <div className="grid grid-cols-7 text-center text-[10px] font-bold text-slate-500 pb-1">
                    {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                      <div key={day}>{day}</div>
                    ))}
                  </div>
                  <div className="grid grid-cols-7 gap-1">
                    {(() => {
                      const firstDay = new Date(calendarViewMonth.year, calendarViewMonth.month, 1).getDay();
                      const startOffset = (firstDay + 6) % 7; // Monday start
                      const daysInMonth = new Date(calendarViewMonth.year, calendarViewMonth.month + 1, 0).getDate();
                      const cells = [];

                      for (let i = 0; i < startOffset; i++) {
                        cells.push(<div key={`empty-${i}`} className="h-9" />);
                      }

                      for (let day = 1; day <= daysInMonth; day++) {
                        const iso = `${calendarViewMonth.year}-${String(calendarViewMonth.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        const isSelected = iso === captureDate;
                        const isFuture = iso > todayStr;
                        const isToday = iso === todayStr;

                        cells.push(
                          <button
                            key={iso}
                            type="button"
                            disabled={isFuture}
                            onClick={() => {
                              setCaptureDate(iso);
                              setShowDatePickerModal(false);
                            }}
                            className={`h-9 rounded-xl text-xs font-mono font-semibold transition flex items-center justify-center ${
                              isSelected
                                ? 'bg-indigo-600 text-white font-bold shadow-md shadow-indigo-600/40'
                                : isFuture
                                ? 'text-slate-700 cursor-not-allowed'
                                : isToday
                                ? 'bg-slate-800 text-indigo-300 border border-indigo-500/40'
                                : 'bg-slate-950/70 text-slate-200 hover:bg-slate-800'
                            }`}
                          >
                            {day}
                          </button>
                        );
                      }
                      return cells;
                    })()}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= iOS-STYLE TIME WHEEL POP-UP MODAL ================= */}
          {showTimeWheelModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center space-x-2">
                    <Icon name="Clock" className="w-4 h-4 text-emerald-400" />
                    <div>
                      <h3 className="text-sm font-bold text-white">Select Time (AEST/AEDT)</h3>
                      <p className="text-[10px] text-slate-400 font-mono">
                        {String(wheelHour12).padStart(2, '0')}:{String(wheelMinute).padStart(2, '0')} {wheelAmPm}
                      </p>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      const fresh = getAustralianNow();
                      const [hStr, mStr] = fresh.time24.split(':');
                      const h24 = parseInt(hStr, 10);
                      const mins = parseInt(mStr, 10);
                      const ampm = h24 >= 12 ? 'PM' : 'AM';
                      let h12 = h24 % 12;
                      if (h12 === 0) h12 = 12;
                      setWheelHour12(h12);
                      setWheelMinute(mins);
                      setWheelAmPm(ampm);
                      const itemH = 40;
                      if (hourWheelRef.current) hourWheelRef.current.scrollTo({ top: (h12 - 1) * itemH, behavior: 'smooth' });
                      if (minuteWheelRef.current) minuteWheelRef.current.scrollTo({ top: mins * itemH, behavior: 'smooth' });
                      if (ampmWheelRef.current) ampmWheelRef.current.scrollTo({ top: (ampm === 'PM' ? 1 : 0) * itemH, behavior: 'smooth' });
                    }}
                    className="px-2.5 py-1 rounded-xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 text-[10px] font-bold"
                  >
                    Set to Now
                  </button>
                </div>

                {/* 3-Column iPhone Drum Picker */}
                <div className="relative h-52 bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden select-none">
                  {/* Center Selection Highlight Bar */}
                  <div className="pointer-events-none absolute inset-x-3 top-1/2 -translate-y-1/2 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/40 z-10" />
                  {/* Top & Bottom Fade Overlays */}
                  <div className="pointer-events-none absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-slate-950 via-slate-950/80 to-transparent z-10" />
                  <div className="pointer-events-none absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent z-10" />

                  <div className="grid grid-cols-3 h-full relative z-20">
                    {/* HOURS COLUMN (1 - 12) */}
                    <div
                      ref={hourWheelRef}
                      onScroll={(e) => {
                        const idx = Math.round(e.currentTarget.scrollTop / 40);
                        const clamped = Math.max(0, Math.min(11, idx));
                        setWheelHour12(clamped + 1);
                      }}
                      className="h-full overflow-y-auto no-scrollbar wheel-scroll py-[84px]"
                    >
                      {Array.from({ length: 12 }, (_, i) => i + 1).map(h => (
                        <div
                          key={h}
                          onClick={() => {
                            setWheelHour12(h);
                            hourWheelRef.current?.scrollTo({ top: (h - 1) * 40, behavior: 'smooth' });
                          }}
                          className={`h-10 flex items-center justify-center font-mono text-base wheel-item cursor-pointer transition ${
                            wheelHour12 === h ? 'text-white font-bold scale-110' : 'text-slate-500'
                          }`}
                        >
                          {String(h).padStart(2, '0')}
                        </div>
                      ))}
                    </div>

                    {/* MINUTES COLUMN (00 - 59) */}
                    <div
                      ref={minuteWheelRef}
                      onScroll={(e) => {
                        const idx = Math.round(e.currentTarget.scrollTop / 40);
                        const clamped = Math.max(0, Math.min(59, idx));
                        setWheelMinute(clamped);
                      }}
                      className="h-full overflow-y-auto no-scrollbar wheel-scroll py-[84px]"
                    >
                      {Array.from({ length: 60 }, (_, i) => i).map(m => (
                        <div
                          key={m}
                          onClick={() => {
                            setWheelMinute(m);
                            minuteWheelRef.current?.scrollTo({ top: m * 40, behavior: 'smooth' });
                          }}
                          className={`h-10 flex items-center justify-center font-mono text-base wheel-item cursor-pointer transition ${
                            wheelMinute === m ? 'text-white font-bold scale-110' : 'text-slate-500'
                          }`}
                        >
                          {String(m).padStart(2, '0')}
                        </div>
                      ))}
                    </div>

                    {/* AM / PM COLUMN */}
                    <div
                      ref={ampmWheelRef}
                      onScroll={(e) => {
                        const idx = Math.round(e.currentTarget.scrollTop / 40);
                        setWheelAmPm(idx >= 1 ? 'PM' : 'AM');
                      }}
                      className="h-full overflow-y-auto no-scrollbar wheel-scroll py-[84px]"
                    >
                      {['AM', 'PM'].map((period, idx) => (
                        <div
                          key={period}
                          onClick={() => {
                            setWheelAmPm(period);
                            ampmWheelRef.current?.scrollTo({ top: idx * 40, behavior: 'smooth' });
                          }}
                          className={`h-10 flex items-center justify-center font-mono text-sm wheel-item cursor-pointer transition ${
                            wheelAmPm === period ? 'text-indigo-300 font-bold scale-110' : 'text-slate-500'
                          }`}
                        >
                          {period}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setShowTimeWheelModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={confirmTimeWheel}
                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md"
                  >
                    Confirm Time
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
