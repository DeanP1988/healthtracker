<!DOCTYPE html>
<html lang="en-AU" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PulseHealth</title>

  <!-- iOS Web App / Add to Home Screen Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PulseHealth" />
  <meta name="theme-color" content="#020617" />

  <!-- Dynamic PNG Touch Icon Generator so iOS Safari uses raster graphics instead of fallback letter 'P' -->
  <script>
    (function() {
      try {
        const size = 192;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Background gradient
        const bgGrad = ctx.createRadialGradient(size * 0.3, size * 0.25, 10, size * 0.5, size * 0.5, size * 0.85);
        bgGrad.addColorStop(0, '#1e1b4b');
        bgGrad.addColorStop(0.55, '#0f172a');
        bgGrad.addColorStop(1, '#020617');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, size, size);

        // Soft glowing aura
        const aura = ctx.createRadialGradient(size * 0.5, size * 0.48, 5, size * 0.5, size * 0.48, size * 0.42);
        aura.addColorStop(0, 'rgba(99, 102, 241, 0.35)');
        aura.addColorStop(1, 'rgba(99, 102, 241, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(size * 0.5, size * 0.48, size * 0.42, 0, Math.PI * 2);
        ctx.fill();

        // Stylized Biometric Heart Silhouette
        ctx.save();
        ctx.translate(size * 0.5, size * 0.53);
        const s = 1.35;
        ctx.beginPath();
        ctx.moveTo(0, 26 * s);
        ctx.bezierCurveTo(-42 * s, -4 * s, -46 * s, -34 * s, -22 * s, -42 * s);
        ctx.bezierCurveTo(-8 * s, -46 * s, 0, -34 * s, 0, -28 * s);
        ctx.bezierCurveTo(0, -34 * s, 8 * s, -46 * s, 22 * s, -42 * s);
        ctx.bezierCurveTo(46 * s, -34 * s, 42 * s, -4 * s, 0, 26 * s);
        ctx.closePath();

        const heartGrad = ctx.createLinearGradient(-35 * s, -40 * s, 35 * s, 26 * s);
        heartGrad.addColorStop(0, '#f43f5e');
        heartGrad.addColorStop(0.5, '#e11d48');
        heartGrad.addColorStop(1, '#9f1239');
        ctx.fillStyle = heartGrad;
        ctx.shadowColor = 'rgba(244, 63, 94, 0.45)';
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.restore();

        // High-Contrast Cyan-to-Emerald ECG Pulse Line
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 7.5;
        const ecgGrad = ctx.createLinearGradient(24, size * 0.5, size - 24, size * 0.5);
        ecgGrad.addColorStop(0, '#38bdf8');
        ecgGrad.addColorStop(0.5, '#22d3ee');
        ecgGrad.addColorStop(1, '#34d399');
        ctx.strokeStyle = ecgGrad;
        ctx.shadowColor = 'rgba(34, 211, 238, 0.85)';
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(24, size * 0.52);
        ctx.lineTo(58, size * 0.52);
        ctx.lineTo(72, size * 0.34);
        ctx.lineTo(88, size * 0.68);
        ctx.lineTo(106, size * 0.26);
        ctx.lineTo(122, size * 0.60);
        ctx.lineTo(134, size * 0.52);
        ctx.lineTo(168, size * 0.52);
        ctx.stroke();

        // Spark node at peak
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(106, size * 0.26, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const pngDataUrl = canvas.toDataURL('image/png');

        const setLink = (rel) => {
          let link = document.querySelector(`link[rel="${rel}"]`);
          if (!link) {
            link = document.createElement('link');
            link.rel = rel;
            document.head.appendChild(link);
          }
          link.href = pngDataUrl;
        };

        setLink('apple-touch-icon');
        setLink('apple-touch-icon-precomposed');
        setLink('icon');
      } catch (e) {
        console.warn('Touch icon render skipped:', e);
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- ZXing Barcode Library for iOS Safari Fallback -->
  <script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #020617;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 16px);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe-topbar {
      padding-top: calc(env(safe-area-inset-top, 20px) + 1.25rem);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes scanLaser {
      0%, 100% { top: 12%; }
      50% { top: 86%; }
    }
    .animate-scan-laser {
      animation: scanLaser 2.2s ease-in-out infinite;
    }

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // Lightweight Lucide SVG Icon Wrapper
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current && window.lucide) {
          const iconDef = window.lucide.icons[name];
          if (iconDef) {
            const svgEl = window.lucide.createElement(iconDef);
            svgEl.setAttribute('class', className);
            containerRef.current.innerHTML = '';
            containerRef.current.appendChild(svgEl);
          }
        }
      }, [name, className]);
      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
    };

    const APP_BUILD_ID = '2026.11.26.v2';

    function App() {
      // Logs State (Starts clean with no sample dummy data)
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('pulsehealth_logs');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [activeTab, setActiveTab] = useState('add'); // 'add', 'timeline', 'analytics', 'ai'
      const [addMode, setAddMode] = useState('meal'); // 'meal', 'symptom', 'stool', 'exercise', 'lifestyle', 'medication'

      // User Goals & Profile State
      const [targetSteps, setTargetSteps] = useState(() => Number(localStorage.getItem('pulsehealth_target_steps')) || 8000);
      const [targetWaterMl, setTargetWaterMl] = useState(() => Number(localStorage.getItem('pulsehealth_target_water')) || 2500);
      const [userWeightKg, setUserWeightKg] = useState(() => Number(localStorage.getItem('pulsehealth_user_weight')) || 75);

      const [showGoalsModal, setShowGoalsModal] = useState(false);
      const [tempSteps, setTempSteps] = useState(targetSteps);
      const [tempWaterL, setTempWaterL] = useState((targetWaterMl / 1000).toFixed(1));
      const [tempWeightKg, setTempWeightKg] = useState(userWeightKg);

      // App Settings, Push Notifications & GitHub Update State
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [githubRepo, setGithubRepo] = useState(() => localStorage.getItem('pulsehealth_github_repo') || '');
      const [isCheckingUpdate, setIsCheckingUpdate] = useState(false);
      const [updateStatus, setUpdateStatus] = useState(null);

      const [notifPermission, setNotifPermission] = useState(() => (typeof Notification !== 'undefined' ? Notification.permission : 'default'));
      const [notifPrefs, setNotifPrefs] = useState(() => {
        try {
          const saved = localStorage.getItem('pulsehealth_notif_prefs');
          return saved ? JSON.parse(saved) : {
            endOfDayHabits: true,
            waterBelowTarget: true,
            stepsBehindPace: false,
            postMealSymptomCheck: true,
            lateNightCurfew: false
          };
        } catch {
          return {
            endOfDayHabits: true,
            waterBelowTarget: true,
            stepsBehindPace: false,
            postMealSymptomCheck: true,
            lateNightCurfew: false
          };
        }
      });

      // Apple Health Auto-Sync State
      const [shortcutName, setShortcutName] = useState(() => localStorage.getItem('pulsehealth_shortcut_name') || 'Sync PulseHealth');
      const [lastHealthSync, setLastHealthSync] = useState(() => localStorage.getItem('pulsehealth_last_health_sync') || null);

      // Timeline Filter & Modals
      const [timelineFilter, setTimelineFilter] = useState('all');
      const [editingItem, setEditingItem] = useState(null);
      const [deletingItemId, setDeletingItemId] = useState(null);

      // Analytics Settings
      const [analyticsDaysRange, setAnalyticsDaysRange] = useState(7);
      const [analyticsAggregation, setAnalyticsAggregation] = useState('auto');
      const [activeMetricTab, setActiveMetricTab] = useState('calories');
      const [saltSugarViewMode, setSaltSugarViewMode] = useState('both');
      const [selectedChartPoint, setSelectedChartPoint] = useState(null);

      // Meal Form State
      const [mealTitle, setMealTitle] = useState('');
      const [mealTags, setMealTags] = useState([]);
      const [mealCalories, setMealCalories] = useState(0);
      const [mealProtein, setMealProtein] = useState(0);
      const [mealCarbs, setMealCarbs] = useState(0);
      const [mealSugar, setMealSugar] = useState(0);
      const [mealSodium, setMealSodium] = useState(0);
      const [mealWater, setMealWater] = useState(0);
      const [mealPace, setMealPace] = useState('relaxed');
      const [mealPosture, setMealPosture] = useState('table');
      const [isLateNight, setIsLateNight] = useState(false);
      const [isAnalyzingPhoto, setIsAnalyzingPhoto] = useState(false);
      const [isEstimatingMealAI, setIsEstimatingMealAI] = useState(false);

      // Live Barcode Scanner Modal State
      const [showBarcodeModal, setShowBarcodeModal] = useState(false);
      const [barcodeStatusText, setBarcodeStatusText] = useState('Align Australian barcode inside frame');
      const [manualBarcodeInput, setManualBarcodeInput] = useState('');
      const [isLookingUpBarcode, setIsLookingUpBarcode] = useState(false);
      const [torchEnabled, setTorchEnabled] = useState(false);
      const [hasTorch, setHasTorch] = useState(false);
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const scanIntervalRef = useRef(null);
      const isProcessingCodeRef = useRef(false);

      // Australian (Melbourne / Sydney AEST/AEDT) Date & Time Helpers
      const getAustralianNow = () => {
        try {
          const now = new Date();
          const dateParts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Australia/Melbourne',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }).format(now);

          const timeParts = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Australia/Melbourne',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          }).format(now);

          return { dateStr: dateParts, time24: timeParts };
        } catch {
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, '0');
          const day = String(now.getDate()).padStart(2, '0');
          const hrs = String(now.getHours()).padStart(2, '0');
          const mins = String(now.getMinutes()).padStart(2, '0');
          return { dateStr: `${year}-${month}-${day}`, time24: `${hrs}:${mins}` };
        }
      };

      const formatTime24To12Au = (time24) => {
        if (!time24 || !time24.includes(':')) return time24 || '';
        const [hStr, mStr] = time24.split(':');
        let h = parseInt(hStr, 10);
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12;
        if (h === 0) h = 12;
        return `${String(h).padStart(2, '0')}:${mStr} ${ampm}`;
      };

      const parseTime12To24 = (timeStr) => {
        if (!timeStr) return '12:00';
        const match = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
        if (!match) return timeStr;
        let h = parseInt(match[1], 10);
        const m = match[2];
        const period = match[3]?.toLowerCase();
        if (period === 'pm' && h < 12) h += 12;
        if (period === 'am' && h === 12) h = 0;
        return `${String(h).padStart(2, '0')}:${m}`;
      };

      const todayStr = useMemo(() => getAustralianNow().dateStr, []);

      const currentTimeStr = useMemo(() => {
        return formatTime24To12Au(getAustralianNow().time24);
      }, []);

      // Shared Capture Date & Time State (Defaults to Current AEST/AEDT)
      const [captureDate, setCaptureDate] = useState(() => getAustralianNow().dateStr);
      const [captureTime24, setCaptureTime24] = useState(() => getAustralianNow().time24);

      // Custom Calendar & iOS Time Wheel Modal States
      const [showDatePickerModal, setShowDatePickerModal] = useState(false);
      const [calendarViewMonth, setCalendarViewMonth] = useState(() => {
        const [y, m] = getAustralianNow().dateStr.split('-').map(Number);
        return { year: y, month: m - 1 };
      });

      const [showTimeWheelModal, setShowTimeWheelModal] = useState(false);
      const [wheelHour12, setWheelHour12] = useState(12);
      const [wheelMinute, setWheelMinute] = useState(0);
      const [wheelAmPm, setWheelAmPm] = useState('AM');
      const hourWheelRef = useRef(null);
      const minuteWheelRef = useRef(null);
      const ampmWheelRef = useRef(null);

      const syncCaptureToNow = () => {
        const fresh = getAustralianNow();
        setCaptureDate(fresh.dateStr);
        setCaptureTime24(fresh.time24);
      };

      const openDatePicker = () => {
        const [y, m] = (captureDate || getAustralianNow().dateStr).split('-').map(Number);
        setCalendarViewMonth({ year: y, month: m - 1 });
        setShowDatePickerModal(true);
      };

      const openTimeWheel = () => {
        const [hStr, mStr] = (captureTime24 || '12:00').split(':');
        let h24 = parseInt(hStr, 10);
        const mins = parseInt(mStr, 10);
        const ampm = h24 >= 12 ? 'PM' : 'AM';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;

        setWheelHour12(h12);
        setWheelMinute(mins);
        setWheelAmPm(ampm);
        setShowTimeWheelModal(true);

        setTimeout(() => {
          const itemH = 40;
          if (hourWheelRef.current) hourWheelRef.current.scrollTop = (h12 - 1) * itemH;
          if (minuteWheelRef.current) minuteWheelRef.current.scrollTop = mins * itemH;
          if (ampmWheelRef.current) ampmWheelRef.current.scrollTop = (ampm === 'PM' ? 1 : 0) * itemH;
        }, 40);
      };

      const confirmTimeWheel = () => {
        let h24 = wheelHour12 % 12;
        if (wheelAmPm === 'PM') h24 += 12;
        const formatted24 = `${String(h24).padStart(2, '0')}:${String(wheelMinute).padStart(2, '0')}`;
        setCaptureTime24(formatted24);
        setShowTimeWheelModal(false);
      };

      const formatShortDate = (isoDate) => {
        if (!isoDate) return '';
        const parts = isoDate.split('-');
        if (parts.length < 3) return isoDate;
        return `${parts[2]}/${parts[1]}`;
      };

      const formatDateLabel = (isoDate) => {
        if (!isoDate) return '';
        try {
          const d = new Date(isoDate + 'T00:00:00');
          return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
        } catch {
          return isoDate;
        }
      };

      // Habits Date & Sliders
      const [lifestyleDate, setLifestyleDate] = useState(() => todayStr);
      const [lifestyleSleep, setLifestyleSleep] = useState(7.5);
      const [lifestyleStress, setLifestyleStress] = useState(2);
      const [lifestyleRestingHr, setLifestyleRestingHr] = useState(60);
      const [lifestyleHrv, setLifestyleHrv] = useState(58);
      const [lifestyleWater, setLifestyleWater] = useState(0);
      const [lifestyleSteps, setLifestyleSteps] = useState(0);
      const [lifestyleCaloriesBurned, setLifestyleCaloriesBurned] = useState(0);
      const [showHrGuide, setShowHrGuide] = useState(false);
      const [showHrvGuide, setShowHrvGuide] = useState(false);
      const [showStressGuide, setShowStressGuide] = useState(false);

      // Symptom Form State
      const [symptomTitle, setSymptomTitle] = useState('');
      const [symptomCategory, setSymptomCategory] = useState('headache');
      const [symptomSeverity, setSymptomSeverity] = useState(3);
      const [symptomNotes, setSymptomNotes] = useState('');

      // Stool Form State
      const [bristolType, setBristolType] = useState(4);
      const [stoolNotes, setStoolNotes] = useState('');

      // Exercise Form State
      const [exerciseTitle, setExerciseTitle] = useState('');
      const [workoutFocus, setWorkoutFocus] = useState('lifting_upper');
      const [workoutDuration, setWorkoutDuration] = useState(45);
      const [workoutIntensity, setWorkoutIntensity] = useState(7);
      const [workoutSteps, setWorkoutSteps] = useState(3500);
      const [workoutCaloriesBurned, setWorkoutCaloriesBurned] = useState(350);
      const [isEstimatingWorkoutAI, setIsEstimatingWorkoutAI] = useState(false);

      // Medication & Supplements State
      const [medName, setMedName] = useState('');
      const [medDose, setMedDose] = useState('');
      const [medReason, setMedReason] = useState('');

      // AI Report & Toast
      const [isAnalyzingAI, setIsAnalyzingAI] = useState(false);
      const [aiReport, setAiReport] = useState(null);
      const [toastMessage, setToastMessage] = useState('');

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3200);
      };

      // Automatic Apple Health URL Receiver (Processes ?sync_steps=... from iOS Shortcuts on open)
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const stepsParam = params.get('sync_steps') || params.get('steps');
          const burnParam = params.get('sync_burn') || params.get('burn');
          const hrvParam = params.get('sync_hrv') || params.get('hrv');
          const rhrParam = params.get('sync_rhr') || params.get('rhr');
          const sleepParam = params.get('sync_sleep') || params.get('sleep');
          const dateParam = params.get('sync_date') || getAustralianNow().dateStr;

          if (stepsParam !== null || burnParam !== null || hrvParam !== null || rhrParam !== null || sleepParam !== null) {
            const parsedSteps = stepsParam !== null ? Math.round(Number(stepsParam)) : null;
            const parsedBurn = burnParam !== null ? Math.round(Number(burnParam)) : null;
            const parsedHrv = hrvParam !== null ? Math.round(Number(hrvParam)) : null;
            const parsedRhr = rhrParam !== null ? Math.round(Number(rhrParam)) : null;
            const parsedSleep = sleepParam !== null ? Number(Number(sleepParam).toFixed(1)) : null;
            const liveTime = formatTime24To12Au(getAustralianNow().time24);

            setLogs(prev => {
              const existingIndex = prev.findIndex(l => l.date === dateParam && l.type === 'lifestyle');
              const updates = { timestamp: liveTime, source: 'Apple Health' };
              if (parsedSteps !== null && !isNaN(parsedSteps)) updates.steps = parsedSteps;
              if (parsedBurn !== null && !isNaN(parsedBurn)) updates.caloriesBurnedTotalKcal = parsedBurn;
              if (parsedHrv !== null && !isNaN(parsedHrv)) updates.hrvMs = parsedHrv;
              if (parsedRhr !== null && !isNaN(parsedRhr)) updates.restingHr = parsedRhr;
              if (parsedSleep !== null && !isNaN(parsedSleep)) updates.sleepHours = parsedSleep;

              if (existingIndex >= 0) {
                const updated = [...prev];
                updated[existingIndex] = { ...updated[existingIndex], ...updates };
                return updated;
              } else {
                return [{
                  id: 'life-' + Date.now(),
                  date: dateParam,
                  type: 'lifestyle',
                  ...updates
                }, ...prev];
              }
            });

            if (parsedSteps !== null && !isNaN(parsedSteps)) {
              setLifestyleSteps(parsedSteps);
            }

            const syncStamp = `${formatShortDate(dateParam)} ${liveTime}`;
            setLastHealthSync(syncStamp);
            localStorage.setItem('pulsehealth_last_health_sync', syncStamp);

            const cleanUrl = new URL(window.location.href);
            ['sync_steps', 'steps', 'sync_burn', 'burn', 'sync_hrv', 'hrv', 'sync_rhr', 'rhr', 'sync_sleep', 'sleep', 'sync_date'].forEach(k => cleanUrl.searchParams.delete(k));
            window.history.replaceState({}, document.title, cleanUrl.toString());

            setTimeout(() => {
              showToast(`Apple Health synced: ${parsedSteps !== null ? parsedSteps.toLocaleString() + ' steps' : 'Vitals updated'}!`);
            }, 300);
          }
        } catch (err) {
          console.error('Apple Health URL sync error:', err);
        }
      }, []);

      const getHealthSyncTemplateUrl = () => {
        const base = window.location.origin + window.location.pathname;
        return `${base}?sync_steps=`;
      };

      const handleCopyHealthSyncUrl = () => {
        const urlToCopy = getHealthSyncTemplateUrl();
        try {
          const textArea = document.createElement('textarea');
          textArea.value = urlToCopy;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
          showToast('Apple Health Sync URL copied!');
        } catch {
          showToast('Copy failed — select and copy the URL manually');
        }
      };

      const handleTriggerAppleHealthShortcut = () => {
        const cleanName = (shortcutName || 'Sync PulseHealth').trim();
        localStorage.setItem('pulsehealth_shortcut_name', cleanName);
        window.location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(cleanName)}`;
      };

      // Sync logs to localStorage
      useEffect(() => {
        try {
          localStorage.setItem('pulsehealth_logs', JSON.stringify(logs));
        } catch (e) {
          console.error('Failed saving logs', e);
        }
      }, [logs]);

      // Sync notification prefs
      useEffect(() => {
        try {
          localStorage.setItem('pulsehealth_notif_prefs', JSON.stringify(notifPrefs));
        } catch {}
      }, [notifPrefs]);

      // Compute accumulated Water, Active Burn, and Steps for any selected date from Meals & Workouts
      const existingLifestyleLog = useMemo(() => {
        return logs.find(l => l.date === lifestyleDate && l.type === 'lifestyle') || null;
      }, [logs, lifestyleDate]);

      const accumulatedForLifestyleDate = useMemo(() => {
        const dayLogs = logs.filter(l => l.date === lifestyleDate);
        const mealWater = dayLogs.filter(l => l.type === 'meal').reduce((acc, m) => acc + (Number(m.waterMl) || 0), 0);
        const workoutBurn = dayLogs.filter(l => l.type === 'exercise').reduce((acc, w) => acc + (Number(w.caloriesBurnedKcal) || 0), 0);
        const workoutStepsTotal = dayLogs.filter(l => l.type === 'exercise').reduce((acc, w) => acc + (Number(w.steps) || 0), 0);
        return {
          waterMl: mealWater,

      const handleAddSymptom = (e) => {

      const toggleMealTag = (tag) => {

      // Edit & Delete Handlers
      const handleDeleteLog = (id) => {

      const handleStartEdit = (item) => {

      const handleSaveEdit = (e) => {

        setLogs(prev => prev.map(item => item.id === editingItem.id ? editingItem : item));

      };

      // Daily Time Series Aggregation
      const dailyTimeSeries = useMemo(() => {
        const datesMap = {};

        logs.forEach(item => {
          const d = item.date;
          if (!datesMap[d]) {
            datesMap[d] = {
              date: d,
              caloriesConsumedKcal: 0,
              caloriesBurnedWorkoutKcal: 0,
              caloriesBurnedLifestyleKcal: 0,
              caloriesBurnedTotalKcal: 0,
              netCaloriesKcal: 0,
              mealWaterMl: 0,
              lifestyleWaterTotalMl: 0,
              waterMl: 0,
              proteinG: 0,
              carbsG: 0,
              sugarG: 0,
              sodiumMg: 0,
              symptomScore: 0,
              symptomCount: 0,
              maxSeverity: 0,
              bristolList: [],
              sleepHours: 0,
              stress: 0,
              restingHr: 0,
              hrvMs: 0,
              steps: 0,
              exerciseSteps: 0,
              lifestyleSteps: 0,
              workoutFocus: null,
              hasRushedMeal: false,
              hasLateNightMeal: false
            };
          }

          if (item.type === 'meal') {
            datesMap[d].caloriesConsumedKcal += (item.caloriesKcal || 0);
            datesMap[d].mealWaterMl += (item.waterMl || 0);
            datesMap[d].proteinG += (item.proteinG || 0);
            datesMap[d].carbsG += (item.carbsG || 0);
            datesMap[d].sugarG += (item.sugarG || 0);
            datesMap[d].sodiumMg += (item.sodiumMg || 0);
            if (item.eatingPace === 'rushed') datesMap[d].hasRushedMeal = true;
            if (item.isLateNight) datesMap[d].hasLateNightMeal = true;
          } else if (item.type === 'exercise') {
            datesMap[d].exerciseSteps += (item.steps || 0);
            datesMap[d].caloriesBurnedWorkoutKcal += (item.caloriesBurnedKcal || 0);
            datesMap[d].workoutFocus = item.workoutFocus;
          } else if (item.type === 'lifestyle') {
            if (typeof item.waterTotalMl === 'number') datesMap[d].lifestyleWaterTotalMl = Math.max(datesMap[d].lifestyleWaterTotalMl, item.waterTotalMl);
            if (typeof item.sleepHours === 'number') datesMap[d].sleepHours = item.sleepHours;
            if (typeof item.stressLevel === 'number') datesMap[d].stress = item.stressLevel;
            if (typeof item.restingHr === 'number') datesMap[d].restingHr = item.restingHr;
            if (typeof item.hrvMs === 'number') datesMap[d].hrvMs = item.hrvMs;
            if (typeof item.steps === 'number') datesMap[d].lifestyleSteps = Math.max(datesMap[d].lifestyleSteps, item.steps);
            if (typeof item.caloriesBurnedTotalKcal === 'number') datesMap[d].caloriesBurnedLifestyleKcal = Math.max(datesMap[d].caloriesBurnedLifestyleKcal, item.caloriesBurnedTotalKcal);
          } else if (item.type === 'symptom') {
            datesMap[d].symptomScore += (item.severity || 1);
            datesMap[d].symptomCount += 1;
            datesMap[d].maxSeverity = Math.max(datesMap[d].maxSeverity, item.severity || 1);
          } else if (item.type === 'stool') {
            datesMap[d].bristolList.push(item.bristolType);
          }
        });

        Object.values(datesMap).forEach(d => {
          d.waterMl = Math.max(d.mealWaterMl, d.lifestyleWaterTotalMl);
          d.steps = Math.max(d.exerciseSteps, d.lifestyleSteps);
          d.caloriesBurnedTotalKcal = Math.max(d.caloriesBurnedWorkoutKcal, d.caloriesBurnedLifestyleKcal);
          d.netCaloriesKcal = d.caloriesConsumedKcal - d.caloriesBurnedTotalKcal;
        });

        return Object.values(datesMap).sort((a, b) => a.date.localeCompare(b.date));
      }, [logs]);

      // Aggregated Time Series for Trends Charts
      const aggregatedTimeSeries = useMemo(() => {
        const rawSliced = dailyTimeSeries.slice(-analyticsDaysRange);
        let mode = analyticsAggregation;
        if (mode === 'auto') {
          if (analyticsDaysRange > 180) mode = 'monthly';
          else if (analyticsDaysRange >= 30) mode = 'weekly';
          else mode = 'daily';
        }

        if (mode === 'daily') {
          return rawSliced.map(d => ({
            ...d,
            label: formatShortDate(d.date),
            fullLabel: formatDateLabel(d.date)
          }));
        }

        const buckets = {};
        rawSliced.forEach(item => {
          let bucketKey = '';
          let bucketLabel = '';

          if (mode === 'weekly') {
            const dObj = new Date(item.date + 'T00:00:00');
            const day = dObj.getDay();
            const diff = dObj.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(dObj.setDate(diff));
            bucketKey = monday.toISOString().split('T')[0];
            bucketLabel = monday.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
          } else {
            const [y, m] = item.date.split('-');
            bucketKey = `${y}-${m}`;
            bucketLabel = new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-AU', { month: 'short', year: '2-digit' });
          }

          if (!buckets[bucketKey]) {
            buckets[bucketKey] = {
              date: bucketKey,
              label: bucketLabel,
              fullLabel: mode === 'weekly' ? `Week of ${bucketLabel}` : bucketLabel,
              daysCount: 0,
              caloriesConsumedSum: 0,
              caloriesBurnedSum: 0,
              waterSum: 0,
              stepsSum: 0,
              proteinSum: 0,
              sugarSum: 0,
              sodiumSum: 0,
              hrvSum: 0,
              hrvDays: 0,
              symptomScoreSum: 0,
              symptomCountSum: 0,
              maxSeverity: 0
            };
          }

          const b = buckets[bucketKey];
          b.daysCount += 1;
          b.caloriesConsumedSum += (item.caloriesConsumedKcal || 0);
          b.caloriesBurnedSum += (item.caloriesBurnedTotalKcal || 0);
          b.waterSum += (item.waterMl || 0);
          b.stepsSum += (item.steps || 0);
          b.proteinSum += (item.proteinG || 0);
          b.sugarSum += (item.sugarG || 0);
          b.sodiumSum += (item.sodiumMg || 0);
          if (item.hrvMs > 0) { b.hrvSum += item.hrvMs; b.hrvDays += 1; }
          b.symptomScoreSum += (item.symptomScore || 0);
          b.symptomCountSum += (item.symptomCount || 0);
          b.maxSeverity = Math.max(b.maxSeverity, item.maxSeverity || 0);
        });

        return Object.values(buckets).map(b => {
          const avgConsumed = Math.round(b.caloriesConsumedSum / (b.daysCount || 1));
          const avgBurned = Math.round(b.caloriesBurnedSum / (b.daysCount || 1));
          return {
            date: b.date,
            label: b.label,
            fullLabel: b.fullLabel,
            caloriesConsumedKcal: avgConsumed,
            caloriesBurnedTotalKcal: avgBurned,
            netCaloriesKcal: avgConsumed - avgBurned,
            waterMl: Math.round(b.waterSum / (b.daysCount || 1)),
            steps: Math.round(b.stepsSum / (b.daysCount || 1)),
            proteinG: Math.round(b.proteinSum / (b.daysCount || 1)),
            sugarG: Math.round(b.sugarSum / (b.daysCount || 1)),
            sodiumMg: Math.round(b.sodiumSum / (b.daysCount || 1)),
            hrvMs: b.hrvDays > 0 ? Math.round(b.hrvSum / b.hrvDays) : 0,
            symptomScore: Math.round((b.symptomScoreSum / (b.daysCount || 1)) * 10) / 10,
            symptomCount: b.symptomCountSum,
            maxSeverity: b.maxSeverity,
            isAggregated: true
          };
        }).sort((a, b) => a.date.localeCompare(b.date));
      }, [dailyTimeSeries, analyticsDaysRange, analyticsAggregation]);

      // Summary Metrics
      const summaryMetrics = useMemo(() => {
        if (aggregatedTimeSeries.length === 0) {
          return { avgNetCalories: 0, avgWaterL: '0.0', avgProteinG: 0, symptomFreeDaysPct: 100 };
        }
        const totalConsumed = aggregatedTimeSeries.reduce((acc, d) => acc + (d.caloriesConsumedKcal || 0), 0);
        const totalBurned = aggregatedTimeSeries.reduce((acc, d) => acc + (d.caloriesBurnedTotalKcal || 0), 0);
        const totalWater = aggregatedTimeSeries.reduce((acc, d) => acc + d.waterMl, 0);
        const totalProtein = aggregatedTimeSeries.reduce((acc, d) => acc + d.proteinG, 0);
        const symptomFreeDays = aggregatedTimeSeries.filter(d => d.symptomCount === 0).length;

        const avgConsumed = Math.round(totalConsumed / aggregatedTimeSeries.length);
        const avgBurned = Math.round(totalBurned / aggregatedTimeSeries.length);

        return {
          avgNetCalories: avgConsumed - avgBurned,
          avgWaterL: (totalWater / aggregatedTimeSeries.length / 1000).toFixed(1),
          avgProteinG: Math.round(totalProtein / aggregatedTimeSeries.length),
          symptomFreeDaysPct: Math.round((symptomFreeDays / aggregatedTimeSeries.length) * 100)
        };
      }, [aggregatedTimeSeries]);

      // Today's Header Aggregate
      const todayAggregate = useMemo(() => {
        const found = dailyTimeSeries.find(d => d.date === todayStr);
        return found || {
          caloriesConsumedKcal: 0,
          caloriesBurnedTotalKcal: 0,
          netCaloriesKcal: 0,
          waterMl: 0,
          steps: 0,
          hrvMs: 0
        };
      }, [dailyTimeSeries, todayStr]);

      // Filtered Timeline (Sorted newest date & time first)
      const filteredTimelineLogs = useMemo(() => {
        const list = timelineFilter === 'all' ? [...logs] : logs.filter(item => item.type === timelineFilter);
        return list.sort((a, b) => {
          const dateCmp = (b.date || '').localeCompare(a.date || '');
          if (dateCmp !== 0) return dateCmp;
          const tA = parseTime12To24(a.timestamp);
          const tB = parseTime12To24(b.timestamp);
          return tB.localeCompare(tA);
        });
      }, [logs, timelineFilter]);

      // CSV Export: Timeline
      const handleExportTimelineCSV = () => {
        if (filteredTimelineLogs.length === 0) {
          showToast('No timeline entries to export');
          return;
        }
        const headers = [
          'Date', 'Timestamp', 'Category', 'Title / Name', 'Energy Intake (kcal)', 'Energy Burned (kcal)',
          'Protein (g)', 'Carbs (g)', 'Sugar (g)', 'Sodium (mg)', 'Fluid / Water (ml)', 'Steps',
          'Workout Duration (mins)', 'Workout RPE', 'Flare Severity (1-5)', 'Bristol Stool Type',
          'Sleep (hrs)', 'Overnight HRV (ms)', 'Resting HR (bpm)', 'Stress (1-5)', 'Dosage', 'Tags', 'Notes'
        ];
        const escapeCell = (val) => {
          if (val === undefined || val === null) return '';
          const str = String(val).replace(/"/g, '""');
          return /[",\n]/.test(str) ? `"${str}"` : str;
        };
        const rows = filteredTimelineLogs.map(item => [
          item.date,
          item.timestamp,
          item.type,
          item.title || item.name || 'Habits Check-in',
          item.caloriesKcal ?? '',
          item.caloriesBurnedKcal ?? item.caloriesBurnedTotalKcal ?? '',
          item.proteinG ?? '',
          item.carbsG ?? '',
          item.sugarG ?? '',
          item.sodiumMg ?? '',
          item.waterMl ?? item.waterTotalMl ?? '',
          item.steps ?? '',
          item.durationMins ?? '',
          item.intensity ?? '',
          item.severity ?? '',
          item.bristolType ?? '',
          item.sleepHours ?? '',
          item.hrvMs ?? '',
          item.restingHr ?? '',
          item.stressLevel ?? '',
          item.dose ?? '',
          Array.isArray(item.tags) ? item.tags.join('; ') : '',
          item.notes ?? item.reason ?? ''
        ].map(escapeCell).join(','));

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `pulsehealth_timeline_${timelineFilter}_${todayStr}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showToast('Timeline exported to CSV!');
      };

      // CSV Export: Trends
      const handleExportTrendsCSV = () => {
        if (aggregatedTimeSeries.length === 0) {
          showToast('No trend data to export');
          return;
        }
        const headers = [
          'Date / Period', 'Calories Intake (kcal)', 'Energy Burned (kcal)', 'Net Energy (kcal)', 'Net Energy (kJ)',
          'Water Intake (L)', 'Steps', 'Protein (g)', 'Carbs (g)', 'Sugar (g)', 'Sodium (mg)',
          'Overnight HRV (ms)', 'Sleep (hrs)', 'Stress (1-5)', 'Flare Severity Score', 'Flare Count', 'Bristol Stool Types'
        ];
        const escapeCell = (val) => {
          if (val === undefined || val === null) return '';
          const str = String(val).replace(/"/g, '""');
          return /[",\n]/.test(str) ? `"${str}"` : str;
        };
        const rows = aggregatedTimeSeries.map(d => [
          d.fullLabel || d.date,

          d.caloriesBurnedTotalKcal || 0,

          d.carbsG || 0,
          d.sugarG || 0,

          d.symptomCount || 0,
          Array.isArray(d.bristolList) ? d.bristolList.join('; ') : ''
        ].map(escapeCell).join(','));

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `pulsehealth_trends_${todayStr}.csv`;

      // AI Correlation Analysis
      const runAICorrelationAnalysis = async () => {
        if (logs.length === 0) {
          showToast('Log some meals, habits, or flares first!');
          return;
        }
        setIsAnalyzingAI(true);
        showToast('Running longitudinal correlation analysis...');

        try {
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          const payload = {
            contents: [{ parts: [{ text: `Analyze this health log dataset and return JSON with title, totalDaysAnalyzed, leadHypothesis, correlations (trigger, symptom, confidence, frequency, lagTime, evidenceType, explanation), protectiveFactors, actionableAdvice:\n${JSON.stringify(dailyTimeSeries)}` }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  title: { type: "STRING" },
                  totalDaysAnalyzed: { type: "NUMBER" },
                  leadHypothesis: { type: "STRING" },
                  correlations: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        trigger: { type: "STRING" },
                        symptom: { type: "STRING" },
                        confidence: { type: "STRING" },
                        frequency: { type: "STRING" },
                        lagTime: { type: "STRING" },
                        evidenceType: { type: "STRING" },
                        explanation: { type: "STRING" }
                      },
                      required: ["trigger", "symptom", "confidence", "frequency", "lagTime", "evidenceType", "explanation"]
                    }
                  },
                  protectiveFactors: { type: "ARRAY", items: { type: "STRING" } },
                  actionableAdvice: { type: "ARRAY", items: { type: "STRING" } }
                },
                required: ["title", "totalDaysAnalyzed", "leadHypothesis", "correlations", "protectiveFactors", "actionableAdvice"]
              }
            }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawText) {
            setAiReport(JSON.parse(rawText));
            showToast('AI Correlation analysis complete!');
          } else {
            throw new Error('Fallback');
          }
        } catch {
          setAiReport({
            title: "Longitudinal Biometric & Cross-Day Synthesis",
            totalDaysAnalyzed: dailyTimeSeries.length,
            leadHypothesis: `Across ${dailyTimeSeries.length} tracked day(s) and ${logs.length} total logged events, your baseline energy balance, hydration volume, and supplement timing are actively being cross-referenced against symptom onset.`,
            correlations: [
              {
                trigger: "Hydration & Electrolyte Balance",
                symptom: "Afternoon Energy & Headache Risk",
                confidence: "Primary Baseline Factor",
                frequency: `${dailyTimeSeries.filter(d => d.waterMl < targetWaterMl).length} of ${dailyTimeSeries.length} days below target`,
                lagTime: "3.0 – 5.0 Hours",
                evidenceType: "Fluid Volume & Osmolarity",
                explanation: "Maintaining fluid intake at or above your daily target protects against exercise-induced headaches and supports smooth digestive motility."
              }
            ],
            protectiveFactors: [
              `Daily water target set to ${(targetWaterMl / 1000).toFixed(1)}L and step target set to ${targetSteps.toLocaleString()}.`,
              "Logging supplements alongside meals isolates osmotic effects (like magnesium) from food sensitivities."
            ],
            actionableAdvice: [
              "Continue logging meals, water, and any flares consistently for 5–7 days to unlock high-confidence statistical lag correlations."
            ]
          });
          showToast('Diagnostic summary compiled!');
        } finally {
          setIsAnalyzingAI(false);
        }
      };

      // Save Goals & Profile
      const saveGoals = () => {
        setTargetSteps(Number(tempSteps));
        setTargetWaterMl(Math.round(Number(tempWaterL) * 1000));
        setUserWeightKg(Number(tempWeightKg));
        try {
          localStorage.setItem('pulsehealth_target_steps', String(tempSteps));
          localStorage.setItem('pulsehealth_target_water', String(Math.round(Number(tempWaterL) * 1000)));
          localStorage.setItem('pulsehealth_user_weight', String(tempWeightKg));
        } catch {}
        setShowGoalsModal(false);
        showToast('Daily goals & profile saved!');
      };

      // Request Push Notification Permission
      const handleEnableNotifications = async () => {
        if (typeof Notification === 'undefined') {
          showToast('Notifications not supported in this browser');
          return;
        }
        try {
          const res = await Notification.requestPermission();
          setNotifPermission(res);
          if (res === 'granted') {
            showToast('Push notifications enabled!');
            new Notification('PulseHealth Alerts Active', {
              body: 'Your daily habit and hydration reminders are now active.'
            });
          } else {
            showToast('Notification permission denied in browser settings');
          }
        } catch {
          showToast('Enable notifications in iOS Safari Settings');
        }
      };

      const handleTestNotification = () => {
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          new Notification('PulseHealth Reminder', {
            body: 'Check-in: Log your evening habits and daily water intake!'
          });
          showToast('Test notification sent!');
        } else {
          showToast('Please enable notifications first');
        }
      };

      // GitHub Update Checker
      const handleCheckGithubUpdate = async () => {
        const cleanRepo = githubRepo
          .trim()
          .replace(/^https?:\/\/github\.com\//i, '')
          .replace(/\.git$/i, '')
          .replace(/\/+$/, '');

        if (!cleanRepo || !cleanRepo.includes('/')) {
          showToast('Enter username/repository (e.g. johnsmith/pulsehealth)');
          return;
        }

        localStorage.setItem('pulsehealth_github_repo', cleanRepo);
        setGithubRepo(cleanRepo);
        setIsCheckingUpdate(true);
        setUpdateStatus(null);

        try {
          const res = await fetch(`https://api.github.com/repos/${cleanRepo}/commits?per_page=1&_t=${Date.now()}`, {
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Repository not found or private');
          const commits = await res.json();
          const latest = commits?.[0];
          if (!latest) throw new Error('No commits found');

          const remoteSha = latest.sha.slice(0, 7);
          const localSha = localStorage.getItem('pulsehealth_deployed_sha');
          const commitMsg = latest.commit?.message?.split('\n')[0] || 'Latest deployment';
          const commitDate = latest.commit?.author?.date
            ? new Date(latest.commit.author.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
            : '';

          if (!localSha || localSha !== remoteSha) {
            setUpdateStatus({
              hasUpdate: true,
              remoteSha,
              remoteDate: commitDate,
              message: commitMsg
            });
          } else {
            setUpdateStatus({
              hasUpdate: false,
              remoteSha,
              remoteDate: commitDate,
              message: 'You are running the latest GitHub deployment.'
            });
          }
        } catch (err) {
          setUpdateStatus({
            hasUpdate: false,
            error: true,
            message: 'Could not reach repository. Ensure it is public and formatted as username/repo.'
          });
        } finally {
          setIsCheckingUpdate(false);
        }
      };

      const handleApplyGithubUpdate = () => {
        if (updateStatus?.remoteSha) {
          localStorage.setItem('pulsehealth_deployed_sha', updateStatus.remoteSha);
        }
        const url = new URL(window.location.href);
        url.searchParams.set('v', Date.now().toString());
        window.location.replace(url.toString());
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-28 max-w-md mx-auto relative shadow-2xl selection:bg-indigo-500 selection:text-white border-x border-slate-900">

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-indigo-600 text-white px-4 py-2 rounded-full shadow-lg text-xs font-semibold flex items-center space-x-2">
              <Icon name="Sparkles" className="w-3.5 h-3.5 text-indigo-200" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* iOS App Header */}
          <header className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md px-4 pt-safe pb-3 border-b border-slate-900/90">
            <div className="flex items-center justify-between pt-2">
              <div className="flex items-center space-x-2.5">
                <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/25">
                  <Icon name="Activity" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
                    PulseHealth
                    <span className="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded-md bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                      AI
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400 font-medium">Symptom & Trigger Correlation</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                {/* Daily Goals & Targets Button */}
                <button
                  type="button"
                  onClick={() => {
                    setTempSteps(targetSteps);
                    setTempWaterL((targetWaterMl / 1000).toFixed(1));
                    setTempWeightKg(userWeightKg);
                    setShowGoalsModal(true);
                  }}
                  className="p-2 rounded-2xl bg-slate-900 border border-slate-800 text-emerald-400 hover:text-emerald-300 transition active:scale-95"
                  title="Daily Goals & Targets"
                >
                  <Icon name="Target" className="w-4 h-4" />
                </button>

                {/* App Settings, Notifications & GitHub Updates Button */}
                <button
                  type="button"
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 rounded-2xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition active:scale-95"
                  title="Notifications & App Settings"
                >
                  <Icon name="Settings" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Live Vitals Header Pill */}
            <div className="mt-3 grid grid-cols-4 gap-1.5 bg-slate-900/90 p-2 rounded-2xl border border-slate-800 text-[10px]">
              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Droplets" className="w-3 h-3 text-cyan-400 mr-0.5" /> Water
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {((todayAggregate.waterMl || 0) / 1000).toFixed(1)}L
                </span>
              </div>

              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Activity" className="w-3 h-3 text-emerald-400 mr-0.5" /> Steps
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {(todayAggregate.steps || 0).toLocaleString()}
                </span>
              </div>

              <div className="flex flex-col items-center justify-center border-r border-slate-800/80">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Heart" className="w-3 h-3 text-rose-400 mr-0.5" /> HRV
                </span>
                <span className="font-mono font-bold text-slate-200 mt-0.5">
                  {todayAggregate.hrvMs ? `${todayAggregate.hrvMs}ms` : '--'}
                </span>
              </div>

              <div className="flex flex-col items-center justify-center">
                <span className="text-[9.5px] text-slate-400 flex items-center font-medium">
                  <Icon name="Flame" className="w-3 h-3 text-amber-400 mr-0.5" /> Net Cal
                </span>
                <span className={`font-mono font-bold mt-0.5 ${todayAggregate.netCaloriesKcal >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                  {todayAggregate.netCaloriesKcal > 0 ? `+${todayAggregate.netCaloriesKcal}` : todayAggregate.netCaloriesKcal}
                </span>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="p-4 space-y-4">

            {/* ================= VIEW 1: CAPTURE ================= */}
            {activeTab === 'add' && (
              <div className="space-y-4">
                {/* Category Selector */}
                <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[11px]">
                  {[
                    { id: 'meal', label: 'Meal', icon: 'Utensils', iconColor: 'text-indigo-400', activeBg: 'bg-indigo-600' },
                    { id: 'symptom', label: 'Flare', icon: 'AlertCircle', iconColor: 'text-rose-400', activeBg: 'bg-rose-600' },
                    { id: 'stool', label: 'Bowel', icon: 'FileText', iconColor: 'text-amber-400', activeBg: 'bg-amber-600' },
                    { id: 'exercise', label: 'Workout', icon: 'Flame', iconColor: 'text-emerald-400', activeBg: 'bg-emerald-600' },
                    { id: 'lifestyle', label: 'Habits', icon: 'Moon', iconColor: 'text-violet-400', activeBg: 'bg-violet-600' },
                    { id: 'medication', label: 'Meds & Sups', icon: 'ShieldCheck', iconColor: 'text-teal-400', activeBg: 'bg-teal-600' }
                  ].map(item => {
                    const isActive = addMode === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setAddMode(item.id)}
                        className={`flex flex-col items-center py-2 px-1 rounded-xl font-semibold transition-all ${
                          isActive
                            ? `${item.activeBg} text-white shadow-sm`
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40'
                        }`}
                      >
                        <Icon name={item.icon} className={`w-3.5 h-3.5 mb-1 ${isActive ? 'text-white' : item.iconColor}`} />
                        <span className="text-[10px] truncate">{item.label}</span>
                      </button>
                    );
                  })}
                </div>

                {/* AEST/AEDT DATE & TIME BAR FOR MEAL, FLARE, BOWEL, WORKOUT & MEDS */}
                {addMode !== 'lifestyle' && (
                  <div className="bg-slate-900/90 p-2.5 rounded-2xl border border-slate-800 flex items-center justify-between gap-2">
                    <div className="flex items-center space-x-1.5 shrink-0">
                      <Icon name="Clock" className="w-3.5 h-3.5 text-indigo-400" />
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                        AEST/AEDT
                      </span>
                    </div>

                    <div className="flex items-center gap-1.5 flex-1 justify-end">
                      {/* Calendar Pop-up Trigger */}
                      <button
                        type="button"
                        onClick={openDatePicker}
                        className="bg-slate-950 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500/50 rounded-xl px-2.5 py-1.5 text-[11px] font-mono text-slate-100 flex items-center space-x-1.5 transition active:scale-95"
                        title="Open Calendar"
                      >
                        <Icon name="Calendar" className="w-3.5 h-3.5 text-indigo-400" />
                        <span>{captureDate === todayStr ? `Today (${formatShortDate(captureDate)})` : formatShortDate(captureDate)}</span>
                      </button>

                      {/* iOS Time Wheel Pop-up Trigger */}
                      <button
                        type="button"
                        onClick={openTimeWheel}
                        className="bg-slate-950 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500/50 rounded-xl px-2.5 py-1.5 text-[11px] font-mono text-slate-100 flex items-center space-x-1.5 transition active:scale-95 uppercase"
                        title="Open Time Wheel"
                      >
                        <Icon name="Clock" className="w-3.5 h-3.5 text-emerald-400" />
                        <span>{formatTime24To12Au(captureTime24)}</span>
                      </button>

                      <button
                        type="button"
                        onClick={syncCaptureToNow}
                        className="px-2 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-[10px] font-bold transition shrink-0"
                        title="Reset to current AEST/AEDT time"
                      >
                        Now
                      </button>
                    </div>
                  </div>
                )}

                {/* MEAL FORM */}
                {addMode === 'meal' && (
                  <form onSubmit={handleAddMeal} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="Utensils" className="w-4 h-4 mr-2 text-indigo-400" />
                        Log Food & Drink
                      </h2>

                      <div className="flex items-center space-x-1.5">
                        <button
                          type="button"
                          onClick={resetMealForm}
                          className="px-2.5 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 hover:text-white text-[11px] font-medium transition active:scale-95"
                        >
                          Clear
                        </button>

                        <button
                          type="button"
                          onClick={startBarcodeCamera}
                          className="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 text-xs font-semibold hover:bg-emerald-600/30 transition active:scale-95"
                        >
                          <Icon name="Barcode" className="w-3.5 h-3.5" />
                          <span>Barcode</span>
                        </button>

                        <button
                          type="button"
                          onClick={handleSimulatePhotoAnalyze}
                          disabled={isAnalyzingPhoto}
                          className="flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 text-xs font-semibold hover:bg-indigo-600/30 transition disabled:opacity-50"
                        >
                          <Icon name="Camera" className="w-3.5 h-3.5" />
                          <span>{isAnalyzingPhoto ? 'Scanning...' : 'Plate'}</span>
                        </button>
                      </div>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">
                          Meal Description
                        </label>
                        <button
                          type="button"
                          onClick={handleEstimateMealWithAI}
                          disabled={isEstimatingMealAI || !mealTitle.trim()}
                          className="text-xs px-2.5 py-1 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/40 text-indigo-200 hover:text-white font-semibold transition disabled:opacity-40 flex items-center space-x-1"
                        >
                          <Icon name="Sparkles" className={`w-3.5 h-3.5 text-indigo-300 ${isEstimatingMealAI ? 'animate-spin' : ''}`} />
                          <span>{isEstimatingMealAI ? 'Calculating...' : 'Estimate with AI'}</span>
                        </button>
                      </div>
                      <input
                        type="text"
                        value={mealTitle}
                        onChange={(e) => setMealTitle(e.target.value)}
                        placeholder="e.g. Scrambled eggs, sourdough & black coffee"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500"
                        required
                      />
                    </div>

                    {/* Energy Intake */}
                    <div className="bg-slate-950/90 p-3 rounded-2xl border border-amber-500/30">
                      <div className="flex justify-between items-center text-xs font-semibold text-slate-200 mb-1">
                        <span className="flex items-center text-amber-400">
                          <Icon name="Flame" className="w-3.5 h-3.5 mr-1 text-amber-400" /> Energy Intake
                        </span>
                        <span className="font-mono text-amber-400 font-bold text-sm">
                          {mealCalories} kcal <span className="text-[10px] text-amber-300/80 font-normal">({Math.round(mealCalories * 4.184)} kJ)</span>
                        </span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="2000"
                        step="25"
                        value={mealCalories}
                        onChange={(e) => setMealCalories(Number(e.target.value))}
                        className="w-full accent-amber-500 cursor-pointer"
                      />
                    </div>

                    {/* Dietary Tags */}
                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5">
                        Dietary Factors & Intolerances
                      </label>
                      <div className="flex flex-wrap gap-1.5">
                        {[
                          { id: 'dairy', label: 'Dairy / Lactose' },
                          { id: 'gluten', label: 'Gluten' },
                          { id: 'caffeine', label: 'Caffeine' },
                          { id: 'alcohol', label: 'Alcohol' },
                          { id: 'spicy', label: 'Spicy' },
                          { id: 'fried', label: 'Greasy / Fried' },
                          { id: 'sugar', label: 'High Sugar' }
                        ].map(tag => {
                          const selected = mealTags.includes(tag.id);
                          return (
                            <button
                              type="button"
                              key={tag.id}
                              onClick={() => toggleMealTag(tag.id)}
                              className={`text-xs px-2.5 py-1.5 rounded-xl font-medium transition ${
                                selected
                                  ? 'bg-indigo-600 text-white font-semibold shadow-sm'
                                  : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                              }`}
                            >
                              #{tag.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Macros */}
                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Protein</span>
                          <span className="font-mono text-indigo-400 font-bold">{mealProtein}g</span>
                        </div>
                        <input type="range" min="0" max="100" step="5" value={mealProtein} onChange={(e) => setMealProtein(Number(e.target.value))} className="w-full accent-indigo-500 cursor-pointer" />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Carbs</span>
                          <span className="font-mono text-amber-400 font-bold">{mealCarbs}g</span>
                        </div>
                        <input type="range" min="0" max="150" step="5" value={mealCarbs} onChange={(e) => setMealCarbs(Number(e.target.value))} className="w-full accent-amber-500 cursor-pointer" />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Sugar</span>
                          <span className="font-mono text-pink-400 font-bold">{mealSugar}g</span>
                        </div>
                        <input type="range" min="0" max="80" step="2" value={mealSugar} onChange={(e) => setMealSugar(Number(e.target.value))} className="w-full accent-pink-500 cursor-pointer" />
                      </div>

                      <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                        <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                          <span>Sodium</span>
                          <span className="font-mono text-purple-400 font-bold">{mealSodium}mg</span>
                        </div>
                        <input type="range" min="0" max="3000" step="50" value={mealSodium} onChange={(e) => setMealSodium(Number(e.target.value))} className="w-full accent-purple-500 cursor-pointer" />
                      </div>
                    </div>

                    {/* Fluid with Meal */}
                    <div className="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/80">
                      <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1">
                        <span className="flex items-center">
                          <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400 mr-1" /> Fluid with Meal
                        </span>
                        <span className="font-mono text-cyan-400 font-bold">{mealWater} ml</span>
                      </div>
                      <input type="range" min="0" max="1000" step="50" value={mealWater} onChange={(e) => setMealWater(Number(e.target.value))} className="w-full accent-cyan-400 cursor-pointer" />
                    </div>

                    {/* Pace, Posture & Late Night */}
                    <div className="space-y-2.5 pt-2 border-t border-slate-800">
                      <div className="flex items-center justify-between text-xs">
                        <span className="text-slate-400 font-medium">Eating Pace</span>
                        <div className="flex gap-1.5">
                          {[
                            { id: 'relaxed', label: '🧘 Relaxed' },
                            { id: 'rushed', label: '⚡ Rushed (<10m)' }
                          ].map(p => (
                            <button
                              type="button"
                              key={p.id}
                              onClick={() => setMealPace(p.id)}
                              className={`px-3 py-1.5 rounded-xl font-medium text-[11px] transition ${
                                mealPace === p.id ? 'bg-indigo-600 text-white font-bold shadow-sm' : 'bg-slate-950 text-slate-400 border border-slate-800'
                              }`}
                            >
                              {p.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs">
                        <span className="text-slate-400 font-medium">Posture</span>
                        <div className="flex gap-1.5">
                          {[
                            { id: 'table', label: '🍽️ Table' },
                            { id: 'desk', label: '💻 Desk' },
                            { id: 'standing', label: '🚶 Moving' }
                          ].map(pos => (
                            <button
                              type="button"
                              key={pos.id}
                              onClick={() => setMealPosture(pos.id)}
                              className={`px-2.5 py-1.5 rounded-xl font-medium text-[11px] transition ${
                                mealPosture === pos.id ? 'bg-indigo-600 text-white font-bold shadow-sm' : 'bg-slate-950 text-slate-400 border border-slate-800'
                              }`}
                            >
                              {pos.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="bg-slate-950/90 p-3 rounded-2xl border border-slate-800 flex items-center justify-between">
                        <div>
                          <span className="text-xs font-bold text-slate-200 block">Late-Night Meal?</span>
                          <span className="text-[10px] text-slate-400">Within 2 hours of bedtime</span>
                        </div>
                        <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                          <button type="button" onClick={() => setIsLateNight(false)} className={`px-3 py-1 rounded-lg font-bold transition ${!isLateNight ? 'bg-slate-800 text-slate-200' : 'text-slate-500'}`}>No</button>
                          <button type="button" onClick={() => setIsLateNight(true)} className={`px-3 py-1 rounded-lg font-bold transition ${isLateNight ? 'bg-amber-500 text-slate-950' : 'text-slate-500'}`}>🌙 Yes</button>
                        </div>
                      </div>
                    </div>

                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-1.5">
                      <Icon name="Plus" className="w-4 h-4" />
                      <span>Log Meal & Track Calories</span>
                    </button>
                  </form>
                )}

                {/* SYMPTOM / FLARE FORM */}
                {addMode === 'symptom' && (
                  <form onSubmit={handleAddSymptom} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="AlertCircle" className="w-4 h-4 mr-2 text-rose-400" />
                      Record Flare or Discomfort
                    </h2>

                    <div className="grid grid-cols-2 gap-1.5">
                      {[
                        { id: 'headache', label: 'Headache / Migraine' },
                        { id: 'bloating', label: 'Bloating & Distension' },
                        { id: 'sore_stomach', label: 'Sore Stomach / Cramps' },
                        { id: 'brain_fog', label: 'Brain Fog / Slump' },
                        { id: 'acid_reflux', label: 'Acid Reflux / Heartburn' },
                        { id: 'palpitations', label: 'Palpitations / Racing HR' },
                        { id: 'skin_flare', label: 'Skin Flare / Itch' },
                        { id: 'joint_pain', label: 'Joint / Neck Pain' },
                        { id: 'postprandial_fatigue', label: 'Food Coma / Fatigue' },
                        { id: 'nausea', label: 'Nausea / Queasiness' }
                      ].map(item => (
                        <button
                          type="button"
                          key={item.id}
                          onClick={() => {
                            setSymptomCategory(item.id);
                            if (!symptomTitle) setSymptomTitle(item.label);
                          }}
                          className={`text-xs p-2.5 rounded-2xl text-left font-medium transition ${
                            symptomCategory === item.id
                              ? 'bg-rose-600/20 border border-rose-500 text-rose-300 font-bold'
                              : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Specific Description
                      </label>
                      <input
                        type="text"
                        value={symptomTitle}
                        onChange={(e) => setSymptomTitle(e.target.value)}
                        placeholder="e.g. Throbbing right temple, stomach gurgling"
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500"
                        required
                      />
                    </div>

                    <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800/80">
                      <div className="flex justify-between text-xs font-semibold text-slate-300 mb-1.5">
                        <span>Severity Rating</span>
                        <span className="font-mono text-rose-400 font-bold">{symptomSeverity} / 5</span>
                      </div>
                      <div className="flex justify-between gap-1.5">
                        {[1, 2, 3, 4, 5].map(lvl => (
                          <button
                            type="button"
                            key={lvl}
                            onClick={() => setSymptomSeverity(lvl)}
                            className={`flex-1 py-2 rounded-xl font-bold text-xs transition ${
                              symptomSeverity === lvl ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-900 text-slate-400 border border-slate-800'
                            }`}
                          >
                            {lvl}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Notes & Suspicions
                      </label>
                      <textarea
                        value={symptomNotes}
                        onChange={(e) => setSymptomNotes(e.target.value)}
                        placeholder="Did this start after a specific meal, supplement, or workout?"
                        rows={2}
                        className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <button type="submit" className="w-full py-3.5 rounded-2xl bg-rose-600 hover:bg-rose-500 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-rose-600/30 transition flex items-center justify-center space-x-1.5">
                      <Icon name="AlertCircle" className="w-4 h-4" />
                      <span>Record Flare</span>
                    </button>
                  </form>
                )}

                {/* BOWEL / BRISTOL STOOL FORM */}
                {addMode === 'stool' && (
                  <form onSubmit={handleAddStool} className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <h2 className="text-sm font-bold text-white flex items-center">
                      <Icon name="FileText" className="w-4 h-4 mr-2 text-amber-400" />
                      Bristol Stool Chart Log
                    </h2>

                    <div className="grid grid-cols-1 gap-1.5 text-xs">
                      {[
                        { type: 1, label: 'Type 1: Hard lumps / pellets (Severe Constipation)', color: 'text-rose-400' },
                        { type: 2, label: 'Type 2: Lumpy sausage (Mild Constipation)', color: 'text-amber-400' },
                        { type: 3, label: 'Type 3: Sausage with cracks (Normal)', color: 'text-emerald-400' },
                        { type: 4, label: 'Type 4: Smooth, soft snake (Optimal / Ideal)', color: 'text-emerald-400 font-bold' },
                        { type: 5, label: 'Type 5: Soft blobs with clear edges (Low Fiber)', color: 'text-amber-400' },
                        { type: 6, label: 'Type 6: Fluffy pieces, ragged edges (Mild Diarrhea)', color: 'text-rose-400' },
                        { type: 7, label: 'Type 7: Entirely liquid (Severe Diarrhea)', color: 'text-rose-400' }
                      ].map(item => (
                        <button
                          type="button"
                          key={item.type}
                          onClick={() => setBristolType(item.type)}
