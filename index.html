                              <span className="text-[9px] text-slate-500 block">{formatShortDate(item.date)}</span>
                            </div>
                          </div>

                          {/* Edit & Delete Action Row */}
                          <div className="flex items-center justify-end space-x-1.5 pt-1.5 border-t border-slate-800/60">
                            <button
                              type="button"
                              onClick={() => setEditingItem(JSON.parse(JSON.stringify(item)))}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-indigo-300 text-[10px] font-medium transition flex items-center space-x-1"
                              title="Edit this entry"
                            >
                              <Icon name="Edit2" className="w-3 h-3 text-indigo-400" />
                              <span>Edit</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => setDeletingItemId(item.id)}
                              className="px-2.5 py-1 rounded-xl bg-slate-950 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-800/60 text-slate-400 hover:text-rose-300 text-[10px] font-medium transition flex items-center space-x-1"
                              title="Delete this entry"
                            >
                              <Icon name="Trash2" className="w-3 h-3 text-rose-400" />
                              <span>Delete</span>
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* VIEW 3: TRENDS / ANALYTICS */}
            {activeTab === 'analytics' && (
              <div className="space-y-4 animate-in fade-in duration-150">
                
                {/* Header with Multi-Year / Multi-Month Range Selector */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-sm font-bold text-white flex items-center">
                        <Icon name="BarChart2" className="w-4 h-4 mr-1.5 text-indigo-400" />
                        Biometrics & Trends
                      </h2>
                      <p className="text-[10px] text-slate-400">Track longitudinal patterns across days and months</p>
                    </div>

                    <div className="flex bg-slate-900 p-0.5 rounded-xl border border-slate-800 text-[10px]">
                      {[
                        { days: 7, label: '7D' },
                        { days: 14, label: '14D' },
                        { days: 30, label: '1M' },
                        { days: 90, label: '3M' },
                        { days: 180, label: '6M' },
                        { days: 365, label: '1Y' }
                      ].map(item => (
                        <button
                          key={item.days}
                          onClick={() => setAnalyticsDaysRange(item.days)}
                          className={`px-2 py-1 rounded-lg font-semibold transition-all ${
                            analyticsDaysRange === item.days 
                              ? 'bg-indigo-600 text-white shadow-sm' 
                              : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Dynamic Aggregation Indicator & Manual Switcher */}
                  <div className="flex items-center justify-between bg-slate-900/60 px-3 py-1.5 rounded-xl border border-slate-800/80 text-[10px] text-slate-400">
                    <span className="flex items-center">
                      <Icon name="Calendar" className="w-3 h-3 mr-1.5 text-indigo-400" />
                      Viewing: <strong className="text-slate-200 ml-1">
                        {analyticsDaysRange <= 14 ? 'Daily Granularity' : analyticsDaysRange <= 90 ? 'Weekly Averages' : 'Monthly Aggregation'}
                      </strong>
                      <span className="text-[9px] text-slate-500 ml-1.5 font-mono">({dailyTimeSeries.slice(-analyticsDaysRange).length} periods)</span>
                    </span>

                    <div className="flex items-center space-x-1 font-semibold text-[9px]">
                      {['auto', 'daily', 'weekly', 'monthly'].map(agg => (
                        <button
                          key={agg}
                          onClick={() => setAnalyticsAggregation(agg)}
                          className={`px-1.5 py-0.5 rounded capitalize ${
                            analyticsAggregation === agg 
                              ? 'bg-slate-800 text-indigo-300 font-bold border border-slate-700' 
                              : 'text-slate-500 hover:text-slate-300'
                          }`}
                        >
                          {agg}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Top Summary Stat Grid */}
                <div className="grid grid-cols-4 gap-2 bg-slate-900/70 p-3 rounded-2xl border border-slate-800/80 text-center">
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Avg Net Energy</span>
                    <span className={`text-xs font-mono font-bold mt-0.5 block ${todayAggregate.netCaloriesKcal >= 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                      {todayAggregate.netCaloriesKcal > 0 ? `+${todayAggregate.netCaloriesKcal}` : todayAggregate.netCaloriesKcal} kcal
                    </span>
                    <span className="text-[8px] font-mono text-slate-500 block">
                      ({Math.round(todayAggregate.netCaloriesKcal * 4.184)} kJ)
                    </span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Avg Water</span>
                    <span className="text-xs font-mono font-bold text-cyan-400 mt-0.5 block">{((todayAggregate.waterMl || 2500) / 1000).toFixed(1)} L</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Avg Protein</span>
                    <span className="text-xs font-mono font-bold text-indigo-400 mt-0.5 block">36g</span>
                  </div>
                  <div>
                    <span className="text-[9px] text-slate-400 uppercase tracking-wider block">Flare Free</span>
                    <span className="text-xs font-mono font-bold text-teal-400 mt-0.5 block">78%</span>
                  </div>
                </div>

                {/* Metric Segmented Control */}
                <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[10px]">
                  {[
                    { id: 'calories', label: 'Calories', icon: 'Flame', color: 'text-amber-400' },
                    { id: 'exercise', label: 'Activity', icon: 'Activity', color: 'text-emerald-400' },
                    { id: 'water', label: 'Water', icon: 'Droplets', color: 'text-cyan-400' },
                    { id: 'sodium_sugar', label: 'Salt/Sugar', icon: 'Utensils', color: 'text-purple-400' },
                    { id: 'hrv_stress', label: 'HRV', icon: 'Heart', color: 'text-pink-400' },
                    { id: 'symptoms', label: 'Flares', icon: 'AlertCircle', color: 'text-rose-400' },
                  ].map(tab => {
                    const isActive = activeMetricTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => {
                          setActiveMetricTab(tab.id);
                          setSelectedChartPoint(null);
                        }}
                        className={`flex flex-col items-center py-1.5 rounded-xl transition ${
                          isActive 
                            ? 'bg-slate-800 text-white font-bold border border-slate-700 shadow-sm' 
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <Icon name={tab.icon} className={`w-3.5 h-3.5 mb-0.5 ${tab.color}`} />
                        <span className="truncate text-[9.5px]">{tab.label}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Interactive Inspector Pill */}
                {selectedChartPoint && (
                  <div className="bg-indigo-950/60 border border-indigo-500/30 px-3 py-2 rounded-2xl flex items-center justify-between text-xs animate-in fade-in duration-150">
                    <div className="flex items-center space-x-2">
                      <Icon name="Clock" className="w-3.5 h-3.5 text-indigo-400" />
                      <span className="font-semibold text-slate-200">{formatDateLabel(selectedChartPoint.date)}</span>
                    </div>
                    <div className="font-mono text-indigo-300 font-bold">
                      {activeMetricTab === 'calories' && `+${selectedChartPoint.caloriesConsumedKcal} in / -${selectedChartPoint.caloriesBurnedTotalKcal} burn (Net: ${selectedChartPoint.netCaloriesKcal > 0 ? `+${selectedChartPoint.netCaloriesKcal}` : selectedChartPoint.netCaloriesKcal})`}
                      {activeMetricTab === 'exercise' && `${(selectedChartPoint.steps || 0).toLocaleString()} steps`}
                      {activeMetricTab === 'water' && `${((selectedChartPoint.waterMl || 0)/1000).toFixed(1)} L water`}
                      {activeMetricTab === 'sodium_sugar' && `${selectedChartPoint.sodiumMg || 0}mg Na / ${selectedChartPoint.sugarG || 0}g Sugar`}
                      {activeMetricTab === 'hrv_stress' && `${selectedChartPoint.hrvMs || 58} ms HRV`}
                      {activeMetricTab === 'symptoms' && `${selectedChartPoint.symptomScore || 0} flare score`}
                    </div>
                    <button onClick={() => setSelectedChartPoint(null)} className="text-slate-400 hover:text-white ml-1">
                      <Icon name="X" className="w-3 h-3" />
                    </button>
                  </div>
                )}

                {/* CHART 0: CALORIES (BI-DIRECTIONAL ENERGY BALANCE) */}
                {activeMetricTab === 'calories' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Flame" className="w-3.5 h-3.5 text-amber-400 mr-1.5" />
                          Energy Balance (kcal & kJ)
                        </h3>
                        <p className="text-[10px] text-slate-400">Intake (+) vs Workout & Active Burn (-)</p>
                      </div>
                      <span className="text-[10px] font-mono bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-lg border border-amber-500/30">
                        Net Balance
                      </span>
                    </div>

                    <div className="flex items-center justify-between gap-1.5 h-44 pt-2">
                      {dailyTimeSeries.slice(-analyticsDaysRange).map((d, idx) => {
                        const consumed = d.caloriesConsumedKcal || 0;
                        const burned = d.caloriesBurnedTotalKcal || 0;
                        const net = d.netCaloriesKcal || 0;

                        const maxScale = 2200;
                        const consumedHeightPct = Math.min(100, Math.round((consumed / maxScale) * 100));
                        const burnedHeightPct = Math.min(100, Math.round((burned / maxScale) * 100));

                        return (
                          <div 
                            key={idx} 
                            onClick={() => setSelectedChartPoint(d)}
                            className="flex-1 flex flex-col items-center h-full group min-w-0 cursor-pointer"
                          >
                            <div className="h-4 flex items-end justify-center text-[7.5px] font-mono text-amber-400 font-bold truncate w-full">
                              {consumed > 0 ? `+${consumed}` : ''}
                            </div>

                            <div className="w-full flex-1 flex items-end justify-center px-1">
                              <div 
                                className="w-full max-w-[12px] bg-gradient-to-t from-amber-600 to-yellow-400 rounded-t-md shadow-sm shadow-amber-500/30 transition-all duration-500"
                                style={{ height: `${Math.max(consumed > 0 ? 8 : 0, consumedHeightPct)}%` }}
                                title={`Intake: +${consumed} kcal`}
                              ></div>
                            </div>

                            <div className="w-full h-0.5 bg-slate-700/80 relative my-0.5">
                              <div 
                                className={`w-1.5 h-1.5 rounded-full mx-auto -translate-y-0.5 ${net >= 0 ? 'bg-amber-400' : 'bg-emerald-400'}`} 
                                title={`Net: ${net > 0 ? `+${net}` : net} kcal`}
                              />
                            </div>

                            <div className="w-full flex-1 flex items-start justify-center px-1">
                              <div 
                                className="w-full max-w-[12px] bg-gradient-to-b from-rose-500 to-red-600 rounded-b-md shadow-sm shadow-rose-500/30 transition-all duration-500"
                                style={{ height: `${Math.max(burned > 0 ? 8 : 0, burnedHeightPct)}%` }}
                                title={`Burned: -${burned} kcal`}
                              ></div>
                            </div>

                            <div className="h-4 flex items-start justify-center text-[7.5px] font-mono text-rose-400 font-bold truncate w-full">
                              {burned > 0 ? `-${burned}` : ''}
                            </div>

                            <span className="text-[9px] font-medium text-slate-400 truncate w-full text-center mt-1">
                              {formatShortDate(d.date)}
                            </span>
                          </div>
                        );
                      })}
                    </div>

                    <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-400">
                      <div className="flex items-center space-x-3">
                        <span className="flex items-center">
                          <span className="w-2 h-2 rounded-sm bg-amber-400 mr-1"></span> Consumed (+)
                        </span>
                        <span className="flex items-center">
                          <span className="w-2 h-2 rounded-sm bg-rose-500 mr-1"></span> Burned (-)
                        </span>
                      </div>
                      <span className="font-mono text-slate-300">
                        Net Today: <strong className={todayAggregate.netCaloriesKcal >= 0 ? 'text-amber-400' : 'text-emerald-400'}>
                          {todayAggregate.netCaloriesKcal > 0 ? `+${todayAggregate.netCaloriesKcal}` : todayAggregate.netCaloriesKcal} kcal ({Math.round(todayAggregate.netCaloriesKcal * 4.184)} kJ)
                        </strong>
                      </span>
                    </div>
                  </div>
                )}

                {/* CHART 1: ACTIVITY & STEPS */}
                {activeMetricTab === 'exercise' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Activity" className="w-3.5 h-3.5 text-emerald-400 mr-1.5" />
                          Daily Step Count & Workout Focus
                        </h3>
                        <p className="text-[10px] text-slate-400">Target: {targetSteps.toLocaleString()} steps/day</p>
                      </div>
                      <span className="text-[10px] font-mono bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-lg border border-emerald-500/30">
                        Motility Support
                      </span>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-40 pt-4">
                      {dailyTimeSeries.slice(-analyticsDaysRange).map((d, idx) => {
                        const steps = d.steps || 0;
                        const heightPct = Math.min(100, Math.round((steps / (targetSteps * 1.35)) * 100));
                        const reachedGoal = steps >= targetSteps;

                        return (
                          <div 
                            key={idx} 
                            onClick={() => setSelectedChartPoint(d)}
                            className="flex-1 flex flex-col items-center h-full justify-end group min-w-0 cursor-pointer"
                          >
                            <div className="text-[7.5px] font-mono font-bold text-slate-300 mb-0.5 text-center leading-tight truncate w-full">
                              <span className={reachedGoal ? 'text-emerald-300 font-extrabold' : 'text-slate-400'}>
                                {steps > 0 ? (steps > 999 ? `${(steps/1000).toFixed(1)}k` : steps) : '0'}
                              </span>
                              {d.workoutFocus && (
                                <span className="block text-[8px]" title={d.workoutFocus}>
                                  {d.workoutFocus === 'lifting_upper' ? '🏋️' : d.workoutFocus === 'lifting_lower' ? '🦵' : d.workoutFocus === 'cardio_hiit' ? '🏃' : '🧘'}
                                </span>
                              )}
                            </div>
                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                              <div 
                                className={`w-full rounded-lg transition-all duration-500 ${
                                  reachedGoal 
                                    ? 'bg-gradient-to-t from-emerald-600 to-teal-400 shadow-sm shadow-emerald-500/30' 
                                    : 'bg-gradient-to-t from-slate-700 to-emerald-500/80'
                                }`}
                                style={{ height: `${Math.max(8, heightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">
                              {formatShortDate(d.date)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* CHART 2: WATER HYDRATION */}
                {activeMetricTab === 'water' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Droplets" className="w-3.5 h-3.5 text-cyan-400 mr-1.5" />
                          Hydration Intake (Litres)
                        </h3>
                        <p className="text-[10px] text-slate-400">Target: {(targetWaterMl/1000).toFixed(1)} L/day</p>
                      </div>
                      <span className="text-[10px] font-mono bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-lg border border-cyan-500/30">
                        Cerebral & Gut Support
                      </span>
                    </div>

                    <div className="flex items-end justify-between gap-1.5 h-36 pt-4">
                      {dailyTimeSeries.slice(-analyticsDaysRange).map((d, idx) => {
                        const litres = (d.waterMl / 1000);
                        const heightPct = Math.min(100, Math.round((litres / ((targetWaterMl / 1000) * 1.3)) * 100));
                        const reachedTarget = d.waterMl >= targetWaterMl;

                        return (
                          <div 
                            key={idx} 
                            onClick={() => setSelectedChartPoint(d)}
                            className="flex-1 flex flex-col items-center h-full justify-end group min-w-0 cursor-pointer"
                          >
                            <span className={`text-[7.5px] font-mono mb-1 truncate w-full text-center ${reachedTarget ? 'text-cyan-300 font-bold' : 'text-slate-400'}`}>
                              {litres > 0 ? litres.toFixed(1) : '0'}
                            </span>
                            <div className="w-full bg-slate-950 rounded-xl h-full flex items-end p-0.5 overflow-hidden">
                              <div 
                                className={`w-full rounded-lg transition-all duration-500 ${
                                  reachedTarget
                                    ? 'bg-gradient-to-t from-cyan-600 to-teal-400 shadow-sm shadow-cyan-500/30'
                                    : 'bg-gradient-to-t from-slate-700 to-cyan-500/70'
                                }`}
                                style={{ height: `${Math.max(8, heightPct)}%` }}
                              ></div>
                            </div>
                            <span className="text-[9px] font-medium text-slate-400 mt-2 truncate w-full text-center">
                              {formatShortDate(d.date)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* CHART 3: SODIUM & SUGAR */}
                {activeMetricTab === 'sodium_sugar' && (
                  <div className="bg-slate-900/70 p-4 rounded-3xl border border-slate-800/80 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <div>
                        <h3 className="font-bold text-white flex items-center">
                          <Icon name="Utensils" className="w-3.5 h-3.5 text-purple-400 mr-1.5" />
                          Sodium vs Sugar Balance
                        </h3>

                  </div>
                  <input

                    max="160"

                  />
                  <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                    <span>40kg</span>
                    <span>75kg (Avg)</span>
                    <span>160kg</span>
                  </div>
                </div>

                <div className="space-y-1.5">

                    </span>
                    <span className="text-emerald-400 font-mono font-bold">{tempSteps.toLocaleString()}</span>
                  </div>
                  <input
                    type="range"
                    min="3000"
                    max="20000"
                    step="500"
                    value={tempSteps}
                    onChange={(e) => setTempSteps(Number(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                    <span>3k</span>
                    <span>8k (Default)</span>
                    <span>20k</span>
                  </div>
                </div>

                <div className="space-y-1.5">
                  <div className="flex justify-between text-xs font-semibold text-slate-300">
                    <span className="flex items-center">
                      <Icon name="Droplets" className="w-3.5 h-3.5 mr-1 text-cyan-400" /> Water Target
                    </span>
                    <span className="text-cyan-400 font-mono font-bold">{tempWaterL} Litres</span>
                  </div>
                  <input
                    type="range"
                    min="1.0"
                    max="5.0"
                    step="0.1"
                    value={tempWaterL}
                    onChange={(e) => setTempWaterL(e.target.value)}
                    className="w-full accent-cyan-400 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-slate-500 font-mono">
                    <span>1.0L</span>
                    <span>2.5L</span>
                    <span>5.0L</span>
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-800 space-y-2">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
                    Data Retention & Backup (Multi-Year)
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logs, null, 2));
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.setAttribute("href", dataStr);
                        downloadAnchor.setAttribute("download", `pulsehealth_backup_${new Date().toISOString().split('T')[0]}.json`);
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                        showToast('Backup file downloaded!');
                      }}
                      className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[10px] font-semibold flex items-center justify-center space-x-1"
                    >
                      <Icon name="Download" className="w-3 h-3 text-indigo-400" />
                      <span>Download Backup</span>
                    </button>
                    <label className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-[10px] font-semibold flex items-center justify-center space-x-1 cursor-pointer">
                      <Icon name="RefreshCw" className="w-3 h-3 text-emerald-400" />
                      <span>Restore Data</span>
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (event) => {
                            try {
                              const parsed = JSON.parse(event.target.result);
                              if (Array.isArray(parsed)) {
                                setLogs(parsed);
                                showToast(`Successfully restored ${parsed.length} logs!`);
                                setShowSettingsModal(false);
                              }
                            } catch {
                              showToast('Invalid backup file');
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>

                <div className="pt-2 flex gap-2">
                  <button

                    onClick={() => setShowSettingsModal(false)}

                  <button
                    type="button"

                      setTargetSteps(Number(tempSteps));

                      try {
                        localStorage.setItem('pulsehealth_user_weight', String(tempWeightKg));
                      } catch (e) {
                        console.error(e);
                      }
                      setShowSettingsModal(false);
                      showToast('Goals & body weight updated!');

                    className="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-500 shadow-md"

              </div>
            </div>

                <div className="flex items-center space-x-2 text-rose-400">
                  <div className="w-9 h-9 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center">
                    <Icon name="Trash2" className="w-5 h-5 text-rose-400" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-white">Delete Entry?</h3>
                    <p className="text-[11px] text-slate-400">This action will permanently remove this record.</p>

                </div>

                <p className="text-xs text-slate-300 leading-relaxed bg-slate-950/60 p-3 rounded-2xl border border-slate-800/80">

                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setLogs(prev => prev.filter(item => item.id !== deletingItemId));

                      showToast('Entry deleted successfully');
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md shadow-rose-600/30 transition flex items-center justify-center space-x-1"

                    <Icon name="Trash2" className="w-3.5 h-3.5" />

                  </button>

                  <div className="flex items-center space-x-2">

                      <Icon name="Edit2" className="w-4 h-4" />
                    </div>
                    <div>

                    </div>
                  </div>

                    ...(editingItem.carbsG !== undefined ? { carbsG: Number(editingItem.carbsG) } : {}),
                    ...(editingItem.sugarG !== undefined ? { sugarG: Number(editingItem.sugarG) } : {}),
                    ...(editingItem.sodiumMg !== undefined ? { sodiumMg: Number(editingItem.sodiumMg) } : {}),
                    ...(editingItem.waterMl !== undefined ? { waterMl: Number(editingItem.waterMl) } : {}),
                    ...(editingItem.durationMins !== undefined ? { durationMins: Number(editingItem.durationMins) } : {}),
                    ...(editingItem.intensity !== undefined ? { intensity: Number(editingItem.intensity) } : {}),
                    ...(editingItem.steps !== undefined ? { steps: Number(editingItem.steps) } : {}),
                    ...(editingItem.caloriesBurnedKcal !== undefined ? { caloriesBurnedKcal: Number(editingItem.caloriesBurnedKcal) } : {}),
                    ...(editingItem.severity !== undefined ? { severity: Number(editingItem.severity) } : {}),
                    ...(editingItem.bristolType !== undefined ? { bristolType: Number(editingItem.bristolType) } : {}),
                    ...(editingItem.sleepHours !== undefined ? { sleepHours: Number(editingItem.sleepHours) } : {}),
                    ...(editingItem.stressLevel !== undefined ? { stressLevel: Number(editingItem.stressLevel) } : {}),
                    ...(editingItem.hrvMs !== undefined ? { hrvMs: Number(editingItem.hrvMs) } : {}),
                    ...(editingItem.restingHr !== undefined ? { restingHr: Number(editingItem.restingHr) } : {}),

                      </label>
                      <input
                        type="text"
                        value={editingItem.title !== undefined ? editingItem.title : editingItem.name || ''}
                        onChange={(e) => setEditingItem({ 
                          ...editingItem, 
                          ...(editingItem.title !== undefined ? { title: e.target.value } : { name: e.target.value })
                        })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                        required
                      />
                    </div>
                  )}

                  {editingItem.type === 'meal' && (
                    <div className="space-y-3 bg-slate-950/60 p-3 rounded-2xl border border-slate-800">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-amber-400 font-semibold flex items-center">
                          <Icon name="Flame" className="w-3.5 h-3.5 mr-1" /> Energy Intake
                        </span>
                        <span className="font-mono text-amber-400 font-bold">{editingItem.caloriesKcal || 0} kcal</span>
                      </div>
                      <input
                        type="range"
                        min="0"
                        max="2000"
                        step="25"
                        value={editingItem.caloriesKcal || 0}
                        onChange={(e) => setEditingItem({ ...editingItem, caloriesKcal: Number(e.target.value) })}
                        className="w-full accent-amber-500 cursor-pointer"
                      />

                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div>
                          <span className="text-[10px] text-slate-400 block">Protein (g)</span>
                          <input
                            type="number"
                            min="0"
                            max="200"
                            value={editingItem.proteinG || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, proteinG: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Carbs (g)</span>
                          <input
                            type="number"
                            min="0"
                            max="300"
                            value={editingItem.carbsG || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, carbsG: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Sugar (g)</span>
                          <input
                            type="number"
                            min="0"
                            max="150"
                            value={editingItem.sugarG || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, sugarG: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                        <div>
                          <span className="text-[10px] text-slate-400 block">Sodium (mg)</span>
                          <input
                            type="number"
                            min="0"
                            max="5000"
                            value={editingItem.sodiumMg || 0}
                            onChange={(e) => setEditingItem({ ...editingItem, sodiumMg: Number(e.target.value) })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200"
                          />
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs pt-1">
                        <span className="text-slate-400">Late Night Meal?</span>
                        <button
                          type="button"
                          onClick={() => setEditingItem({ ...editingItem, isLateNight: !editingItem.isLateNight })}
                          className={`px-3 py-1 rounded-xl text-[11px] font-bold transition ${
                            editingItem.isLateNight ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'
                          }`}
                        >
                          {editingItem.isLateNight ? '🌙 Yes' : 'No'}
                        </button>
                      </div>
                    </div>
                  )}

                  {editingItem.type !== 'lifestyle' && (
                    <div>
                      <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                        Notes
                      </label>
                      <textarea
                        value={editingItem.notes || ''}
                        onChange={(e) => setEditingItem({ ...editingItem, notes: e.target.value })}
                        rows={2}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"
                        placeholder="Add or update notes..."
                      />
                    </div>
                  )}

                  <div className="flex gap-2 pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setEditingItem(null)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md shadow-indigo-600/30 transition flex items-center justify-center space-x-1"
                    >
                      <Icon name="Check" className="w-3.5 h-3.5" />
                      <span>Save Changes</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
